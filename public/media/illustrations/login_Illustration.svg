<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     width="600" height="800" 
     viewBox="0 0 600 800"
     id="SOFTM_Login_Illustration_V2"
     data-name="SOFT-M Login Page Illustration V2">
  <title>SOFT-M Login Illustration</title>
  <desc>Illustration éducation et enfance pour page de connexion SOFT-M - sans texte</desc>
  
  <defs>
    <!-- Couleurs douces inspirées des images -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F6F3"/>
      <stop offset="100%" style="stop-color:#EDE8E2"/>
    </linearGradient>
    
    <linearGradient id="warmPeach" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5DDD3"/>
      <stop offset="100%" style="stop-color:#E8C9BC"/>
    </linearGradient>
    
    <linearGradient id="softBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B8D4E3"/>
      <stop offset="100%" style="stop-color:#9BC4D9"/>
    </linearGradient>
    
    <linearGradient id="mintGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C5DDD3"/>
      <stop offset="100%" style="stop-color:#A8CBBE"/>
    </linearGradient>
    
    <linearGradient id="lavender" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4C8E0"/>
      <stop offset="100%" style="stop-color:#C2B3D4"/>
    </linearGradient>
    
    <linearGradient id="cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8E7"/>
      <stop offset="100%" style="stop-color:#F5ECD8"/>
    </linearGradient>
    
    <linearGradient id="coral" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F2B8A2"/>
      <stop offset="100%" style="stop-color:#E8A08A"/>
    </linearGradient>
  </defs>
  
  <!-- Fond principal -->
  <rect width="600" height="800" fill="url(#bgGradient)"/>
  
  <!-- Cercles décoratifs en arrière-plan -->
  <circle cx="50" cy="100" r="80" fill="#F5DDD3" opacity="0.3"/>
  <circle cx="550" cy="200" r="120" fill="#B8D4E3" opacity="0.2"/>
  <circle cx="100" cy="700" r="150" fill="#C5DDD3" opacity="0.25"/>
  <circle cx="500" cy="650" r="100" fill="#D4C8E0" opacity="0.2"/>
  <circle cx="300" cy="400" r="200" fill="#FFF8E7" opacity="0.15"/>
  
  <!-- Groupe principal d'illustration centré -->
  <g transform="translate(300, 380)">
    
    <!-- Cubes en bois empilés (sans lettres) -->
    <!-- Cube 1 - base gauche -->
    <g transform="translate(-140, 20)">
      <rect x="0" y="0" width="65" height="65" rx="8" fill="url(#warmPeach)" stroke="#D9B8A8" stroke-width="2"/>
      <rect x="5" y="5" width="55" height="55" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <!-- Motif cercle -->
      <circle cx="32" cy="32" r="18" fill="none" stroke="#D9B8A8" stroke-width="3"/>
    </g>
    
    <!-- Cube 2 - base milieu -->
    <g transform="translate(-65, 30)">
      <rect x="0" y="0" width="60" height="60" rx="8" fill="url(#softBlue)" stroke="#8AAFC4" stroke-width="2"/>
      <rect x="5" y="5" width="50" height="50" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <!-- Motif triangle -->
      <polygon points="30,12 48,48 12,48" fill="none" stroke="#8AAFC4" stroke-width="3"/>
    </g>
    
    <!-- Cube 3 - base droite -->
    <g transform="translate(5, 15)">
      <rect x="0" y="0" width="70" height="70" rx="8" fill="url(#mintGreen)" stroke="#8DB8A5" stroke-width="2"/>
      <rect x="5" y="5" width="60" height="60" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <!-- Motif carré -->
      <rect x="20" y="20" width="30" height="30" rx="4" fill="none" stroke="#8DB8A5" stroke-width="3"/>
    </g>
    
    <!-- Cube 4 - empilé niveau 2 -->
    <g transform="translate(-110, -50)">
      <rect x="0" y="0" width="58" height="58" rx="8" fill="url(#lavender)" stroke="#A89BC0" stroke-width="2"/>
      <rect x="5" y="5" width="48" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <!-- Motif étoile -->
      <polygon points="29,8 33,22 47,22 36,31 40,45 29,36 18,45 22,31 11,22 25,22" fill="none" stroke="#A89BC0" stroke-width="2"/>
    </g>
    
    <!-- Cube 5 - empilé niveau 2 -->
    <g transform="translate(-40, -45)">
      <rect x="0" y="0" width="62" height="62" rx="8" fill="url(#cream)" stroke="#D9CEB5" stroke-width="2"/>
      <rect x="5" y="5" width="52" height="52" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <!-- Motif cœur -->
      <path d="M31,20 C31,14 24,12 20,16 C16,20 16,26 31,40 C46,26 46,20 42,16 C38,12 31,14 31,20" fill="none" stroke="#D9CEB5" stroke-width="2.5"/>
    </g>
    
    <!-- Cube 6 - sommet -->
    <g transform="translate(-85, -115)">
      <rect x="0" y="0" width="55" height="55" rx="8" fill="url(#coral)" stroke="#D99580" stroke-width="2"/>
      <rect x="5" y="5" width="45" height="45" rx="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <!-- Motif soleil -->
      <circle cx="27" cy="27" r="10" fill="none" stroke="#D99580" stroke-width="2.5"/>
      <line x1="27" y1="10" x2="27" y2="5" stroke="#D99580" stroke-width="2"/>
      <line x1="27" y1="44" x2="27" y2="49" stroke="#D99580" stroke-width="2"/>
      <line x1="10" y1="27" x2="5" y2="27" stroke="#D99580" stroke-width="2"/>
      <line x1="44" y1="27" x2="49" y2="27" stroke="#D99580" stroke-width="2"/>
    </g>
    
    <!-- Crayons de couleur -->
    <g transform="translate(-180, 100) rotate(-20)">
      <!-- Crayon bleu -->
      <rect x="0" y="0" width="14" height="120" rx="1" fill="#7EB3C9"/>
      <polygon points="7,-18 0,0 14,0" fill="#F5DDD3"/>
      <rect x="0" y="105" width="14" height="15" rx="1" fill="#5A8EA5"/>
      <line x1="2" y1="25" x2="2" y2="100" stroke="#9BC9DB" stroke-width="2"/>
    </g>
    
    <g transform="translate(-150, 110) rotate(-10)">
      <!-- Crayon vert -->
      <rect x="0" y="0" width="14" height="130" rx="1" fill="#8DB8A5"/>
      <polygon points="7,-18 0,0 14,0" fill="#F5DDD3"/>
      <rect x="0" y="115" width="14" height="15" rx="1" fill="#5A8A72"/>
      <line x1="2" y1="25" x2="2" y2="110" stroke="#A8CBBE" stroke-width="2"/>
    </g>
    
    <g transform="translate(-120, 105) rotate(0)">
      <!-- Crayon violet -->
      <rect x="0" y="0" width="14" height="115" rx="1" fill="#B8A5C9"/>
      <polygon points="7,-18 0,0 14,0" fill="#F5DDD3"/>
      <rect x="0" y="100" width="14" height="15" rx="1" fill="#8A72A5"/>
      <line x1="2" y1="25" x2="2" y2="95" stroke="#D4C8E0" stroke-width="2"/>
    </g>
    
    <g transform="translate(-90, 115) rotate(8)">
      <!-- Crayon pêche -->
      <rect x="0" y="0" width="14" height="105" rx="1" fill="#E8C9BC"/>
      <polygon points="7,-18 0,0 14,0" fill="#F5DDD3"/>
      <rect x="0" y="90" width="14" height="15" rx="1" fill="#C9A595"/>
      <line x1="2" y1="25" x2="2" y2="85" stroke="#F5DDD3" stroke-width="2"/>
    </g>
    
    <g transform="translate(-60, 120) rotate(15)">
      <!-- Crayon jaune -->
      <rect x="0" y="0" width="14" height="125" rx="1" fill="#E8D9A5"/>
      <polygon points="7,-18 0,0 14,0" fill="#F5DDD3"/>
      <rect x="0" y="110" width="14" height="15" rx="1" fill="#C9BA72"/>
      <line x1="2" y1="25" x2="2" y2="105" stroke="#FFF8E7" stroke-width="2"/>
    </g>
    
    <g transform="translate(-30, 118) rotate(22)">
      <!-- Crayon rose -->
      <rect x="0" y="0" width="14" height="110" rx="1" fill="#E8B0B0"/>
      <polygon points="7,-18 0,0 14,0" fill="#F5DDD3"/>
      <rect x="0" y="95" width="14" height="15" rx="1" fill="#C98A8A"/>
      <line x1="2" y1="25" x2="2" y2="90" stroke="#F5D0D0" stroke-width="2"/>
    </g>
    
    <!-- Petit avion jouet -->
    <g transform="translate(120, -80) rotate(20)">
      <!-- Corps avion -->
      <ellipse cx="0" cy="0" rx="45" ry="12" fill="url(#softBlue)" stroke="#7EB3C9" stroke-width="1.5"/>
      <!-- Ailes -->
      <ellipse cx="0" cy="0" rx="12" ry="35" fill="#9BC4D9" stroke="#7EB3C9" stroke-width="1"/>
      <!-- Queue -->
      <ellipse cx="-40" cy="0" rx="5" ry="15" fill="#9BC4D9" stroke="#7EB3C9" stroke-width="1"/>
      <!-- Cockpit -->
      <ellipse cx="25" cy="0" rx="12" ry="8" fill="#B8D4E3" stroke="#7EB3C9" stroke-width="1"/>
      <!-- Hélice -->
      <ellipse cx="48" cy="0" rx="3" ry="18" fill="#5A7A8A"/>
      <circle cx="48" cy="0" r="5" fill="#333333"/>
    </g>
    
    <!-- Livre ouvert -->
    <g transform="translate(80, 110)">
      <path d="M0,40 Q30,32 60,40 L60,0 Q30,8 0,0 Z" fill="url(#cream)" stroke="#D9CEB5" stroke-width="1.5"/>
      <path d="M60,40 Q90,32 120,40 L120,0 Q90,8 60,0 Z" fill="#FFF8E7" stroke="#D9CEB5" stroke-width="1.5"/>
      <line x1="60" y1="0" x2="60" y2="40" stroke="#D9CEB5" stroke-width="2"/>
      <!-- Lignes de texte stylisées -->
      <line x1="12" y1="12" x2="48" y2="12" stroke="#D9CEB5" stroke-width="1.5" opacity="0.5"/>
      <line x1="12" y1="20" x2="42" y2="20" stroke="#D9CEB5" stroke-width="1.5" opacity="0.5"/>
      <line x1="12" y1="28" x2="45" y2="28" stroke="#D9CEB5" stroke-width="1.5" opacity="0.5"/>
      <line x1="72" y1="12" x2="108" y2="12" stroke="#D9CEB5" stroke-width="1.5" opacity="0.5"/>
      <line x1="72" y1="20" x2="102" y2="20" stroke="#D9CEB5" stroke-width="1.5" opacity="0.5"/>
      <line x1="72" y1="28" x2="105" y2="28" stroke="#D9CEB5" stroke-width="1.5" opacity="0.5"/>
    </g>
    
    <!-- Ballon -->
    <g transform="translate(160, 30)">
      <circle cx="0" cy="0" r="30" fill="url(#coral)" stroke="#D99580" stroke-width="2"/>
      <ellipse cx="-8" cy="-8" rx="8" ry="5" fill="#FFFFFF" opacity="0.4"/>
      <path d="M0,30 Q5,40 0,50" stroke="#D99580" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Étoiles décoratives -->
    <g fill="#E8D9A5" opacity="0.9">
      <polygon points="0,0 3,10 13,10 5,17 8,27 0,20 -8,27 -5,17 -13,10 -3,10" transform="translate(-200, -100) scale(0.7)"/>
      <polygon points="0,0 3,10 13,10 5,17 8,27 0,20 -8,27 -5,17 -13,10 -3,10" transform="translate(180, -130) scale(0.5)"/>
      <polygon points="0,0 3,10 13,10 5,17 8,27 0,20 -8,27 -5,17 -13,10 -3,10" transform="translate(-180, 60) scale(0.4)"/>
    </g>
    
    <!-- Points décoratifs -->
    <g fill="#D4C8E0" opacity="0.7">
      <circle cx="-200" cy="-150" r="5"/>
      <circle cx="-185" cy="-165" r="3"/>
      <circle cx="-210" cy="-135" r="4"/>
      <circle cx="200" cy="80" r="5"/>
      <circle cx="215" cy="65" r="3"/>
      <circle cx="190" cy="95" r="4"/>
      <circle cx="-170" cy="180" r="4"/>
      <circle cx="170" cy="170" r="3"/>
    </g>
    
    <!-- Petits cœurs -->
    <g fill="#F2B8A2" opacity="0.6">
      <path d="M0,3 C0,0 -3,-1 -5,1 C-7,3 -7,6 0,12 C7,6 7,3 5,1 C3,-1 0,0 0,3" transform="translate(-220, 20) scale(0.8)"/>
      <path d="M0,3 C0,0 -3,-1 -5,1 C-7,3 -7,6 0,12 C7,6 7,3 5,1 C3,-1 0,0 0,3" transform="translate(210, -50) scale(0.6)"/>
    </g>
    
  </g>
  
  <!-- Ligne décorative ondulée en bas -->
  <path d="M0,750 Q100,730 200,750 T400,750 T600,750 L600,800 L0,800 Z" fill="#C5DDD3" opacity="0.3"/>
  <path d="M0,770 Q150,750 300,770 T600,770 L600,800 L0,800 Z" fill="#E8C9BC" opacity="0.25"/>
  
</svg>
