<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="110" height="22" viewBox="0 0 110 22" role="img" aria-label="Oui CRM">
  <title>Oui CRM</title>
  <defs>
    <linearGradient id="ouiRing" x1="2" y1="20" x2="21" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0369A1"/>
      <stop offset="1" stop-color="#54A0FF"/>
    </linearGradient>
    <linearGradient id="ouiCheck" x1="7" y1="16" x2="20" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#FDCB6E"/>
    </linearGradient>
    <linearGradient id="ouiWord" x1="29" y1="18" x2="72" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0369A1"/>
      <stop offset="1" stop-color="#54A0FF"/>
    </linearGradient>
  </defs>
  <!-- Symbole : le "O" ouvert + la validation -->
  <g transform="scale(0.91667)">
    <path d="M20.37 10.52 A8.5 8.5 0 1 1 14.91 4.01"
          fill="none" stroke="url(#ouiRing)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M7.4 12.4 L11 16 L19.8 5.6"
          fill="none" stroke="url(#ouiCheck)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Signature -->
  <text x="29" y="17.1"
        font-family="'Plus Jakarta Sans','Inter',ui-sans-serif,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="16.5" font-weight="800" letter-spacing="-0.2">
    <tspan fill="url(#ouiWord)">OUI</tspan><tspan dx="4" fill="#FFFFFF">CRM</tspan>
  </text>
</svg>
