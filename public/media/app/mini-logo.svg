<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Oui CRM">
  <title>Oui CRM</title>
  <defs>
    <linearGradient id="ouiRing" x1="2" y1="20" x2="21" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0369A1"/>
      <stop offset="1" stop-color="#54A0FF"/>
    </linearGradient>
    <linearGradient id="ouiCheck" x1="7" y1="16" x2="20" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B6B"/>
      <stop offset="1" stop-color="#FDCB6E"/>
    </linearGradient>
  </defs>
  <!-- Le "O" de Oui : anneau ouvert en haut a droite -->
  <path d="M20.37 10.52 A8.5 8.5 0 1 1 14.91 4.01"
        fill="none" stroke="url(#ouiRing)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- La validation : le "oui" qui sort du cercle -->
  <path d="M7.4 12.4 L11 16 L19.8 5.6"
        fill="none" stroke="url(#ouiCheck)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
