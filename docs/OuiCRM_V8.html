function saveAction(orgId,multi,aid){
  if(!guard('actions',aid?'modifier':'creer'))return;
  const db=getDB();
  const targets=multi||[orgId||Number(val('aOrg'))];
  const base={type:val('aType'),date:val('aDate'),statut:val('aStatut'),userId:Number(val('aUser')),
    resultat:val('aRes'),compteRendu:val('aCR')};
  if(aid){Object.assign(db.actions.find(x=>x.id===aid),base,{contactId:val('aContact')?Number(val('aContact')):null})}
  else targets.forEach(t=>{
    db.actions.push({id:nextId('action'),orgId:t,contactId:val('aContact')?Number(val('aContact')):null,...base});
    const o=org(t);
    if(o){
      if(base.statut==='Réalisée'&&['Non contacté','À contacter'].includes(o.statutCommercial))o.statutCommercial='En cours de prospection';
      if(['RDV physique','Visioconférence','Démonstration'].includes(base.type)&&base.statut==='Planifiée'&&o.statutClient==='Non client')o.statutCommercial='RDV programmé';
      if(base.resultat==='Non intéressé')o.statutCommercial='Clôturé';
      o.updatedAt=todayISO();
    }
  });
  const nt=val('aNextType');
  if(nt&&!aid)targets.forEach(t=>db.actions.push({id:nextId('action'),orgId:t,contactId:null,type:nt,
    date:val('aNextDate'),statut:'Planifiée',userId:Number(val('aUser')),resultat:'',compteRendu:'Suite de : '+base.type}));
  commit();closeModal();SEL.clear();
  toast(targets.length>1?targets.length+' actions enregistrées.':'Action enregistrée.');
  rerender();if(DRAWER)refreshDrawer('actions');
}
function completeAction(id){
  const a=getDB().actions.find(x=>x.id===id);if(!a)return;
  a.statut='Réalisée';const o=org(a.orgId);
  if(o&&['Non contacté','À contacter'].includes(o.statutCommercial))o.statutCommercial='En cours de prospection';
  commit();toast('Action marquée réalisée.');rerender();if(DRAWER)refreshDrawer('actions');
}

  if(!guardS('supprimerDefinitif'))return;
  const db=getDB();db.actions=db.actions.filter(a=>a.id!==id);
  commit();toast('Action supprimée.');rerender();if(DRAWER)refreshDrawer('actions');
}

         return `<tr class="clickable" onclick="openDrawer(${o.id})"><td><span class="row-title">${esc(o.nom)}</span><span class="subtle">${esc(o.ville)} · ${esc(strate(o.population))}</span></td>
         <td>${badge(o.statutCommercial)}</td><td>${badge(o.priorite)}</td>
         <td>${la?`<b>${esc(la.type)}</b><span class="subtle">${frDate(la.date)}</span>`:'—'}</td>
         <td>${na?`<span class="${isLate(na.date)?'tag red':''}">${esc(na.type)} · ${frDate(na.date)}</span>`:'<span class="subtle" style="margin:0">À planifier</span>'}</td>
         <td>${esc(o.commercialId?userNom(o.commercialId):'Non affecté')}</td></tr>`}).join('')
        :emptyRow(6,'Aucun organisme en prospection','Lancez une campagne ou enregistrez une première action.')}
       </tbody></table></div></div>`);
  const bind=(id,k)=>{const e=document.getElementById(id);if(!e)return;
    const h=()=>{F[k]=e.value;RENDER.prospection()};e.tagName==='INPUT'?e.oninput=debounce(h,250):e.onchange=h};
  bind('pSearch','search');bind('pDept','dept');bind('pPrio','prio');bind('pCom','com');
};
let _drag=null;
function dragProsp(e,id){_drag=id;e.target.classList.add('drag')}
function dropProsp(e,statut){
  e.preventDefault();
  if(!can('organismes','modifier')){_drag=null;return refuse()}document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
  if(!_drag)return;const o=org(_drag);
  if(o&&o.statutCommercial!==statut){o.statutCommercial=statut;o.updatedAt=todayISO();commit();toast(o.nom+' → '+statut)}
  _drag=null;RENDER.prospection();
}
</script>
<script>
/* ===================== Opportunités ===================== */
RENDER.opportunites=function(){
  const db=getDB();
  const f=window._oF||{com:'',dept:''};
  let list=scopeOpps(db.opps).filter(o=>{const oo=org(o.orgId);return oo&&complet(oo)&&(!f.com||o.respId==f.com)&&(!f.dept||oo.dept===f.dept)});
  const ouvertes=list.filter(o=>!['Gagnée','Perdue'].includes(o.stage));
  document.getElementById('page-opportunites').innerHTML=
  pageHead('Opportunités','Le pipeline commercial. Une opportunité naît d’un besoin qualifié et se termine par un contrat ou un refus.',
   `${can('opportunites','creer')?'<button class="btn primary" onclick="openOppModal()">+ Nouvelle opportunité</button>':''}`)
  +`<div class="cards">
     <div class="card kpi accent"><span>Pipeline ouvert</span><b>${money(sum(ouvertes,valeurOpp))}</b><small>${ouvertes.length} opportunités · 1re année</small></div>
     <div class="card kpi"><span>Pondéré</span><b>${money(sum(ouvertes,o=>valeurOpp(o)*stageP(o.stage)/100))}</b><small>Par probabilité</small></div>
     <div class="card kpi ok"><span>Gagnées</span><b>${list.filter(o=>o.stage==='Gagnée').length}</b><small>${money(sum(list.filter(o=>o.stage==='Gagnée'),valeurOpp))}</small></div>
     <div class="card kpi warn"><span>Perdues</span><b>${list.filter(o=>o.stage==='Perdue').length}</b><small>${money(sum(list.filter(o=>o.stage==='Perdue'),valeurOpp))}</small></div>
   </div>
   <div class="filters">
     <select class="control" onchange="_oF={...(window._oF||{}),com:this.value};RENDER.opportunites()"><option value="">Tous commerciaux</option>${db.users.map(u=>`<option value="${u.id}"${f.com==u.id?' selected':''}>${esc(u.nom)}</option>`).join('')}</select>
     <select class="control" onchange="_oF={...(window._oF||{}),dept:this.value};RENDER.opportunites()">${opts(uniq(db.orgs.map(o=>o.dept)),'Tous départements',f.dept)}</select>
   </div>
   <div class="notice" style="margin-bottom:14px">Déplacez une carte pour faire évoluer l’étape. Chaque passage est horodaté, ce qui alimente les statistiques mensuelles de démonstrations.</div>
   <div class="kanban">${OPP_STAGES.map(st=>{
      const l=list.filter(o=>o.stage===st.k);
      return `<div class="col" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropOpp(event,'${st.k}')">
        <h3>${esc(st.k)}<span class="tag">${l.length}</span></h3>
        <p class="col-sub">${esc(st.d)} · ${st.p}%</p>
        ${l.map(o=>{const qs=db.quotes.filter(q=>q.oppId===o.id);
          return `<div class="kan-card" draggable="true" ondragstart="_dragOpp=${o.id}" onclick="openOppModal(${o.orgId},${o.id})">
            <b>${esc(orgNom(o.orgId))}</b><span class="subtle">${esc(o.libelle)}</span>
            <div class="kan-amount">${money(valeurOpp(o))}${qs.length?' · '+qs.length+' devis':' · estimation strate'}</div>
            <div class="meta">${badge(userNom(o.respId),'purple')}${o.dateCloture?badge(frShort(o.dateCloture),isLate(o.dateCloture)&&!['Gagnée','Perdue'].includes(o.stage)?'red':''):''}</div>
          </div>`}).join('')||'<div class="empty" style="padding:18px">Aucune</div>'}
      </div>`}).join('')}</div>`;
};
let _dragOpp=null;
function dropOpp(e,stage){
  e.preventDefault();
  if(!can('opportunites','modifier')){_dragOpp=null;return refuse()}document.querySelectorAll('.col').forEach(c=>c.classList.remove('over'));
  if(!_dragOpp)return;
  const db=getDB(),o=db.opps.find(x=>x.id===_dragOpp);
  if(o&&o.stage!==stage){
    if(stage==='Gagnée'){
      const q=db.quotes.filter(x=>x.oppId===o.id).sort((a,b)=>b.ht-a.ht)[0];
      if(!q){toast('Créez et signez un devis avant de passer l’opportunité en gagnée.','err');_dragOpp=null;return}
      if(!canS('signerDevis')){_dragOpp=null;return refuse('Votre rôle ne permet pas de signer un devis.')}
      q.statut='Signé';q.dateSignature=todayISO();setOppStage(o,'Gagnée');syncFromQuote(q);log('Signature','Devis',q.numero);
      toast('Opportunité gagnée — contrat généré.');
    }else if(stage==='Perdue'&&!o.motifPerte){
      setOppStage(o,stage);commit();_dragOpp=null;RENDER.opportunites();
      openModal('Opportunité perdue — '+orgNom(o.orgId),'Le motif alimente l’analyse des pertes du tableau de bord.',
        `<div class="field"><label class="req">Motif</label><select id="mpMotif">${opts(MOTIFS_PERTE)}</select></div>
         <div class="field" style="margin-top:12px"><label>Précision</label><input id="mpNote" placeholder="Concurrent retenu, écart de prix, calendrier…"></div>`,
        `<button class="btn" onclick="closeModal()">Plus tard</button><button class="btn primary" onclick="saveMotif(${o.id})">Enregistrer</button>`);
      return;
    }else{setOppStage(o,stage);toast(orgNom(o.orgId)+' → '+stage)}
    commit();
  }
  _dragOpp=null;RENDER.opportunites();
}
function saveMotif(oid){
  const o=getDB().opps.find(x=>x.id===oid);
  o.motifPerte=val('mpMotif');o.notePerte=val('mpNote');
  log('Modification','Opportunité perdue',orgNom(o.orgId),o.motifPerte);
  commit();closeModal();toast('Motif enregistré.');rerender();
}
function openOppModal(orgId,oid){
  const db=getDB(),o=oid?db.opps.find(x=>x.id===oid):null;
  openModal(oid?'Modifier l’opportunité':'Nouvelle opportunité',orgId?orgNom(orgId):'',
  `${!orgId?`<div class="field"><label class="req">Organisme</label><select id="opOrg">${db.orgs.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join('')}</select></div>`:''}
   <div class="grid" style="margin-top:12px">
     <div class="field"><label class="req">Libellé</label><input id="opLib" value="${esc(o?o.libelle:'Projet '+(orgId?orgNom(orgId).replace(/^(Commune de |Commune d’|Ville de |CC )/,''):''))}"></div>
     <div class="field"><label>Étape</label><select id="opStage">${opts(OPP_STAGES.map(s=>s.k),undefined,o?o.stage:'Qualification')}</select></div>
     <div class="field"><label>Responsable</label><select id="opResp">${db.users.map(u=>`<option value="${u.id}"${(o?o.respId:2)==u.id?' selected':''}>${esc(u.nom)}</option>`).join('')}</select></div>
     <div class="field"><label>Clôture prévue</label><input id="opClose" type="date" value="${o?o.dateCloture:shift(45)}"></div>
     <div class="field"><label>Origine</label><select id="opSrc">${opts(['Prospection sortante','Campagne','Demande entrante','Recommandation','Marché public','Salon / événement'],undefined,o?o.source:'Prospection sortante')}</select></div>
     <div class="field"><label>Motif de perte</label><select id="opMotif">${opts(MOTIFS_PERTE,'—',o?o.motifPerte:'')}</select>
       <div class="hint">Renseigné à la perte de l’affaire, il alimente l’analyse des motifs du tableau de bord.</div></div>
   </div>
   ${o&&o.historique&&o.historique.length?`<div class="section-title">Parcours</div>
     <div class="timeline">${o.historique.map(h=>`<div class="tl-item done"><div class="tl-head"><b>${esc(h.stage)}</b></div><div class="tl-date">${frDate(h.date)}</div></div>`).join('')}</div>`:''}`,
  `${oid?`<button class="btn danger" onclick="deleteOpp(${oid})">Supprimer</button><button class="btn" onclick="closeModal();openQuoteModal(null,${o.orgId},${oid})">+ Devis</button>`:''}
   <button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveOpp(${orgId||'null'},${oid||'null'})">Enregistrer</button>`);
}
function saveOpp(orgId,oid){
  if(!guard('opportunites',oid?'modifier':'creer'))return;
  const db=getDB(),target=orgId||Number(val('opOrg'));
  const data={orgId:target,libelle:val('opLib')||'Opportunité',respId:Number(val('opResp')),
    dateCloture:val('opClose'),source:val('opSrc'),motifPerte:val('opMotif')};
  if(oid){const o=db.opps.find(x=>x.id===oid);Object.assign(o,data);setOppStage(o,val('opStage'))}
  else{const o={id:nextId('opp'),...data,stage:val('opStage'),createdAt:todayISO(),historique:[{stage:val('opStage'),date:todayISO()}]};db.opps.push(o)}
  const o=org(target);if(o&&['Non contacté','À contacter'].includes(o.statutCommercial))o.statutCommercial='En cours de prospection';
  commit();closeModal();toast('Opportunité enregistrée.');rerender();if(DRAWER)refreshDrawer('commercial');
}
function deleteOpp(oid){
  if(!guardS('supprimerDefinitif'))return;
  const db=getDB();
  if(db.quotes.some(q=>q.oppId===oid)){toast('Impossible : des devis y sont rattachés.','err');return}
  db.opps=db.opps.filter(o=>o.id!==oid);commit();closeModal();toast('Opportunité supprimée.');rerender();
}

/* ===================== Devis ===================== */
RENDER.devis=function(){
  const db=getDB();
  const f=window._qF||{statut:'',resp:''};
  const list=scopeQuotes(db.quotes).filter(q=>{const o=org(q.orgId);return o&&complet(o)&&(!f.statut||q.statut===f.statut)&&(!f.resp||q.respId==f.resp)}).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('page-devis').innerHTML=
  pageHead('Devis','Configurés sur la grille tarifaire officielle : abonnement mensuel par formule et par strate, options, frais de mise en place et remises.',
   `${can('devis','creer')?'<button class="btn primary" onclick="openQuoteModal()">+ Nouveau devis</button>':''}`)
  +`<div class="cards">${QUOTE_STATUS.map(s=>{const l=list.filter(q=>q.statut===s);
      return `<div class="card kpi ${s==='Signé'?'ok':(s==='À valider'?'warn':'')}"><span>${esc(s)}</span><b>${l.length}</b><small>${l.length?money(sum(l,q=>q.ht))+' HT':'—'}</small></div>`}).join('')}</div>
   <div class="filters">
     <select class="control" onchange="_qF={...(window._qF||{}),statut:this.value};RENDER.devis()">${opts(QUOTE_STATUS,'Tous statuts',f.statut)}</select>
     <select class="control" onchange="_qF={...(window._qF||{}),resp:this.value};RENDER.devis()"><option value="">Tous responsables</option>${db.users.map(u=>`<option value="${u.id}"${f.resp==u.id?' selected':''}>${esc(u.nom)}</option>`).join('')}</select>
   </div>
   <div class="panel"><div class="table-wrap"><table class="table"><thead><tr>
     <th>N°</th><th>Organisme</th><th>Formule</th><th>Statut</th><th class="num">Abonnement/mois</th><th class="num">Frais</th><th class="num">Total 1re année HT</th><th class="num">TTC</th><th>Remise</th><th>Responsable</th><th>Date</th><th>Validité</th><th></th>
   </tr></thead><tbody>
   ${list.length?list.map(q=>{const exp=q.statut!=='Signé'&&isLate(q.validite);
     return `<tr class="clickable" onclick="openQuoteModal(${q.id})">
      <td><b>${esc(q.numero)}</b><span class="subtle">${esc(q.type)}</span></td>
      <td><span class="row-title">${esc(orgNom(q.orgId))}</span><span class="subtle">${esc((org(q.orgId)||{}).ville||'')}</span></td>
      <td>${badge(q.config.formule)}</td><td>${badge(q.statut)}</td>
      <td class="num">${money2(q.mrrNet)}</td><td class="num">${money(q.one)}</td>
      <td class="num"><b>${money(q.ht)}</b></td><td class="num">${money(q.ttc)}</td>
      <td>${q.remiseMax>0?badge('-'+eur(q.remiseMax)+' %',q.remiseMax>getDB().settings.remiseMax?'red':''):'—'}</td>
      <td>${esc(userNom(q.respId))}</td><td>${frDate(q.date)}</td>
      <td>${exp?badge('Expiré','red'):frDate(q.validite)}</td>
      <td onclick="event.stopPropagation()"><button class="btn small" onclick="genDevisDocx(${q.id})">Devis</button>
        ${q.statut==='À valider'&&canS('validerDevis')?`<button class="btn small primary" onclick="validerDevis(${q.id})">Valider</button>`:''}</td></tr>`}).join('')
    :emptyRow(13,'Aucun devis','Créez un devis depuis une fiche organisme ou une opportunité.')}
   </tbody></table></div></div>`;
};

/* ---------- Configurateur de devis ---------- */
let QC=null,QCTX=null;
function openQuoteModal(qid,orgId,oppId){
  if(!can('devis',qid?'voir':'creer'))return refuse();
  const db=getDB(),q=qid?db.quotes.find(x=>x.id===qid):null;
  const oid=q?q.orgId:orgId;
  if(!oid){
    openModal('Nouveau devis','Choisissez l’organisme : la strate et les tarifs en découlent.',
      `<div class="field"><label class="req">Organisme</label><select id="qPick">${db.orgs.slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(x=>`<option value="${x.id}">${esc(x.nom)} — ${esc(strate(x.population))}</option>`).join('')}</select></div>`,
      `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="openQuoteModal(null,Number(val('qPick')))">Continuer</button>`);
    return;
  }
  const o=org(oid);
  QC=q?JSON.parse(JSON.stringify(q.config)):defaultConfig(o.population,o.formuleCible);
  QCTX={qid:qid||null,orgId:oid,oppId:q?q.oppId:(oppId||null),
    respId:q?q.respId:(o.commercialId||2),statut:q?q.statut:'Brouillon',type:q?q.type:'Devis initial',
    date:q?q.date:todayISO(),validite:q?q.validite:shift(db.settings.validiteDevis),
    dateDemarrage:q?q.dateDemarrage:shift(30),numero:q?q.numero:null};
  const oppList=db.opps.filter(x=>x.orgId==oid);
  openModal((q?'Devis '+q.numero:'Nouveau devis'),o.nom+' — '+strate(o.population)+' ('+fmt(o.population)+' hab.)',
  `<div class="grid">
     <div class="field"><label>Opportunité rattachée</label><select id="qOpp"><option value="">— aucune —</option>${oppList.map(x=>`<option value="${x.id}"${QCTX.oppId==x.id?' selected':''}>${esc(x.libelle)} (${esc(x.stage)})</option>`).join('')}</select></div>
     <div class="field"><label>Type</label><select id="qType">${opts(['Devis initial','Devis additionnel','Devis de renouvellement'],undefined,QCTX.type)}</select></div>
     <div class="field"><label>Statut</label><select id="qStatut">${QUOTE_STATUS.map(x=>`<option${x===QCTX.statut?' selected':''}${x==='Signé'&&!canS('signerDevis')?' disabled':''}${x==='À valider'&&!canS('validerDevis')&&QCTX.statut!=='À valider'?' disabled':''}>${esc(x)}</option>`).join('')}</select>
       <div class="hint">« Envoyé » place l’opportunité en « Devis envoyé ». « Signé » génère le contrat.</div></div>
     <div class="field"><label>Responsable</label><select id="qResp" onchange="refreshQuote()">${db.users.map(u=>`<option value="${u.id}"${QCTX.respId==u.id?' selected':''}>${esc(u.nom)}</option>`).join('')}</select></div>
     <div class="field"><label>Date d’émission</label><input id="qDate" type="date" value="${QCTX.date}" onchange="refreshQuote()"></div>
     <div class="field"><label>Valable jusqu’au</label><input id="qValid" type="date" value="${QCTX.validite}"></div>
     <div class="field"><label>Démarrage envisagé</label><input id="qDem" type="date" value="${QCTX.dateDemarrage}" onchange="refreshQuote()"></div>
     <div class="field"><label>N° de devis</label><input id="qNum" value="${esc(QCTX.numero||'attribué à l’enregistrement')}" disabled></div>
   </div>
   <div class="section-title">Offre et abonnement</div>
   <div class="grid four">
     <div class="field"><label>Formule</label><select id="cFormule" onchange="QC.formule=this.value;refreshQuote()">${opts(PRICING.formules,undefined,QC.formule)}</select></div>
     <div class="field"><label>Abonnement HT / mois</label><input id="cAboPu" disabled></div>
     <div class="field"><label>Remise sur l’abonnement (%)</label><input type="number" min="0" max="100" value="${QC.aboRemise}" oninput="QC.aboRemise=this.value;refreshQuote()"></div>
     <div class="field"><label>Facturation</label><select onchange="QC.facturation=this.value;refreshQuote()">${opts(['mensuelle','annuelle'],undefined,QC.facturation)}</select></div>
   </div>
   <div class="section-title">Options mensuelles — tarif selon la strate</div>
   <div id="cOptions"></div>
   <div class="section-title">Remise commerciale sur l’abonnement</div>
   <div class="grid four">
     <div class="field"><label>Type</label><select id="cMode" onchange="QC.remiseMode=this.value;refreshQuote()">
       <option value="aucune"${QC.remiseMode==='aucune'?' selected':''}>Aucune</option>
       <option value="pct"${QC.remiseMode==='pct'?' selected':''}>Pourcentage</option>
       <option value="mois"${QC.remiseMode==='mois'?' selected':''}>Mois offerts</option></select></div>
     <div class="field" id="wPct"><label>Remise (%)</label><input type="number" min="0" max="100" value="${QC.remisePct}" oninput="QC.remisePct=this.value;refreshQuote()"></div>
     <div class="field" id="wDur"><label>Durée de la remise (mois)</label><input type="number" min="1" value="${QC.remiseDuree}" oninput="QC.remiseDuree=this.value;refreshQuote()"></div>
     <div class="field" id="wMois"><label>Nombre de mois offerts</label><input type="number" min="1" value="${QC.remiseMois}" oninput="QC.remiseMois=this.value;refreshQuote()"></div>
   </div>
   <div class="section-title">Frais de mise en place</div>
   <div id="cSetup"></div>
   <div class="section-title">Matériel et prestations complémentaires</div>
   <div id="cExtras"></div>
   <div class="section-title">Engagement</div>
   <div class="grid four">
     <div class="field"><label>Durée d’engagement</label><select id="cEng" onchange="QC.engagementMois=Number(this.value);refreshQuote()">
       ${[12,24,36,0].map(m=>`<option value="${m}"${QC.engagementMois==m?' selected':''}>${m?m+' mois':'Sans engagement'}</option>`).join('')}
       <option value="-1"${![12,24,36,0].includes(QC.engagementMois)?' selected':''}>Saisie libre…</option></select></div>
     <div class="field" id="wEngLibre"><label>Engagement libre (mois)</label><input type="number" min="1" value="${QC.engagementMois>0?QC.engagementMois:48}" oninput="QC.engagementMois=Number(this.value);refreshQuote()"></div>
     <label class="check ${QC.resiliable?'on':''}"><input type="checkbox" ${QC.resiliable?'checked':''} onchange="QC.resiliable=this.checked;this.parentNode.classList.toggle('on',this.checked);refreshQuote()">Résiliable à chaque date anniversaire</label>
     <label class="check ${QC.clauseEssai?'on':''}"><input type="checkbox" ${QC.clauseEssai?'checked':''} onchange="QC.clauseEssai=this.checked;this.parentNode.classList.toggle('on',this.checked);refreshQuote()">Période d’essai de 4 semaines</label>
   </div>
   <div id="cTot"></div>`,
  `${qid?`<button class="btn danger" onclick="deleteQuote(${qid})">Supprimer</button>
     <button class="btn" onclick="genDevisDocx(${qid})">Devis Word</button>
     <button class="btn" onclick="genContratDocx(${qid})">Contrat + CGV</button>`:''}
   <button class="btn" onclick="closeModal()">Annuler</button>
   <button class="btn primary" onclick="saveQuote()">Enregistrer</button>`,true);
  refreshQuote();
}
function refreshQuote(){
  if(!QC||!QCTX)return;
  const o=org(QCTX.orgId),db=getDB(),si=strateIndex(o.population);
  QCTX.date=val('qDate')||QCTX.date;QCTX.dateDemarrage=val('qDem')||QCTX.dateDemarrage;QCTX.respId=Number(val('qResp'))||QCTX.respId;
  const c=computeQuote(QC,o.population,db.settings.tva,QCTX.dateDemarrage);
  document.getElementById('cAboPu').value=money2(c.aboPu);
  if(!QCTX.numero)document.getElementById('qNum').value=refDevis(QCTX.date,QCTX.respId,(db.numJour&&db.numJour[QCTX.date]||0)+1)+' (provisoire)';
  document.getElementById('wPct').style.display=QC.remiseMode==='pct'?'':'none';
  document.getElementById('wDur').style.display=QC.remiseMode==='pct'?'':'none';
  document.getElementById('wMois').style.display=QC.remiseMode==='mois'?'':'none';
  document.getElementById('wEngLibre').style.display=[12,24,36,0].includes(QC.engagementMois)?'none':'';

function setOpt(i,k,v){const l=QC.options.find(x=>x.i===i);if(l){l[k]=Number(v)||0;refreshQuote()}}

function saveQuote(){
  if(!guard('devis',QCTX.qid?'modifier':'creer'))return;
  const db=getDB(),o=org(QCTX.orgId);
  const c=computeQuote(QC,o.population,db.settings.tva,val('qDem'));
  let statut=val('qStatut');
  if(c.remiseMax>db.settings.remiseMax&&!canS('remiseHorsPlafond')&&['Envoyé','Relancé','Signé'].includes(statut)){
    statut='À valider';toast('Remise supérieure à '+db.settings.remiseMax+' % : le devis passe en attente de validation.','err');
  }
  if(statut==='Signé'&&!canS('signerDevis')){statut='En négociation';toast('Votre rôle ne permet pas de signer un devis.','err')}
  const data={orgId:QCTX.orgId,oppId:val('qOpp')?Number(val('qOpp')):null,type:val('qType'),statut,
    respId:Number(val('qResp')),date:val('qDate'),validite:val('qValid'),dateDemarrage:val('qDem'),config:JSON.parse(JSON.stringify(QC))};
  let q;
  if(QCTX.qid){q=db.quotes.find(x=>x.id===QCTX.qid);Object.assign(q,data)}
  else{const seq=nextSeqJour(data.date);
    q={id:nextId('quote'),numero:refDevis(data.date,data.respId,seq),dateSignature:null,valideParId:null,...data};
    db.quotes.push(q)}
  if(q.statut==='Signé'&&!q.dateSignature)q.dateSignature=todayISO();
  if(!q.oppId&&['Envoyé','Relancé','En négociation','Signé'].includes(q.statut)){
    const op={id:nextId('opp'),orgId:q.orgId,libelle:'Projet '+orgNom(q.orgId).replace(/^(Commune de |Commune d’|Ville de |CC )/,''),
      stage:QUOTE_TO_STAGE[q.statut]||'Qualification',respId:q.respId,dateCloture:q.validite,createdAt:todayISO(),
      source:'Prospection sortante',historique:[{stage:QUOTE_TO_STAGE[q.statut]||'Qualification',date:todayISO()}]};
    db.opps.push(op);q.oppId=op.id;
  }
  recalcQuote(q);syncFromQuote(q);log(QCTX.qid?'Modification':'Création','Devis',q.numero,q.statut+' · '+money(q.ht));commit();closeModal();
  toast(q.statut==='Signé'?'Devis signé — contrat créé.':'Devis '+q.numero+' enregistré.');
  rerender();if(DRAWER)refreshDrawer('commercial');
}
function deleteQuote(qid){
  if(!guardS('supprimerDefinitif'))return;
  const db=getDB();
  if(db.contracts.some(c=>c.quoteId===qid)){toast('Impossible : un contrat est rattaché à ce devis.','err');return}
  db.quotes=db.quotes.filter(q=>q.id!==qid);commit();closeModal();toast('Devis supprimé.');rerender();
}

function renderDocx(tplB64,data,filename,msg){
  if(!docReady()){toast('Générateur Word indisponible : connexion internet requise au premier chargement.','err');return}
  try{
    const doc=new window.docxtemplater(new window.PizZip(b64ToAB(tplB64)),{paragraphLoop:true,linebreaks:true});
    doc.render(data);
    window.saveAs(doc.getZip().generate({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),filename);
    toast(msg);
  }catch(e){console.error(e);toast('Erreur de génération : '+(e.message||e),'err')}
}
function genDevisDocx(qid){
  const q=getDB().quotes.find(x=>x.id===qid);if(!q)return;
  renderDocx(TPL_DEVIS,buildDocData(q),'OuiCRM_Devis_'+q.numero+'.docx','Devis Word généré.');

function genContratDocx(qid){
  const q=getDB().quotes.find(x=>x.id===qid);if(!q)return;
  const o=org(q.orgId),rep=contactsOf(o.id).find(x=>x.principal);
  const miss=[!o.siret&&'le SIRET',!o.adresse&&'l’adresse',!rep&&'le représentant légal (contact principal)'].filter(Boolean);

}

RENDER.deploiements=function(){
  const db=getDB();
  const rows=db.orgs.filter(o=>complet(o)&&o.statutClient==='Client en déploiement');

     <div class="card kpi accent"><span>Déploiements en cours</span><b>${rows.length}</b><small>${db.orgs.filter(o=>o.statutClient==='Client actif').length} déjà en production</small></div>

      const l=rows.filter(o=>(o.deployStage||DEPLOY_STAGES[0])===st);

          return `<div class="kan-card" draggable="true" ondragstart="_dragDep=${o.id}" onclick="openDrawer(${o.id},'client')">

  _dragDep=null;rerender();
}

       <td>${badge(lbl,cl)}</td><td>${c.tacite?'Résiliable (préavis '+(c.preavisMois||2)+' mois)':'Engagement ferme'}</td>
       <td onclick="event.stopPropagation()"><button class="btn small" onclick="openQuoteModal(null,${c.orgId})">Devis de renouvellement</button></td></tr>`}).join('')
    :emptyRow(10,'Aucun contrat à surveiller','Les échéances apparaissent dès qu’un contrat est actif.')}
   </tbody></table></div></div>`;
};

/* ===================== Paramètres ===================== */
/* ===================== Recherche globale ===================== */
function openGlobalSearch(){
  openModal('Recherche','Organismes, contacts, devis et contrats.',
  `<div class="field"><input id="gq" placeholder="Nom, ville, SIRET, numéro de devis…" oninput="globalSearch(this.value)" autofocus></div>
   <div id="gres" style="margin-top:14px"><p class="subtle">Saisissez au moins deux caractères.</p></div>`);
  setTimeout(()=>document.getElementById('gq').focus(),80);
}
function globalSearch(q){
  const box=document.getElementById('gres');
  q=(q||'').trim().toLowerCase();
  if(q.length<2){box.innerHTML='<p class="subtle">Saisissez au moins deux caractères.</p>';return}
  const db=getDB();
  const orgs=db.orgs.filter(o=>visible(o)&&(o.nom+' '+o.ville+' '+o.cp+' '+(o.siret||'')).toLowerCase().includes(q)).slice(0,8);
  const cs=can('contacts','voir')?db.contacts.filter(c=>{const o=org(c.orgId);return o&&complet(o)&&(c.prenom+' '+c.nom+' '+(c.email||'')).toLowerCase().includes(q)}).slice(0,6):[];
  const qs=can('devis','voir')?scopeQuotes(db.quotes).filter(x=>x.numero.toLowerCase().includes(q)).slice(0,5):[];
  const ct=can('contrats','voir')?scopeContrats(db.contracts).filter(x=>x.numero.toLowerCase().includes(q)).slice(0,5):[];
  box.innerHTML=(orgs.length||cs.length||qs.length||ct.length)?`
    ${orgs.length?'<div class="section-title">Organismes</div>'+orgs.map(o=>`<div class="list-row"><div class="grow"><b>${esc(o.nom)}</b><span class="subtle">${esc(o.ville)} · ${esc(o.statutCommercial)}</span></div><button class="btn small" onclick="closeModal();openDrawer(${o.id})">Ouvrir</button></div>`).join(''):''}
    ${cs.length?'<div class="section-title">Contacts</div>'+cs.map(c=>`<div class="list-row"><div class="grow"><b>${esc(c.prenom+' '+c.nom)}</b><span class="subtle">${esc(c.fonction||'')} · ${esc(orgNom(c.orgId))}</span></div><button class="btn small" onclick="closeModal();openDrawer(${c.orgId},'contacts')">Ouvrir</button></div>`).join(''):''}
    ${qs.length?'<div class="section-title">Devis</div>'+qs.map(x=>`<div class="list-row"><div class="grow"><b>${esc(x.numero)}</b><span class="subtle">${esc(orgNom(x.orgId))} · ${money(x.ht)} HT</span></div><button class="btn small" onclick="closeModal();openQuoteModal(${x.id})">Ouvrir</button></div>`).join(''):''}
    ${ct.length?'<div class="section-title">Contrats</div>'+ct.map(x=>`<div class="list-row"><div class="grow"><b>${esc(x.numero)}</b><span class="subtle">${esc(orgNom(x.orgId))}</span></div><button class="btn small" onclick="closeModal();openDrawer(${x.orgId},'client')">Ouvrir</button></div>`).join(''):''}`
   :'<div class="empty"><b>Aucun résultat</b>Essayez un autre terme.</div>';
}

/* ===================== Démarrage ===================== */
</script>
<script>
/* =====================================================================
   Paramètres — organisation, sécurité et accès, règles métier, données
   ===================================================================== */
const SET_TABS=[
  ['Organisation',[['societe','Société'],['users','Utilisateurs']]],
  ['Sécurité et accès',[['roles','Rôles et droits'],['perimetres','Périmètres'],['journal','Journal d’activité']]],
  ['Règles métier',[['regles','Règles commerciales'],['tarifs','Grille tarifaire'],['documents','Documents et numérotation'],['referentiels','Référentiels']]],
  ['Données',[['donnees','Sauvegarde et conservation']]]];
let SETTAB='societe';

RENDER.settings=function(){
  if(!can('parametres','voir')){document.getElementById('page-settings').innerHTML=
    `<div class="panel"><div class="empty"><b>Accès non autorisé</b>Votre rôle ne donne pas accès aux paramètres.</div></div>`;return}
  document.getElementById('page-settings').innerHTML=
  pageHead('Paramètres','Organisation, sécurité et accès, règles métier et données.')
  +`<div class="settings-layout">
      <nav class="settings-nav">${SET_TABS.map(([sec,items])=>
        `<p class="group-title" style="color:var(--muted);margin:14px 0 6px 10px">${esc(sec)}</p>
         ${items.map(([k,l])=>`<button class="snav ${SETTAB===k?'active':''}" onclick="SETTAB='${k}';RENDER.settings()">${esc(l)}</button>`).join('')}`).join('')}
      </nav>
      <div class="settings-pane" id="setPane"></div>
    </div>`;
  document.getElementById('setPane').innerHTML=(SETPANE[SETTAB]||SETPANE.societe)();
};
const SETPANE={};

/* ---------- Société ---------- */
SETPANE.societe=function(){
  const s=getDB().settings.societe;
  return `<div class="panel panel-pad"><h3>Identité de l’entreprise</h3>
    <p class="subtle" style="margin:0 0 14px">Ces informations alimentent l’en-tête des devis et des contrats générés.</p>
    <div class="grid">
      <div class="field"><label>Raison sociale</label><input id="soNom" value="${esc(s.nom)}"></div>
      <div class="field"><label>SIREN</label><input id="soSiren" value="${esc(s.siren)}"></div>
      <div class="field"><label>Adresse du siège</label><input id="soAdr" value="${esc(s.adresse)}"></div>
      <div class="field"><label>Téléphone</label><input id="soTel" value="${esc(s.tel)}"></div>
      <div class="field"><label>Email de contact</label><input id="soMail" value="${esc(s.email)}"></div>
      <div class="field"><label>Signataire des contrats</label><input id="soSign" value="${esc(s.signataire||'')}"></div>
    </div>
    <div style="display:flex;justify-content:flex-end;padding-top:14px">
      <button class="btn primary" ${can('parametres','modifier')?'':'disabled'} onclick="saveSociete()">Enregistrer</button></div></div>`;
};
function saveSociete(){
  if(!guard('parametres','modifier'))return;
  const s=getDB().settings.societe;
  Object.assign(s,{nom:val('soNom'),siren:val('soSiren'),adresse:val('soAdr'),tel:val('soTel'),email:val('soMail'),signataire:val('soSign')});
  log('Modification','Paramètres','Société');commit();toast('Société enregistrée.');
};

/* ---------- Utilisateurs ---------- */
SETPANE.users=function(){
  const db=getDB();
  return `<div class="panel">
    <div class="panel-pad" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:0">
      <div><h3 style="margin-bottom:3px">Comptes utilisateurs</h3>
        <p class="subtle" style="margin:0">Chaque intervenant, salarié ou indépendant, dispose d’un compte nominatif.</p></div>
      <button class="btn primary" ${canS('gererUtilisateurs')?'':'disabled'} onclick="openUserModal()">+ Nouvel utilisateur</button></div>
    <div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr>
      <th>Utilisateur</th><th>Rôle</th><th>Périmètre</th><th>Écart au rôle</th><th>Type</th><th>Expiration</th><th>Portefeuille</th><th>État</th><th></th>
    </tr></thead><tbody>
    ${db.users.map(u=>{const r=db.roles.find(x=>x.id===u.roleId)||{},p=db.perimetres.find(x=>x.id===u.perimetreId)||{};
      const e=ecartsRole(u),exp=u.expiration&&isLate(u.expiration);
      return `<tr class="${u.actif?'':'sel'}">
        <td><span class="row-title">${esc(u.nom)}</span><span class="subtle">${esc(u.email||'')}</span></td>
        <td>${badge(r.nom||'—','purple')}</td>
        <td>${esc(p.nom||'—')}${p.portefeuilleSeul?'<span class="subtle">portefeuille personnel</span>':''}</td>
        <td>${e?badge(e,'amber'):'<span class="subtle" style="margin:0">conforme</span>'}</td>
        <td>${u.externe?badge('Externe','amber'):'Interne'}</td>
        <td>${u.expiration?(exp?badge(frDate(u.expiration),'red'):frDate(u.expiration)):'—'}</td>
        <td>${db.orgs.filter(o=>o.commercialId===u.id).length}</td>
        <td>${u.actif?badge('Actif','green'):badge('Désactivé','red')}</td>
        <td style="white-space:nowrap"><button class="btn small" ${canS('gererUtilisateurs')?'':'disabled'} onclick="openUserModal(${u.id})">Modifier</button>
          ${u.id===SESSION?'':`<button class="btn small" ${canS('gererUtilisateurs')?'':'disabled'} onclick="toggleUser(${u.id})">${u.actif?'Désactiver':'Réactiver'}</button>
          <button class="btn small danger" ${canS('gererUtilisateurs')?'':'disabled'} onclick="delUser(${u.id})">Supprimer</button>`}</td></tr>`}).join('')}
    </tbody></table></div>
    <div class="table-foot"><span>Un compte externe expire automatiquement à la date indiquée. La désactivation conserve l’historique et le portefeuille ; la suppression exige de réaffecter le portefeuille à un autre collaborateur.</span></div></div>`;
};
function openUserModal(uid){
  if(!guardS('gererUtilisateurs'))return;
  const db=getDB(),u=uid?db.users.find(x=>x.id===uid):{nom:'',email:'',roleId:3,perimetreId:2,externe:false,actif:true,expiration:'',surcharges:{ajouts:[],retraits:[]}};
  const r=db.roles.find(x=>x.id===u.roleId)||db.roles[0];
  openModal(uid?'Compte — '+u.nom:'Nouvel utilisateur',uid?'Rôle de référence : '+r.nom:'',
  `<div class="grid">
     <div class="field"><label class="req">Nom et prénom</label><input id="uNom" value="${esc(u.nom)}"></div>
     <div class="field"><label>Email professionnel</label><input id="uMail" type="email" value="${esc(u.email||'')}"></div>
     <div class="field"><label>Rôle</label><select id="uRole" onchange="userRoleHint()">${db.roles.map(x=>`<option value="${x.id}"${u.roleId===x.id?' selected':''}>${esc(x.nom)}</option>`).join('')}</select>
       <div class="hint" id="uRoleHint"></div></div>
     <div class="field"><label>Périmètre</label><select id="uPeri">${db.perimetres.map(x=>`<option value="${x.id}"${u.perimetreId===x.id?' selected':''}>${esc(x.nom)}</option>`).join('')}</select></div>
     <div class="field"><label>Expiration de l’accès</label><input id="uExp" type="date" value="${esc(u.expiration||'')}"><div class="hint">Obligatoire pour un intervenant externe.</div></div>
     <div class="field"><label>Initiales (numérotation des devis)</label><input id="uIni" value="${esc(u.initiales||'')}" maxlength="3" placeholder="Calculées si vide"></div>
   </div>
   <div class="grid" style="margin-top:12px">
     <label class="check ${u.externe?'on':''}"><input type="checkbox" id="uExt" ${u.externe?'checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">Intervenant externe</label>
     <label class="check ${u.actif?'on':''}"><input type="checkbox" id="uAct" ${u.actif?'checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">Compte actif</label>
   </div>
   <div class="section-title">Surcharges individuelles</div>
   <p class="subtle" style="margin:0 0 10px">Écarts assumés par rapport au rôle. Toute case cochée ici est un écart visible et tracé.</p>
   <div id="uSurcharges">${surchargesHTML(u)}</div>`,
  `${uid&&u.id!==1?`<button class="btn danger" onclick="toggleUser(${uid})">${u.actif?'Désactiver':'Réactiver'}</button>`:''}
   <button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveUser(${uid||'null'})">Enregistrer</button>`,true);
  userRoleHint();
}
function userRoleHint(){
  const r=getDB().roles.find(x=>x.id===Number(val('uRole')));
  const h=document.getElementById('uRoleHint');if(h&&r)h.textContent=r.desc;
  const s=document.getElementById('uSurcharges');
  if(s)s.innerHTML=surchargesHTML({roleId:Number(val('uRole')),surcharges:collectSurcharges()});
}
function surchargesHTML(u){
  const r=getDB().roles.find(x=>x.id===u.roleId)||getDB().roles[0];
  const a=(u.surcharges&&u.surcharges.ajouts)||[],rt=(u.surcharges&&u.surcharges.retraits)||[];
  const etat=(cle,base)=>rt.includes(cle)?'retire':(a.includes(cle)?'ajoute':(base?'herite-on':'herite-off'));
  const cell=(cle,base)=>{const e=etat(cle,base);
    return `<td class="num"><select class="control sur" data-cle="${cle}" data-base="${base?1:0}" style="height:28px;min-width:96px;font-size:11.5px" onchange="userRoleHint()">
      <option value="h"${e.startsWith('herite')?' selected':''}>${base?'Hérité ✓':'Hérité ✗'}</option>
      <option value="a"${e==='ajoute'?' selected':''}>Ajouté ✓</option>
      <option value="r"${e==='retire'?' selected':''}>Retiré ✗</option></select></td>`};
  return `<div class="table-wrap"><table class="table" style="min-width:640px"><thead><tr><th>Objet</th>
    ${VERBES.map(([,l])=>`<th class="num">${l}</th>`).join('')}</tr></thead><tbody>
    ${OBJETS.map(([k,l])=>`<tr><td>${esc(l)}</td>${VERBES.map(([v])=>cell(k+'.'+v,(r.droits[k]||{})[v])).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="section-title">Droits sensibles</div>
    <div class="table-wrap"><table class="table" style="min-width:520px"><tbody>
    ${SENSIBLES.map(([k,l])=>`<tr><td>${esc(l)}</td>${cell('s.'+k,(r.sensibles||{})[k])}</tr>`).join('')}
    </tbody></table></div>`;
}
function collectSurcharges(){
  const a=[],r=[];
  document.querySelectorAll('.sur').forEach(s=>{
    if(s.value==='a')a.push(s.dataset.cle);else if(s.value==='r')r.push(s.dataset.cle);
  });
  return {ajouts:a,retraits:r};
}
function saveUser(uid){
  if(!guardS('gererUtilisateurs'))return;
  const db=getDB(),nom=val('uNom');
  if(!nom){toast('Le nom est obligatoire.','err');return}
  const externe=document.getElementById('uExt').checked;
  if(externe&&!val('uExp')){toast('Un compte externe exige une date d’expiration.','err');return}
  const data={nom,email:val('uMail'),roleId:Number(val('uRole')),perimetreId:Number(val('uPeri')),
    externe,actif:document.getElementById('uAct').checked,expiration:val('uExp'),
    initiales:(val('uIni')||initiales(nom)).toUpperCase(),surcharges:collectSurcharges()};
  if(uid){Object.assign(db.users.find(u=>u.id===uid),data);log('Modification','Utilisateur',nom)}
  else{db.users.push({id:nextId('user')||db.users.length+1,...data});log('Création','Utilisateur',nom)}
  commit();closeModal();renderSessionPicker();applyMenuRights();toast('Compte enregistré.');RENDER.settings();
}
function delUser(uid){
  if(!guardS('gererUtilisateurs'))return;
  const db=getDB(),u=db.users.find(x=>x.id===uid);
  if(uid===SESSION){toast('Vous ne pouvez pas supprimer votre propre compte.','err');return}
  const admins=db.users.filter(x=>x.roleId===1&&x.actif);
  if(u.roleId===1&&admins.length<=1){toast('Impossible : c’est le dernier compte administrateur.','err');return}
  const fiches=db.orgs.filter(o=>o.commercialId===uid).length;
  const suivi=db.orgs.filter(o=>o.csId===uid||o.formateurId===uid).length;
  const act=db.actions.filter(a=>a.userId===uid).length;
  const dev=db.quotes.filter(q=>q.respId===uid).length;
  const opp=db.opps.filter(o=>o.respId===uid).length;
  const form=db.formations.filter(f=>f.formateurId===uid).length;
  openModal('Supprimer le compte de '+u.nom,'L’historique est conservé, mais il faut désigner un repreneur.',
  `<div class="notice warn">Le compte disparaît définitivement. Les actions, devis et opportunités déjà enregistrés restent dans la base et seront réattribués au repreneur désigné.</div>
   <div class="info-grid" style="margin-top:14px">
     <div class="info-box"><span>Organismes en portefeuille</span><b>${fiches}</b></div>
     <div class="info-box"><span>Suivi client (consultant, formateur)</span><b>${suivi}</b></div>
     <div class="info-box"><span>Actions</span><b>${act}</b></div>
     <div class="info-box"><span>Opportunités</span><b>${opp}</b></div>
     <div class="info-box"><span>Devis</span><b>${dev}</b></div>
     <div class="info-box"><span>Formations</span><b>${form}</b></div>
   </div>
   <div class="field" style="margin-top:16px"><label class="req">Reprendre le portefeuille et l’historique par</label>
     <select id="duRepreneur">${db.users.filter(x=>x.id!==uid&&x.actif).map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join('')}</select></div>
   <label class="check" style="margin-top:12px"><input type="checkbox" id="duSansRepr">
     <span>Ne rien réattribuer<span class="subtle">Les fiches et enregistrements concernés se retrouveront sans responsable.</span></span></label>
   <div class="notice" style="margin-top:14px">Si vous souhaitez seulement retirer l’accès en conservant l’attribution, préférez la désactivation du compte.</div>`,
  `<button class="btn" onclick="closeModal()">Annuler</button>
   <button class="btn" onclick="closeModal();toggleUser(${uid})">Désactiver plutôt</button>
   <button class="btn danger" onclick="doDelUser(${uid})">Supprimer définitivement</button>`,true);
}
function doDelUser(uid){
  const db=getDB(),u=db.users.find(x=>x.id===uid);
  const sans=document.getElementById('duSansRepr').checked;
  const rep=sans?null:Number(val('duRepreneur'))||null;
  db.orgs.forEach(o=>{if(o.commercialId===uid)o.commercialId=rep;if(o.csId===uid)o.csId=rep;if(o.formateurId===uid)o.formateurId=rep});
  db.actions.forEach(a=>{if(a.userId===uid)a.userId=rep});
  db.quotes.forEach(q=>{if(q.respId===uid)q.respId=rep;if(q.valideParId===uid)q.valideParId=rep});
  db.opps.forEach(o=>{if(o.respId===uid)o.respId=rep});
  db.formations.forEach(f=>{if(f.formateurId===uid)f.formateurId=rep});
  db.tickets.forEach(t=>{if(t.assigneId===uid)t.assigneId=rep});
  db.campaigns.forEach(c=>{if(c.ownerId===uid)c.ownerId=rep});
  db.users=db.users.filter(x=>x.id!==uid);
  log('Suppression','Utilisateur',u.nom,rep?'repris par '+userNom(rep):'sans repreneur');
  commit();closeModal();renderSessionPicker();applyMenuRights();
  toast('Compte supprimé'+(rep?' — portefeuille repris par '+userNom(rep):'.'));RENDER.settings();
}
function toggleUser(uid){
  if(!guardS('gererUtilisateurs'))return;
  const u=getDB().users.find(x=>x.id===uid);
  if(uid===SESSION){toast('Vous ne pouvez pas désactiver votre propre compte.','err');return}
  u.actif=!u.actif;
  log(u.actif?'Réactivation':'Désactivation','Utilisateur',u.nom);
  commit();closeModal();renderSessionPicker();toast(u.actif?'Compte réactivé.':'Compte désactivé.');RENDER.settings();
}

/* ---------- Rôles et droits ---------- */
SETPANE.roles=function(){
  const db=getDB();
  return `<div class="panel panel-pad" style="margin-bottom:14px">
      <h3>Rôles</h3>
      <p class="subtle" style="margin:0 0 4px">Le rôle décrit ce qu’un utilisateur a le droit de faire. Le périmètre décrit sur quelles données. Les deux se combinent.</p>
    </div>
    ${db.roles.map(r=>`<div class="panel panel-pad" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
        <div><h3 style="margin-bottom:3px">${esc(r.nom)} ${r.systeme?badge('Standard'):badge('Personnalisé','purple')}</h3>
          <p class="subtle" style="margin:0;max-width:70ch">${esc(r.desc||'')}</p></div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <span class="tag">${db.users.filter(u=>u.roleId===r.id).length} utilisateur(s)</span>
          <button class="btn small" onclick="openRoleModal(${r.id})">${canS('gererUtilisateurs')?'Modifier':'Consulter'}</button>
          <button class="btn small" ${canS('gererUtilisateurs')?'':'disabled'} onclick="dupRole(${r.id})">Dupliquer</button></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:11px">
        ${OBJETS.filter(([k])=>(r.droits[k]||{}).voir).map(([k,l])=>{
          const d=r.droits[k],w=d.supprimer?'red':(d.modifier||d.creer?'blue':'');
          return badge(l+(d.supprimer?' · tout':(d.modifier?' · écriture':' · lecture')),w)}).join('')||'<span class="subtle">Aucun accès</span>'}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        ${SENSIBLES.filter(([k])=>(r.sensibles||{})[k]).map(([k,l])=>badge(l,'amber')).join('')}
      </div>
      <p class="subtle" style="margin-top:9px">Hors périmètre : <b>${esc((HORS_PERIMETRE.find(h=>h[0]===r.horsPerimetre)||[])[1]||'—')}</b></p>
    </div>`).join('')}`;
};
function openRoleModal(rid){
  const db=getDB(),r=db.roles.find(x=>x.id===rid),ro=!canS('gererUtilisateurs');
  openModal('Rôle — '+r.nom,r.systeme?'Rôle standard : la structure est verrouillée, les droits restent ajustables.':'Rôle personnalisé',
  `<div class="grid">
     <div class="field"><label>Nom</label><input id="rNom" value="${esc(r.nom)}" ${r.systeme||ro?'disabled':''}></div>
     <div class="field"><label>Visibilité hors périmètre</label><select id="rHors" ${ro?'disabled':''}>${HORS_PERIMETRE.map(([k,l])=>`<option value="${k}"${r.horsPerimetre===k?' selected':''}>${l}</option>`).join('')}</select>
       <div class="hint">La lecture restreinte affiche le nom, la ville, le statut et le commercial en charge — sans contacts, montants ni comptes rendus.</div></div>
   </div>
   <div class="field" style="margin-top:12px"><label>Description</label><textarea id="rDesc" ${ro?'disabled':''}>${esc(r.desc||'')}</textarea></div>
   <div class="section-title">Matrice des droits</div>
   <div class="table-wrap"><table class="table" style="min-width:620px"><thead><tr><th>Objet</th>
     ${VERBES.map(([,l])=>`<th class="num">${l}</th>`).join('')}</tr></thead><tbody>
     ${OBJETS.map(([k,l])=>`<tr><td>${esc(l)}</td>${VERBES.map(([v])=>

function openPerimetreModal(pid){

       <option value="clients"${p.nature==='clients'?' selected':''}>Clients uniquement</option></select></div>

   <div id="pRegions">${regionsHTML(p)}</div>
   <div class="notice" id="pCount" style="margin-top:12px"></div>`,
  `${pid&&pid>1?`<button class="btn danger" onclick="delPerimetre(${pid})">Supprimer</button>`:''}
   <button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="savePerimetre(${pid||'null'})">Enregistrer</button>`,true);
  countPerimetre();
}
function regionsHTML(p){
  const dep=new Set(p.departements||[]),reg=new Set(p.regions||[]);
  return REGIONS.map(([nom,ds])=>{
    const tous=reg.has(nom);
    return `<div class="panel" style="margin-bottom:8px;box-shadow:none">
      <label class="check ${tous?'on':''}" style="border:0;border-bottom:1px solid var(--border);border-radius:0">
        <input type="checkbox" class="preg" data-r="${esc(nom)}" ${tous?'checked':''} onchange="toggleRegion(this)"><b>${esc(nom)}</b>
        <span class="subtle" style="margin-left:auto">${ds.length} dépt.</span></label>
      <div style="display:flex;flex-wrap:wrap;gap:5px;padding:9px 11px">
        ${ds.map(d=>`<label class="tag" style="cursor:pointer;${(tous||dep.has(d))?'background:var(--brand-soft);color:var(--brand);border-color:#ddd6ff':''}">
          <input type="checkbox" class="pdep" data-d="${d}" data-r="${esc(nom)}" ${(tous||dep.has(d))?'checked':''} onchange="countPerimetre()" style="margin-right:4px">${d}</label>`).join('')}
      </div></div>`}).join('');
}
function toggleRegion(el){
  document.querySelectorAll('.pdep[data-r="'+el.dataset.r+'"]').forEach(c=>{c.checked=el.checked;
    c.parentNode.style.cssText='cursor:pointer;'+(el.checked?'background:var(--brand-soft);color:var(--brand);border-color:#ddd6ff':'')});
  el.parentNode.classList.toggle('on',el.checked);countPerimetre();
}
function collectPerimetre(){
  const deps=[...document.querySelectorAll('.pdep:checked')].map(c=>c.dataset.d);
  const regions=[];
  REGIONS.forEach(([nom,ds])=>{if(ds.every(d=>deps.includes(d)))regions.push(nom)});
  const dansRegion=new Set(regions.flatMap(r=>(REGIONS.find(x=>x[0]===r)||[])[1]||[]));
  return {regions,departements:deps.filter(d=>!dansRegion.has(d))};
}
function countPerimetre(){
  const c=collectPerimetre(),nature=val('pNature');
  const d=new Set(c.regions.flatMap(r=>(REGIONS.find(x=>x[0]===r)||[])[1]||[]).concat(c.departements));
  const n=getDB().orgs.filter(o=>{
    let ok=!d.size||d.has(String(o.dept));
    if(ok&&nature==='prospects')ok=o.statutClient==='Non client';
    if(ok&&nature==='clients')ok=o.statutClient!=='Non client';
    return ok}).length;
  const el=document.getElementById('pCount');
  if(el)el.innerHTML=`<b>${d.size?d.size+' département(s) sélectionné(s)':'France entière'}</b> — ${n} fiche(s) de la base actuelle entrent dans ce périmètre${document.getElementById('pPorte').checked?', avant application du filtre portefeuille personnel':''}.`;
}
function savePerimetre(pid){
  if(!guardS('gererUtilisateurs'))return;
  if(!val('pNom')){toast('Le nom est obligatoire.','err');return}
  const db=getDB(),c=collectPerimetre();
  const data={nom:val('pNom'),desc:val('pDesc'),regions:c.regions,departements:c.departements,
    portefeuilleSeul:document.getElementById('pPorte').checked,nature:val('pNature')};
  if(pid){Object.assign(db.perimetres.find(x=>x.id===pid),data);log('Modification','Périmètre',data.nom)}
  else{db.perimetres.push({id:Math.max(0,...db.perimetres.map(x=>x.id))+1,...data});log('Création','Périmètre',data.nom)}
  commit();closeModal();toast('Périmètre enregistré.');RENDER.settings();
}
function delPerimetre(pid){
  const db=getDB();
  if(db.users.some(u=>u.perimetreId===pid)){toast('Impossible : des utilisateurs y sont rattachés.','err');return}
  db.perimetres=db.perimetres.filter(p=>p.id!==pid);log('Suppression','Périmètre','#'+pid);
  commit();closeModal();toast('Périmètre supprimé.');RENDER.settings();
}

function persistGrille(quoi,detail){
  syncGrille();
  getDB().settings.pricing={strates:PRICING.strates.map(s=>({label:s.label,min:s.min,max:s.max===Infinity?null:s.max})),
    formules:PRICING.formules,abonnement:PRICING.abonnement,options:PRICING.options,oneShot:PRICING.oneShot,extras:PRICING.extras};
  log('Modification','Grille tarifaire',quoi,detail||'');
  commit();RENDER.settings();
}
function setPrice(kind,a,i,v){
  if(!guardS('modifierTarifs'))return;
  const x=Number(v)||0;
  if(kind==='abonnement')PRICING.abonnement[a][i]=x;
  else if(kind==='option'){const o=PRICING.options.find(z=>z.id===a);if(o)o.pu[i]=x}
  else if(kind==='setup'){const [k,f]=String(a).split('|');PRICING.oneShot[k][f][i]=x}
  else if(kind==='extra'){const e=PRICING.extras.find(z=>z.id===a);if(e)e.pu=x}
  getDB().settings.pricing={strates:PRICING.strates.map(s=>({label:s.label,min:s.min,max:s.max===Infinity?null:s.max})),
    formules:PRICING.formules,abonnement:PRICING.abonnement,options:PRICING.options,oneShot:PRICING.oneShot,extras:PRICING.extras};
  log('Modification','Grille tarifaire',kind+' '+a);commit();toast('Tarif mis à jour.');
}

function openStrateModal(i){
  if(!guardS('modifierTarifs'))return;
  const st=i===undefined?null:PRICING.strates[i];
  const dernier=PRICING.strates[PRICING.strates.length-1];
  openModal(st?'Tranche — '+st.label:'Nouvelle tranche de population',
    'Les tarifs de la nouvelle tranche sont initialisés sur la tranche la plus proche, puis modifiables.',
  `<div class="grid three">
     <div class="field"><label class="req">Libellé</label><input id="stLabel" value="${esc(st?st.label:'')}" placeholder="10 001 – 20 000 hab."></div>
     <div class="field"><label class="req">Population minimale</label><input id="stMin" type="number" value="${st?st.min:(dernier?dernier.min+1:0)}"></div>
     <div class="field"><label>Population maximale</label><input id="stMax" type="number" value="${st&&st.max!==Infinity?st.max:''}" placeholder="vide = sans limite"></div>
   </div>
   <div class="notice" style="margin-top:12px">Les tranches sont triées automatiquement par population croissante. Un organisme dont la population ne tombe dans aucune tranche est rattaché à la première.</div>`,
  `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveStrate(${i===undefined?'null':i})">Enregistrer</button>`);
}
/* Les tranches ne doivent ni se recouvrir ni laisser de trou : on aligne les bornes. */
function normaliserStrates(){
  const ordre=PRICING.strates.map((s,k)=>k).sort((a,b)=>PRICING.strates[a].min-PRICING.strates[b].min);
  const perm=a=>ordre.map(k=>a[k]);
  PRICING.formules.forEach(f=>{PRICING.abonnement[f]=perm(PRICING.abonnement[f]);
    SETUP_KEYS.forEach(k=>{PRICING.oneShot[k][f]=perm(PRICING.oneShot[k][f])})});
  PRICING.options.forEach(o=>{o.pu=perm(o.pu)});
  PRICING.strates=perm(PRICING.strates);
  PRICING.strates.forEach((s,k)=>{
    const suiv=PRICING.strates[k+1];
    if(suiv)s.max=Math.min(s.max===Infinity?Infinity:s.max,suiv.min-1);
    else if(s.max!==Infinity&&s.max<s.min)s.max=Infinity;
  });
  PRICING.strates[PRICING.strates.length-1].max=Infinity;
  syncGrille();
}
function saveStrate(i){
  if(!guardS('modifierTarifs'))return;
  const label=val('stLabel'),min=Number(val('stMin'))||0;
  const max=val('stMax')===''?Infinity:Number(val('stMax'));
  if(!label){toast('Le libellé est obligatoire.','err');return}
  if(max<min){toast('Le maximum doit être supérieur au minimum.','err');return}
  if(i===null||i===undefined){
    const proche=strateIndex(min);
    PRICING.strates.push({label,min,max});
    const dup=a=>{a.push(a[proche]!==undefined?a[proche]:(a[a.length-1]||0));return a};
    PRICING.formules.forEach(f=>{dup(PRICING.abonnement[f]);SETUP_KEYS.forEach(k=>dup(PRICING.oneShot[k][f]))});
    PRICING.options.forEach(o=>dup(o.pu));
    normaliserStrates();
    persistGrille('Ajout de tranche',label);toast('Tranche ajoutée : tarifs recopiés depuis la tranche voisine, bornes ajustées.');
  }else{
    Object.assign(PRICING.strates[i],{label,min,max});
    normaliserStrates();
    persistGrille('Modification de tranche',label);toast('Tranche mise à jour.');
  }
  closeModal();
}
function delStrate(i){
  if(!guardS('modifierTarifs'))return;
  const st=PRICING.strates[i],n=getDB().orgs.filter(o=>strateIndex(o.population)===i).length;
  openModal('Retirer la tranche « '+st.label+' » ?',n?n+' organisme(s) y sont rattachés':'Aucun organisme rattaché',
   `<div class="notice warn">Les colonnes de tarif correspondantes seront supprimées dans l’abonnement, les options et les frais de mise en place.${n?' Les organismes concernés basculeront dans la tranche voisine.':''}</div>`,
   `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn danger" onclick="doDelStrate(${i})">Retirer la tranche</button>`);
}
function doDelStrate(i){
  const label=PRICING.strates[i].label;
  PRICING.strates.splice(i,1);
  PRICING.formules.forEach(f=>{PRICING.abonnement[f].splice(i,1);SETUP_KEYS.forEach(k=>PRICING.oneShot[k][f].splice(i,1))});
  PRICING.options.forEach(o=>o.pu.splice(i,1));
  normaliserStrates();
  persistGrille('Suppression de tranche',label);closeModal();toast('Tranche retirée.');
}

/* --- Formules --- */
function openFormuleModal(f){
  if(!guardS('modifierTarifs'))return;
  openModal(f?'Renommer la formule '+f:'Nouvelle formule d’abonnement',
    f?'':'Les tarifs sont initialisés sur la formule choisie comme modèle, puis modifiables ligne par ligne.',
  `<div class="field"><label class="req">Nom de la formule</label><input id="fmNom" value="${esc(f||'')}" placeholder="INTÉGRAL"></div>
   ${f?'':`<div class="field" style="margin-top:12px"><label>Recopier les tarifs de</label>
     <select id="fmBase">${opts(PRICING.formules,undefined,PRICING.formules[PRICING.formules.length-1])}</select></div>`}`,
  `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="saveFormule(${f?"'"+f+"'":'null'})">Enregistrer</button>`);
}
function saveFormule(f){
  if(!guardS('modifierTarifs'))return;
  const nom=val('fmNom').trim();
  if(!nom){toast('Le nom est obligatoire.','err');return}
  if(nom!==f&&PRICING.formules.includes(nom)){toast('Cette formule existe déjà.','err');return}
  if(f){
    const i=PRICING.formules.indexOf(f);PRICING.formules[i]=nom;
    PRICING.abonnement[nom]=PRICING.abonnement[f];delete PRICING.abonnement[f];
    SETUP_KEYS.forEach(k=>{PRICING.oneShot[k][nom]=PRICING.oneShot[k][f];delete PRICING.oneShot[k][f]});
    getDB().quotes.forEach(q=>{if(q.config.formule===f)q.config.formule=nom});
    getDB().contracts.forEach(c=>{if(c.formule===f)c.formule=nom});
    getDB().orgs.forEach(o=>{if(o.formuleCible===f)o.formuleCible=nom});
    persistGrille('Renommage de formule',f+' → '+nom);toast('Formule renommée.');
  }else{
    const base=val('fmBase');
    PRICING.formules.push(nom);
    PRICING.abonnement[nom]=[...(PRICING.abonnement[base]||[])];
    SETUP_KEYS.forEach(k=>{PRICING.oneShot[k][nom]=[...(PRICING.oneShot[k][base]||[])]});
    persistGrille('Ajout de formule',nom);toast('Formule créée : tarifs recopiés depuis '+base+'.');
  }
  closeModal();
}
function delFormule(f){
  if(!guardS('modifierTarifs'))return;
  const db=getDB();
  const n=db.quotes.filter(q=>q.config.formule===f).length+db.contracts.filter(c=>c.formule===f).length;
  if(n){toast('Impossible : '+n+' devis ou contrat(s) utilisent la formule '+f+'.','err');return}
  const i=PRICING.formules.indexOf(f);PRICING.formules.splice(i,1);
  delete PRICING.abonnement[f];SETUP_KEYS.forEach(k=>delete PRICING.oneShot[k][f]);
  db.orgs.forEach(o=>{if(o.formuleCible===f)o.formuleCible=PRICING.formules[0]});
  persistGrille('Suppression de formule',f);toast('Formule retirée.');
}

  `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="savePoste(${k?"'"+k+"'":'null'})">Enregistrer</button>`);
}
function savePoste(k){
  if(!guardS('modifierTarifs'))return;
  const lib=val('poNom').trim();
  if(!lib){toast('Le libellé est obligatoire.','err');return}
  if(k){PRICING.oneShot[k].lib=lib;persistGrille('Renommage de poste',lib);toast('Poste renommé.')}
  else{
    const cle='poste'+Date.now().toString(36);
    const pu=Number(val('poPu'))||0;
    PRICING.oneShot[cle]={lib};
    PRICING.formules.forEach(f=>{PRICING.oneShot[cle][f]=PRICING.strates.map(()=>pu)});
    getDB().quotes.forEach(q=>{if(q.config.setup&&!q.config.setup[cle])q.config.setup[cle]={inc:false,rem:0}});
    persistGrille('Ajout de poste',lib);toast('Poste créé. Il est décoché par défaut sur les devis existants.');
  }
  closeModal();
}
function delPoste(k){
  if(!guardS('modifierTarifs'))return;
  const lib=PRICING.oneShot[k].lib;
  const n=getDB().quotes.filter(q=>q.config.setup&&q.config.setup[k]&&q.config.setup[k].inc).length;
  if(n){toast('Impossible : '+n+' devis incluent « '+lib+' ».','err');return}
  delete PRICING.oneShot[k];
  persistGrille('Suppression de poste',lib);toast('Poste retiré.');
}
