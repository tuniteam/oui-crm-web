<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oui CRM — V8</title>
<style>
:root{
  --bg:#f4f5fa; --panel:#ffffff; --ink:#12141d; --ink2:#3d4356; --muted:#79809a; --border:#e3e6f0;
  --brand:#0369A1; --brand-dk:#075985; --brand-soft:#E0F2FE;
  --dark:#15161f; --dark2:#1e202c;
  --green:#0f7040; --green-bg:#e8f6ee; --green-bd:#c2e9d3;
  --blue:#0f6699; --blue-bg:#e8f4fc; --blue-bd:#c2e0f4;
  --red:#c0392f; --red-bg:#fdefee; --red-bd:#f7cfcb;
  --amber:#96590a; --amber-bg:#fdf4e5; --amber-bd:#f6dcac;
  --shadow-sm:0 1px 2px rgba(18,20,29,.06);
  --shadow:0 10px 28px rgba(18,20,29,.07);
  --radius:14px; --radius-sm:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3{letter-spacing:-.02em;margin:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
.sidebar{background:var(--dark);color:#c9cde0;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--brand),#54A0FF);display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;flex:none}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:#7f87a5;font-weight:700;letter-spacing:.14em;font-size:9.5px;text-transform:uppercase;margin-top:2px}
.group{padding:16px 10px 2px}
.group-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#6f7794;margin:0 0 7px 12px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#c1c6dc;font-weight:600;margin:2px 0;border:0;background:transparent;width:100%;text-align:left;font-size:13.5px}
.nav:hover{background:#242637;color:#fff}
.nav.active{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(3,105,161,.35)}
.ico{width:18px;text-align:center;font-size:14px;opacity:.9;flex:none}
.pill{margin-left:auto;background:rgba(255,255,255,.1);color:#dfe2ef;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;min-width:22px;text-align:center}
.nav.active .pill{background:rgba(255,255,255,.22);color:#fff}
.pill.alert{background:var(--red);color:#fff}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#6f7794}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20;gap:14px}
.crumb{font-weight:700;color:var(--ink2);font-size:14px}
.burger{display:none;border:1px solid var(--border);background:#fff;border-radius:9px;padding:6px 10px;font-size:16px}
.top-actions{display:flex;gap:9px;align-items:center}
.chip-user{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600;font-size:12.5px;background:#fff}
.avatar{width:26px;height:26px;border-radius:99px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:11px}
.content{padding:22px 22px 60px;flex:1}
.page{display:none} .page.active{display:block}

/* ---------- Type & heads ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-title h1{font-size:24px;margin-bottom:3px}
.page-title p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.section-title{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted);margin:22px 0 10px}
.section-title:first-child{margin-top:0}

/* ---------- Buttons ---------- */
.btn{border:1px solid var(--border);background:#fff;color:var(--ink2);border-radius:9px;padding:8px 13px;font-weight:650;font-size:13px;box-shadow:var(--shadow-sm);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c9cee0;background:#fbfbfe}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 5px 14px rgba(3,105,161,.25)}
.btn.primary:hover{background:var(--brand-dk);border-color:var(--brand-dk)}
.btn.danger{color:var(--red);border-color:var(--red-bd);background:var(--red-bg)}
.btn.small{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:#eceffa;border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 13px;font-weight:700;color:#5a6178;font-size:12.5px}
.seg button.active{background:#fff;color:var(--brand);box-shadow:var(--shadow-sm)}

/* ---------- Controls ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.control{height:38px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:0 11px;min-width:140px;font-size:13px;box-shadow:var(--shadow-sm)}
.control.search{min-width:230px;flex:1;max-width:340px}
.field{display:block;margin-bottom:2px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;background:#fff;font-size:13.5px}
.field textarea{min-height:82px;resize:vertical}
.field input[disabled]{background:#f5f6fa;color:var(--muted)}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px}
.req::after{content:' *';color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.grid.three{grid-template-columns:repeat(3,1fr)}
.grid.four{grid-template-columns:repeat(4,1fr)}
.check{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;background:#fff;cursor:pointer}
.check input{accent-color:var(--brand)}
.check.on{border-color:var(--brand);background:var(--brand-soft)}

/* ---------- Cards / KPI ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.kpi{padding:15px 16px;position:relative;overflow:hidden}
.kpi span{display:block;color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.1em;font-weight:800}
.kpi b{display:block;font-size:24px;color:var(--ink);margin-top:7px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:11.5px;display:block;margin-top:3px}
.kpi.accent{border-left:3px solid var(--brand)} .kpi.accent b{color:var(--brand)}
.kpi.warn{border-left:3px solid var(--red)} .kpi.warn b{color:var(--red)}
.kpi.ok{border-left:3px solid var(--green)} .kpi.ok b{color:var(--green)}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.panel-pad{padding:18px}
.panel h3{font-size:14px;margin-bottom:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ---------- Tables ---------- */
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:900px;background:#fff}
.table th{background:#fafbfe;color:#6b7290;text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;font-weight:800;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:2}
.table th.sortable{cursor:pointer;user-select:none}
.table th.sortable:hover{color:var(--brand)}
.table td{padding:11px 14px;border-bottom:1px solid #eef0f7;vertical-align:middle;font-size:13px}
.table tbody tr.clickable{cursor:pointer}
.table tbody tr.clickable:hover{background:#fafaff}
.table tbody tr.sel{background:var(--brand-soft)}
.row-title{font-weight:700;display:block}
.subtle{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.table-foot{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-top:1px solid var(--border);background:#fafbfe;font-size:12.5px;color:var(--muted);gap:10px;flex-wrap:wrap}
.bulkbar{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--brand-soft);border-bottom:1px solid #ddd6ff;font-size:13px;font-weight:600;flex-wrap:wrap}

/* ---------- Tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:3px 8px;font-weight:700;font-size:11.5px;border:1px solid var(--border);background:#f4f5f9;color:#5a6178;white-space:nowrap}
.tag.red{background:var(--red-bg);color:var(--red);border-color:var(--red-bd)}
.tag.green{background:var(--green-bg);color:var(--green);border-color:var(--green-bd)}
.tag.blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-bd)}
.tag.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bd)}
.tag.purple{background:var(--brand-soft);color:var(--brand);border-color:#ddd6ff}
.dotm{width:6px;height:6px;border-radius:99px;background:currentColor;display:inline-block}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(258px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px}
.col{background:#edeff7;border:1px solid #e0e4ef;border-radius:13px;min-height:420px;padding:12px}
.col.over{background:var(--brand-soft);border-color:#c9bcff}
.col h3{font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.col .col-sub{color:#7d849c;margin:0 0 10px;font-size:11px;line-height:1.35}
.kan-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px;margin:8px 0;box-shadow:var(--shadow-sm);cursor:grab}
.kan-card:active{cursor:grabbing}
.kan-card.drag{opacity:.4}
.kan-card b{display:block;margin-bottom:3px;font-size:13px}
.kan-card .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.kan-amount{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;margin-top:7px;color:var(--ink2)}

.sim-banner{background:#fffaf0;border-bottom:1px solid var(--amber-bd);color:var(--amber);padding:9px 22px;font-size:12px;line-height:1.45}
.sim-banner b{color:var(--amber)}
.settings-layout{display:grid;grid-template-columns:212px 1fr;gap:18px;align-items:start}
.settings-nav{position:sticky;top:74px}
.snav{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 11px;font-weight:650;color:var(--ink2);font-size:13px;margin-bottom:2px}
.snav:hover{background:#eceffa}
.snav.active{background:var(--brand);color:#fff}
.restricted{opacity:.62}
.restricted td{color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-grid.head{border-bottom:1px solid var(--border);background:#fafbfe}
.cal-h{padding:8px 6px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#6b7290;text-align:center}
.cal-c{min-height:104px;border-right:1px solid #eef0f7;border-bottom:1px solid #eef0f7;padding:5px 5px 7px;cursor:pointer;overflow:hidden}
.cal-c:hover{background:#fafaff}
.cal-c.vide{background:#fafbfe;cursor:default}
.cal-c.today{background:var(--brand-soft)}
.cal-c.semaine{min-height:220px;cursor:default}
.cal-n{font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:4px;text-align:right;padding-right:2px}
.cal-c.today .cal-n{color:var(--brand)}
.ag-ev{background:#fff;border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:5px;
  padding:3px 5px;margin-bottom:3px;font-size:10.5px;line-height:1.3;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:var(--shadow-sm)}
.ag-ev:hover{background:#fbfbfe;white-space:normal}
.ag-ev b{font-variant-numeric:tabular-nums}
/* ---------- Misc ---------- */
.progress{height:6px;background:#e7eaf3;border-radius:99px;overflow:hidden;margin:9px 0 4px}
.bar{height:100%;background:var(--brand);border-radius:99px}
.notice{background:#fbfbfe;border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:9px;padding:11px 13px;color:var(--ink2);font-size:12.5px}
.notice.warn{border-left-color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber)}
.notice.ok{border-left-color:var(--green);background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.empty{padding:32px 18px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink2);font-size:14px;margin-bottom:5px}
.list-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #eef0f7;font-size:13px}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row b{display:block;font-size:13px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.bar-row .lbl{width:150px;flex:none;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .track{flex:1;height:8px;background:#eef0f7;border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--brand);border-radius:99px}
.bar-row .val{width:52px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.timeline{position:relative;padding-left:20px}
.timeline:before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#e7eaf3}
.tl-item{position:relative;padding:0 0 15px}
.tl-item:before{content:'';position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:99px;background:#fff;border:2px solid var(--brand)}
.tl-item.done:before{background:var(--brand)}
.tl-item.late:before{border-color:var(--red);background:var(--red)}
.tl-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-body{color:var(--ink2);font-size:12.5px;margin-top:3px}
.tl-date{color:var(--muted);font-size:11.5px}

/* ---------- Modals & drawer ---------- */
.modal{display:none;position:fixed;inset:0;background:rgba(16,18,28,.5);z-index:60;padding:20px;overflow:auto;backdrop-filter:blur(2px)}
.modal.active{display:flex;align-items:flex-start;justify-content:center}
.modal-card{background:#fff;border-radius:16px;width:100%;max-width:760px;margin:auto;box-shadow:0 28px 70px rgba(10,12,22,.3);overflow:hidden}
.modal-card.wide{max-width:940px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:16px}
.modal-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.modal-body{padding:20px;max-height:70vh;overflow:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--border);background:#fafbfe;flex-wrap:wrap}
.x{border:0;background:transparent;font-size:22px;color:var(--muted);line-height:1;padding:2px 6px;border-radius:7px}
.x:hover{background:#f1f2f7;color:var(--ink)}
.drawer-mask{display:none;position:fixed;inset:0;background:rgba(16,18,28,.45);z-index:50;backdrop-filter:blur(2px)}
.drawer-mask.active{display:block}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(760px,100%);background:#fff;box-shadow:-20px 0 60px rgba(10,12,22,.22);display:flex;flex-direction:column}
.drawer-head{padding:18px 22px 0;flex:none}
.drawer-head .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer-head h2{font-size:19px}
.drawer-body{padding:0 22px 26px;overflow:auto;flex:1}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);margin:16px 0 0;overflow-x:auto;position:sticky;top:0;background:#fff;z-index:3;padding-bottom:0}
.tab{border:0;background:transparent;padding:9px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;font-size:13px;white-space:nowrap}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tabpane{display:none;padding-top:16px} .tabpane.active{display:block}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}
.info-box{border:1px solid var(--border);border-radius:10px;padding:9px 11px;background:#fbfbfe}
.info-box span{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-bottom:3px}
.info-box b{font-size:13px;font-weight:650;word-break:break-word}
.info-box .miss{color:var(--amber);font-weight:600}
.sticky-save{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:11px 0;display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.step{font-size:11.5px;font-weight:700;color:var(--muted);background:#f2f3f9;border-radius:99px;padding:5px 11px}
.step.active{background:var(--brand);color:#fff}
.step.done{background:var(--green-bg);color:var(--green)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--dark);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;font-size:13px;z-index:90;transition:transform .25s ease;box-shadow:0 12px 30px rgba(0,0,0,.28);max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.lines-table{width:100%;border-collapse:collapse;font-size:13px}
.lines-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border)}
.lines-table td{padding:6px 8px;border-bottom:1px solid #eef0f7}
.lines-table input,.lines-table select{width:100%;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:12.5px}
.totbox{display:flex;justify-content:flex-end;margin-top:12px}
.totbox table{font-size:13px;min-width:250px}
.totbox td{padding:5px 10px}
.totbox tr:last-child td{font-weight:800;font-size:15px;border-top:1px solid var(--border);color:var(--brand)}

@media (max-width:1000px){
  .cal-grid{grid-template-columns:repeat(7,minmax(92px,1fr));overflow-x:auto}
  .cal-c{min-height:82px}
  .cal-c.semaine{min-height:150px}
  .settings-layout{grid-template-columns:1fr}
  .settings-nav{position:static;display:flex;gap:5px;overflow-x:auto;padding-bottom:6px}
  .settings-nav .group-title{display:none}
  .snav{width:auto;white-space:nowrap}
  .hide-sm{display:none}
  .sim-banner{padding:8px 14px}
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:262px;z-index:70;transform:translateX(-100%);transition:transform .22s ease}
  .sidebar.open{transform:none}
  .burger{display:inline-flex}
  .cols2,.cols3,.grid,.grid.three,.grid.four{grid-template-columns:1fr}
  .content{padding:16px 14px 60px}
  .page-title h1{font-size:20px}
  .modal{padding:0}
  .modal-card{border-radius:0;max-width:100%;min-height:100%}
  .modal-body{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.55.6/docxtemplater.js"></script>
<script src="https://unpkg.com/pizzip@3.1.6/dist/pizzip.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

function syncGrille(){
  STRATES=PRICING.strates.map(s=>s.label);
  SETUP_KEYS=Object.keys(PRICING.oneShot);
  const n=PRICING.strates.length;
  const cale=a=>{while(a.length<n)a.push(a.length?a[a.length-1]:0);a.length=n;return a};
  PRICING.formules.forEach(f=>{PRICING.abonnement[f]=cale(PRICING.abonnement[f]||[]);
    SETUP_KEYS.forEach(k=>{PRICING.oneShot[k][f]=cale(PRICING.oneShot[k][f]||[])})});
  PRICING.options.forEach(o=>cale(o.pu));
}

/* ------------------------- Utilitaires ------------------------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('fr-FR').format(Math.round(Number(n)||0));
const money=n=>fmt(n)+' €';
const eur=n=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);
const money2=n=>eur(n)+' €';
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const today=()=>new Date(new Date().toDateString());
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const todayISO=()=>iso(today());
const shift=(n,from)=>{const d=from?new Date(from):today();d.setDate(d.getDate()+n);return iso(d)};
const shiftM=(n,from)=>{const d=from?new Date(from):today();d.setMonth(d.getMonth()+n);return iso(d)};
const frDate=s=>{if(!s)return '—';const [y,m,d]=String(s).split('-');return d+'/'+m+'/'+y};
const frShort=s=>{if(!s)return '—';const [y,m,d]=String(s).split('-');return d+'/'+m};
const frLong=s=>{if(!s)return '—';return new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})};
const dayDiff=(a,b)=>Math.round((new Date(a)-new Date(b||todayISO()))/86400000);
const isLate=s=>s&&dayDiff(s)<0;
const uniq=a=>[...new Set(a)].filter(Boolean).sort();
const sum=(a,f)=>a.reduce((t,x)=>t+(Number(f(x))||0),0);
const debounce=(fn,ms=180)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Number(v)||0));
const dayOfYear=d=>Math.floor((new Date(d)-new Date(new Date(d).getFullYear(),0,1))/86400000)+1;
const initiales=n=>String(n||'').trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'XX';

function toast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(type==='err'?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2800)}
function opts(arr,all,sel){return (all!==undefined?`<option value="">${esc(all)}</option>`:'')+arr.map(x=>`<option${String(x)===String(sel)?' selected':''}>${esc(x)}</option>`).join('')}
function badge(s,cls){return `<span class="tag ${cls||tagClass(s)}">${esc(s||'—')}</span>`}
function tagClass(s){
  if(['Client actif','Signé','Gagnée','Payée','Réalisée','Mise en production','En cours','Résolu','Actif','PREMIUM'].includes(s))return 'green';

    extras:PRICING.extras.map(e=>({i:e.id,qte:0,remise:0})),

/* Calcul complet d'un devis. Renvoie lignes, totaux mensuels, frais et simulation pluriannuelle. */
function computeQuote(cfg,pop,tva,dateDemarrage){
  const si=strateIndex(pop),f=cfg.formule,T=tva/100;
  const grille=PRICING.abonnement[f]||PRICING.abonnement[PRICING.formules[0]];
  const aboPu=grille[si]||0;
  const aboRem=clamp(cfg.aboRemise,0,100),aboNet=aboPu*(1-aboRem/100);
  const lignesAbo=[{nom:'Abonnement '+f,sous:'strate '+STRATES[si]+' — inclut 1 profil Gestionnaire + 1 profil Agent Pointeur',
    qte:'1',pu:eur(aboPu),remise:aboRem>0?'-'+eur(aboRem)+' %':'-',total:eur(aboNet),montant:aboNet}];
  (cfg.options||[]).forEach(o=>{
    const def=PRICING.options.find(x=>x.id===o.i);if(!def)return;
    const inclus=def.inclus||0,fact=Math.max(0,(Number(o.qte)||0)-inclus);
    if(fact<=0)return;
    const pu=def.pu[si],rem=clamp(o.remise,0,100),tot=pu*fact*(1-rem/100);
    lignesAbo.push({nom:def.nom+(inclus?' (supplémentaire)':''),sous:inclus?'au-delà du profil inclus / mois':'par mois',
      qte:String(fact),pu:eur(pu),remise:rem>0?'-'+eur(rem)+' %':'-',total:eur(tot),montant:tot});
  });
  const mrr=lignesAbo.reduce((s,l)=>s+l.montant,0);

  const lignesFrais=[];let fraisHors=0,formationTot=0,materielTot=0;
  SETUP_KEYS.forEach(k=>{
    const s=(cfg.setup||{})[k]||{};if(!s.inc)return;
    if(!PRICING.oneShot[k])return;
    const g=PRICING.oneShot[k][f]||PRICING.oneShot[k][PRICING.formules[0]]||[];
    const pu=g[si]||0,rem=clamp(s.rem,0,100),tot=pu*(1-rem/100);
    lignesFrais.push({nom:PRICING.oneShot[k].lib,qte:'1',pu:eur(pu),remise:rem>0?'-'+eur(rem)+' %':'-',total:eur(tot)});
    if(k==='formation')formationTot+=tot;else fraisHors+=tot;
  });
  (cfg.extras||[]).forEach(e=>{
    const def=PRICING.extras.find(x=>x.id===e.i),q=Number(e.qte)||0;if(!def||q<=0)return;
    const rem=clamp(e.remise,0,100),tot=def.pu*q*(1-rem/100);
    lignesFrais.push({nom:def.nom+(q>1?' ('+q+' u.)':''),qte:String(q),pu:eur(def.pu),remise:rem>0?'-'+eur(rem)+' %':'-',total:eur(tot)});
    materielTot+=tot;
  });
  const one=fraisHors+formationTot+materielTot;

  const mode=cfg.remiseMode,rPct=clamp(cfg.remisePct,0,100),rDur=Math.max(1,Number(cfg.remiseDuree)||12),rMois=Math.max(1,Number(cfg.remiseMois)||1);
  const mensuel=m=>mode==='pct'?(m<rDur?mrr*(1-rPct/100):mrr):(mode==='mois'?(m<rMois?0:mrr):mrr);
  const mrrNet=mode==='pct'?mrr*(1-rPct/100):mrr;

  const dDem=dateDemarrage||todayISO(),y0=new Date(dDem).getFullYear();
  const py={frais:[0,0,0,0],formation:[0,0,0,0],materiel:[0,0,0,0],abo:[0,0,0,0],mois:[0,0,0,0]};
  py.frais[0]=fraisHors;py.formation[0]=formationTot;py.materiel[0]=materielTot;
  let an1=0;
  for(let m=0;m<48;m++){
    const d=new Date(new Date(dDem).getFullYear(),new Date(dDem).getMonth()+m,1);
    const yi=d.getFullYear()-y0;if(yi<0||yi>3)continue;
    py.abo[yi]+=mensuel(m);py.mois[yi]+=1;
    if(yi===0)an1+=mensuel(m);
  }
  const pyHT=[0,1,2,3].map(i=>py.frais[i]+py.formation[i]+py.materiel[i]+py.abo[i]);
  const an1HT=an1+one;
  return {si,strateLabel:STRATES[si],aboPu,mrr,mrrNet,arr:mrr*12,one,fraisHors,formationTot,materielTot,
    lignesAbo,lignesFrais,mensuel,an1Abo:an1,an1HT,ht:an1HT,tva:an1HT*T,ttc:an1HT*(1+T),
    py,pyHT,pyTTC:pyHT.map(v=>v*(1+T)),remiseMax:Math.max(rPct,clamp(cfg.aboRemise,0,100),
      ...SETUP_KEYS.map(k=>clamp(((cfg.setup||{})[k]||{}).rem,0,100)),...(cfg.options||[]).map(o=>clamp(o.remise,0,100)))};
}
function quoteCalc(q){const o=org(q.orgId)||{};return computeQuote(q.config,o.population||0,getDB().settings.tva,q.dateDemarrage||q.date)}
function recalcQuote(q){
  const c=quoteCalc(q);
  Object.assign(q,{mrr:Math.round(c.mrr*100)/100,mrrNet:Math.round(c.mrrNet*100)/100,arr:Math.round(c.arr),
    one:Math.round(c.one),ht:Math.round(c.an1HT),tva:Math.round(c.tva),ttc:Math.round(c.ttc),remiseMax:c.remiseMax});
  return q;
}

const OBJETS=[
  ['organismes','Organismes'],['contacts','Contacts'],['actions','Actions et agenda'],['campagnes','Campagnes'],
  ['opportunites','Opportunités'],['devis','Devis'],['contrats','Contrats'],['factures','Factures'],
  ['deploiements','Déploiements'],['formations','Formations'],['support','Support'],
  ['statistiques','Statistiques'],['parametres','Paramètres']];
const VERBES=[['voir','Voir'],['creer','Créer'],['modifier','Modifier'],['supprimer','Supprimer'],['exporter','Exporter']];
const SENSIBLES=[
  ['exporterBase','Exporter la base de prospection','Un export, c’est le fichier commercial entier hors de l’entreprise.'],
  ['supprimerDefinitif','Supprimer définitivement des données',''],
  ['modifierTarifs','Modifier la grille tarifaire',''],

  ['validerDevis','Valider un devis en attente',''],
  ['gererUtilisateurs','Gérer les comptes, rôles et périmètres',''],
  ['restaurerSauvegarde','Restaurer ou réinitialiser les données','']];

const HORS_PERIMETRE=[['aucun','Aucun accès'],['restreint','Lecture restreinte'],['complet','Accès complet']];

function droitsVides(){const d={};OBJETS.forEach(([k])=>{d[k]={voir:false,creer:false,modifier:false,supprimer:false,exporter:false}});return d}
function droitsDe(liste){
  const d=droitsVides();
  Object.entries(liste).forEach(([k,v])=>{if(d[k])VERBES.forEach(([vb])=>d[k][vb]=v.includes(vb)||v.includes('tout'))});
  return d;
}
const T='tout',L=['voir'],LE=['voir','exporter'],LM=['voir','modifier'],LCM=['voir','creer','modifier'];
function rolesParDefaut(){

    {id:1,code:'ADMIN',nom:'Administrateur',systeme:true,horsPerimetre:'complet',
     desc:'Accès complet, y compris les comptes, la grille tarifaire et la restauration des données. Une à deux personnes au maximum.',
     droits:droitsDe(Object.fromEntries(OBJETS.map(([k])=>[k,[T]]))),

     desc:'Vue complète sur tous les organismes, tous les montants et toutes les statistiques. Valide les remises exceptionnelles. Ne gère pas les comptes.',
     droits:droitsDe({organismes:[T],contacts:[T],actions:[T],campagnes:[T],opportunites:[T],devis:[T],contrats:[T],
       factures:LM,deploiements:LM,formations:LM,support:LM,statistiques:LE,parametres:L}),
     sensibles:{exporterBase:false,supprimerDefinitif:true,modifierTarifs:false,remiseHorsPlafond:true,
       signerDevis:true,voirMontantsAutres:true,validerDevis:true,gererUtilisateurs:false,restaurerSauvegarde:false}},
    {id:3,code:'COM',nom:'Commercial',systeme:true,horsPerimetre:'restreint',
     desc:'Son périmètre géographique. Crée et modifie organismes, contacts, actions, opportunités et devis. Ne modifie pas les tarifs, ne supprime pas, n’exporte pas la base.',
     droits:droitsDe({organismes:LCM,contacts:LCM,actions:LCM,campagnes:LCM,opportunites:LCM,devis:LCM,
       contrats:L,factures:[],deploiements:L,formations:L,support:L,statistiques:L,parametres:[]}),
     sensibles:{exporterBase:false,supprimerDefinitif:false,modifierTarifs:false,remiseHorsPlafond:false,
       signerDevis:true,voirMontantsAutres:false,validerDevis:false,gererUtilisateurs:false,restaurerSauvegarde:false}},
    {id:4,code:'CONSULT',nom:'Consultant déploiement',systeme:true,horsPerimetre:'aucun',
     desc:'Les clients qui lui sont affectés. Écrit sur le déploiement, les formations et le support. Lecture seule sur devis et contrat. Aucun accès à la prospection.',
     droits:droitsDe({organismes:LM,contacts:LCM,actions:LCM,campagnes:[],opportunites:[],devis:L,contrats:L,
       factures:[],deploiements:[T],formations:LCM,support:[T],statistiques:[],parametres:[]}),
     sensibles:{exporterBase:false,supprimerDefinitif:false,modifierTarifs:false,remiseHorsPlafond:false,
       signerDevis:false,voirMontantsAutres:false,validerDevis:false,gererUtilisateurs:false,restaurerSauvegarde:false}},
    {id:5,code:'FORM',nom:'Formateur',systeme:true,horsPerimetre:'aucun',
     desc:'Uniquement les sessions qui lui sont assignées, plus la fiche client en lecture. Profil typiquement externe.',
     droits:droitsDe({organismes:L,contacts:L,actions:[],campagnes:[],opportunites:[],devis:[],contrats:[],
       factures:[],deploiements:L,formations:LM,support:[],statistiques:[],parametres:[]}),
     sensibles:Object.fromEntries(SENSIBLES.map(([k])=>[k,false]))},
    {id:6,code:'ADMFAC',nom:'Administration et facturation',systeme:true,horsPerimetre:'restreint',
     desc:'Contrats, factures, Chorus Pro et relances. Lecture sur les devis. Rien sur la prospection.',
     droits:droitsDe({organismes:L,contacts:L,actions:[],campagnes:[],opportunites:[],devis:L,contrats:LM,
       factures:[T],deploiements:[],formations:[],support:[],statistiques:L,parametres:[]}),
     sensibles:{exporterBase:false,supprimerDefinitif:false,modifierTarifs:false,remiseHorsPlafond:false,
       signerDevis:false,voirMontantsAutres:true,validerDevis:false,gererUtilisateurs:false,restaurerSauvegarde:false}},
    {id:7,code:'OBS',nom:'Observateur',systeme:true,horsPerimetre:'aucun',
     desc:'Lecture seule sur un périmètre défini. Pour un stagiaire, un partenaire ou un intervenant ponctuel.',
     droits:droitsDe({organismes:L,contacts:L,actions:L,campagnes:L,opportunites:L,devis:[],contrats:[],
       factures:[],deploiements:L,formations:L,support:L,statistiques:[],parametres:[]}),
     sensibles:Object.fromEntries(SENSIBLES.map(([k])=>[k,false]))}
  ];
}

/* ------------------------- Migration additive ------------------------- */
function ensureAcces(db){
  if(!db.roles)db.roles=rolesParDefaut();
  if(!db.perimetres)db.perimetres=[
    {id:1,nom:'France entière',regions:[],departements:[],portefeuilleSeul:false,nature:'tous',desc:'Aucune restriction géographique.'},
    {id:2,nom:'Normandie',regions:['Normandie'],departements:[],portefeuilleSeul:false,nature:'tous',desc:'Les cinq départements normands.'},
    {id:3,nom:'Grand Ouest hors Normandie',regions:['Bretagne','Pays de la Loire','Centre-Val de Loire'],departements:[],portefeuilleSeul:false,nature:'tous',desc:''},
    {id:4,nom:'Mes clients uniquement',regions:[],departements:[],portefeuilleSeul:true,nature:'clients',desc:'Les fiches dont le collaborateur est consultant, formateur ou commercial affecté.'}];
  if(!db.journal)db.journal=[];
  if(!db.seq.role)db.seq.role=db.roles.length;
  if(!db.seq.perimetre)db.seq.perimetre=db.perimetres.length;
  const map={'Administrateur':1,'Direction commerciale':2,'Commercial':3,'Consultant déploiement':4,'Formateur':5,'Administration et facturation':6,'Observateur':7};
  db.users.forEach(u=>{
    if(u.roleId===undefined)u.roleId=map[u.role]||3;
    if(u.perimetreId===undefined)u.perimetreId=u.roleId===3?2:1;
    if(!u.surcharges)u.surcharges={ajouts:[],retraits:[]};
    if(u.actif===undefined)u.actif=true;
    if(u.expiration===undefined)u.expiration=u.externe?shift(365):'';
    if(!u.email)u.email=(u.nom||'').toLowerCase().normalize('NFD').replace(/[^a-z ]/g,'').trim().replace(/\s+/g,'.')+'@oui-crm.fr';
  });
  if(db.users[1])db.users[1].perimetreId=2;
  if(db.users[2])db.users[2].perimetreId=3;
  if(db.users[3])db.users[3].perimetreId=4;
  if(db.users[4])db.users[4].perimetreId=4;
  return db;
}

/* ------------------------- Session ------------------------- */
let SESSION=1;
const me=()=>getDB().users.find(u=>u.id===SESSION)||getDB().users[0];
const roleDe=u=>getDB().roles.find(r=>r.id===(u||me()).roleId)||getDB().roles[0];
const perimetreDe=u=>getDB().perimetres.find(p=>p.id===(u||me()).perimetreId)||getDB().perimetres[0];

/* Droit effectif = droit du rôle, corrigé par les surcharges individuelles. */
function can(objet,verbe){
  const u=me(),r=roleDe(u),cle=objet+'.'+verbe;
  if((u.surcharges&&u.surcharges.retraits||[]).includes(cle))return false;
  if((u.surcharges&&u.surcharges.ajouts||[]).includes(cle))return true;
  return !!((r.droits[objet]||{})[verbe]);
}
function canS(cle){
  const u=me(),r=roleDe(u);
  if((u.surcharges&&u.surcharges.retraits||[]).includes('s.'+cle))return false;
  if((u.surcharges&&u.surcharges.ajouts||[]).includes('s.'+cle))return true;
  return !!(r.sensibles||{})[cle];
}
function ecartsRole(u){
  const a=(u.surcharges&&u.surcharges.ajouts||[]).length,r=(u.surcharges&&u.surcharges.retraits||[]).length;
  return a||r?(a?'+'+a+' droit'+(a>1?'s':''):'')+(a&&r?', ':'')+(r?'-'+r:''):'';
}

/* ------------------------- Périmètre ------------------------- */
function deptsDuPerimetre(p){
  const d=new Set(p.departements||[]);
  (p.regions||[]).forEach(r=>{const reg=REGIONS.find(x=>x[0]===r);if(reg)reg[1].forEach(x=>d.add(x))});
  return d;
}
/* 'complet' | 'restreint' | 'aucun' */
function acces(o){
  const u=me(),r=roleDe(u),p=perimetreDe(u);
  if(r.code==='ADMIN')return 'complet';
  let dans=true;
  const depts=deptsDuPerimetre(p);
  if(depts.size)dans=depts.has(String(o.dept));
  if(dans&&p.portefeuilleSeul)dans=[o.commercialId,o.csId,o.formateurId].includes(u.id);
  if(dans&&p.nature==='prospects')dans=o.statutClient==='Non client';
  if(dans&&p.nature==='clients')dans=o.statutClient!=='Non client';
  if(dans&&(p.campagneIds||[]).length)dans=dans||getDB().campaigns.some(c=>(p.campagneIds||[]).includes(c.id)&&c.orgIds.includes(o.id));
  return dans?'complet':(r.horsPerimetre||'restreint');
}
const visible=o=>acces(o)!=='aucun';
const complet=o=>acces(o)==='complet';
/* Portée des montants : un commercial ne voit que les siens. */
function scopeQuotes(list){return canS('voirMontantsAutres')?list:list.filter(q=>q.respId===SESSION)}
function scopeOpps(list){return canS('voirMontantsAutres')?list:list.filter(o=>o.respId===SESSION)}
function scopeOrgs(list){return list.filter(visible)}
function scopeContrats(list){return canS('voirMontantsAutres')?list:list.filter(c=>{const o=org(c.orgId);return o&&complet(o)})}
function scopeActions(list){return canS('voirMontantsAutres')?list:list.filter(a=>a.userId===SESSION)}

/* ------------------------- Journal ------------------------- */
function log(action,objet,ref,detail){
  const db=getDB();
  db.journal.unshift({id:nextId('journal'),date:new Date().toISOString(),userId:SESSION,action,objet,ref:ref||'',detail:detail||''});
  if(db.journal.length>400)db.journal.length=400;
}

/* ------------------------- Garde ------------------------- */
function refuse(msg){toast(msg||'Votre rôle ne permet pas cette action.','err');return false}
function guard(objet,verbe,msg){return can(objet,verbe)?true:refuse(msg)}
function guardS(cle,msg){return canS(cle)?true:refuse(msg)}

/* ------------------------- Sélecteur de session ------------------------- */
function renderSessionPicker(){
  const db=getDB(),u=me(),r=roleDe(u);
  const el=document.getElementById('sessionPicker');if(!el)return;
  el.innerHTML=`<select class="control" style="height:34px;min-width:210px" onchange="switchUser(this.value)">
    ${db.users.filter(x=>x.actif).map(x=>`<option value="${x.id}"${x.id===SESSION?' selected':''}>${esc(x.nom)} — ${esc((getDB().roles.find(rr=>rr.id===x.roleId)||{}).nom||'')}</option>`).join('')}
  </select>`;
  document.getElementById('meInitials').textContent=u.initiales;
  document.getElementById('meName').textContent=r.nom;
  const p=perimetreDe(u),d=deptsDuPerimetre(p);
  const b=document.getElementById('simBanner');
  if(b)b.innerHTML=`<b>Simulation d’ergonomie</b> — vous consultez l’application comme ${esc(u.nom)} (${esc(r.nom)}).
    Périmètre : ${esc(p.nom)}${d.size?' · '+d.size+' département(s)':''}${p.portefeuilleSeul?' · portefeuille personnel':''}.
    Hors périmètre : ${esc((HORS_PERIMETRE.find(h=>h[0]===r.horsPerimetre)||[])[1]||'—')}.
    Les droits sont appliqués à l’affichage ; ils ne sécurisent pas les données de cette maquette.`;
}
function switchUser(id){
  SESSION=Number(id);
  applyMenuRights();renderSessionPicker();
  const page=document.querySelector('.nav[data-page].allowed');
  navigate(pageAutorisee(CURRENT)?CURRENT:(page?page.dataset.page:'dashboard'));
  toast('Vue « '+me().nom+' »');
}
const PAGE_OBJET={dashboard:null,agenda:'actions',stats:'statistiques',organismes:'organismes',campagnes:'campagnes',
  prospection:'organismes',opportunites:'opportunites',devis:'devis',contrats:'contrats',factures:'factures',
  portefeuille:'organismes',deploiements:'deploiements',formations:'formations',support:'support',settings:'parametres',
  renouvellements:'contrats',acces:'parametres'};
function pageAutorisee(p){const o=PAGE_OBJET[p];return !o||can(o,'voir')}
function applyMenuRights(){
  document.querySelectorAll('.nav[data-page]').forEach(n=>{
    const ok=pageAutorisee(n.dataset.page);
    n.style.display=ok?'':'none';n.classList.toggle('allowed',ok);
  });
  document.querySelectorAll('.group').forEach(g=>{
    const any=[...g.querySelectorAll('.nav[data-page]')].some(n=>n.style.display!=='none');
    g.style.display=any?'':'none';
  });
}
</script>
<script>
/* ===================== Règles de gestion ===================== */
function createContractFrom(q,silent){
  const db=getDB();
  const ex=db.contracts.find(c=>c.quoteId===q.id);if(ex)return ex;
  const cfg=q.config,c0=quoteCalc(q);
  const debut=q.dateDemarrage||q.dateSignature||q.date;
  const eng=Number(cfg.engagementMois)||0;
  const c={id:nextId('contract'),orgId:q.orgId,quoteId:q.id,numero:q.numero.replace('DEV','CTR'),
    dateSignature:q.dateSignature||q.date,dateDebut:debut,dureeMois:eng,
    dateFin:eng>0?shift(-1,shiftM(eng,debut)):'',tacite:!!cfg.resiliable,preavisMois:db.settings.preavisMois,
    facturation:cfg.facturation,formule:cfg.formule,
    mrr:Math.round(c0.mrr*100)/100,arr:Math.round(c0.arr),one:Math.round(c0.one),
    clauseEssai:!!cfg.clauseEssai,statut:'En cours'};
  db.contracts.push(c);
  const o=org(q.orgId);
  if(o){
    if(o.statutClient==='Non client'){o.statutClient='Client en déploiement';o.deployStage=DEPLOY_STAGES[0];o.csId=o.csId||5;o.formateurId=o.formateurId||4}
    o.statutCommercial='Clôturé';
    o.dateMepCible=o.dateMepCible||debut;
  }
  if(!silent)toast('Contrat '+c.numero+' créé.');
  return c;
}
/* Échéancier : facture de mise en service puis abonnements, sur 12 mois glissants. Strictement idempotent. */
function generateInvoicesFor(c,silent){
  const db=getDB(),q=db.quotes.find(x=>x.id===c.quoteId);
  if(!q)return 0;
  const calc=quoteCalc(q),T=db.settings.tva;
  let n=0;
  const push=(periode,objet,ht,dateEmission)=>{
    if(ht<=0)return;
    if(db.invoices.some(f=>f.contractId===c.id&&f.periode===periode))return;
    db.invoices.push({id:nextId('invoice'),orgId:c.orgId,contractId:c.id,numero:nextNum('invoice','FAC'),
      periode,objet,ht:Math.round(ht*100)/100,tvaRate:T,tva:Math.round(ht*T)/100,ttc:Math.round(ht*(1+T/100)*100)/100,
      dateEmission,echeance:shift(30,dateEmission),statut:'À émettre',
      chorus:{siretAcheteur:(org(c.orgId)||{}).siret||'',codeService:'',numEngagement:''}});
    n++;
  };
  push('SETUP','Frais de mise en service (déploiement, paramétrage, formation, matériel)',calc.one,c.dateDebut);
  const horizon=shift(365);
  const finISO=c.dateFin||shift(365*3,c.dateDebut);
  if(c.facturation==='annuelle'){
    for(let a=0;a<4;a++){
      const d=shiftM(a*12,c.dateDebut);
      if(d>finISO||d>horizon)break;
      let ht=0;for(let m=a*12;m<a*12+12;m++)ht+=calc.mensuel(m);
      push('A'+(a+1),'Abonnement '+c.formule+' — année '+(a+1),ht,d);
    }
  }else{
    for(let m=0;m<48;m++){
      const d=shiftM(m,c.dateDebut);
      if(d>finISO||d>horizon)break;
      push('M'+(m+1),'Abonnement '+c.formule+' — '+new Date(d).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}),calc.mensuel(m),d);
    }
  }
  if(!silent)toast(n?n+' échéance(s) ajoutée(s).':'Échéancier déjà à jour — aucun doublon créé.');
  return n;
}
function setOppStage(op,stage){
  if(!op||op.stage===stage)return;
  op.stage=stage;op.historique=op.historique||[];
  if(!op.historique.some(h=>h.stage===stage))op.historique.push({stage,date:todayISO()});
}
function syncFromQuote(q){
  const db=getDB(),o=org(q.orgId),op=db.opps.find(x=>x.id===q.oppId);
  const stage=QUOTE_TO_STAGE[q.statut];
  if(op&&stage&&op.stage!=='Gagnée')setOppStage(op,stage);
  if(o&&['Envoyé','Relancé','En négociation'].includes(q.statut)&&['Non contacté','À contacter'].includes(o.statutCommercial))o.statutCommercial='En cours de prospection';
  if(q.statut==='Signé'){q.dateSignature=q.dateSignature||todayISO();createContractFrom(q,true)}
}
const actionsOf=id=>getDB().actions.filter(a=>a.orgId==id).sort((a,b)=>b.date.localeCompare(a.date));
const nextActionOf=id=>getDB().actions.filter(a=>a.orgId==id&&a.statut==='Planifiée').sort((a,b)=>a.date.localeCompare(b.date))[0]||null;
const lastActionOf=id=>getDB().actions.filter(a=>a.orgId==id&&a.statut==='Réalisée').sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
const contactsOf=id=>getDB().contacts.filter(c=>c.orgId==id);
const quotesOf=id=>getDB().quotes.filter(q=>q.orgId==id);
const oppsOf=id=>getDB().opps.filter(o=>o.orgId==id);
const contractOf=id=>getDB().contracts.filter(c=>c.orgId==id).sort((a,b)=>String(b.dateFin).localeCompare(String(a.dateFin)))[0]||null;
const openActions=()=>getDB().actions.filter(a=>a.statut==='Planifiée');
const lateActions=()=>openActions().filter(a=>dayDiff(a.date)<0);
const todayActions=()=>openActions().filter(a=>a.date===todayISO());
function valeurOpp(o){
  const qs=getDB().quotes.filter(q=>q.oppId===o.id);
  if(qs.length)return Math.max(...qs.map(q=>q.ht||0));
  const oo=org(o.orgId)||{},si=strateIndex(oo.population);
  const abo=PRICING.abonnement[oo.formuleCible||'CONFORT'][si]*12;
  const one=PRICING.oneShot.deploiement.CONFORT[si]+PRICING.oneShot.parametrage.CONFORT[si]+PRICING.oneShot.formation.CONFORT[si];
  return Math.round(abo+one);
}

/* Export calendrier : démonstrations et RDV physiques uniquement. */
function exportICS(id){
  const a=getDB().actions.find(x=>x.id===id);if(!a)return;
  const o=org(a.orgId)||{},c=getDB().contacts.find(x=>x.id===a.contactId);
  const st=new Date(a.date+'T'+(a.heure||'09:00')+':00');
  const en=new Date(st.getTime()+(a.duree||60)*60000);
  const z=d=>d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')+'T'
    +String(d.getUTCHours()).padStart(2,'0')+String(d.getUTCMinutes()).padStart(2,'0')+'00Z';
  const esc2=s=>String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const lieu=a.type==='RDV physique'?[o.adresse,o.cp,o.ville].filter(Boolean).join(' '):'Visioconférence';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Oui CRM//OUI CRM//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:action-'+a.id+'@oui-crm',
    'DTSTAMP:'+z(new Date()),'DTSTART:'+z(st),'DTEND:'+z(en),
    'SUMMARY:'+esc2(a.type+' — '+(o.nom||'')),
    'LOCATION:'+esc2(lieu),
    'DESCRIPTION:'+esc2((a.compteRendu||'')+(c?'\nInterlocuteur : '+c.prenom+' '+c.nom+(c.fonction?' ('+c.fonction+')':'')+(c.mobile?' — '+c.mobile:''):'')+'\nCommercial : '+userNom(a.userId)),
    'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:Rappel','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  download('RDV_'+(o.nom||'oui-crm').replace(/[^\w]+/g,'_')+'_'+a.date+'.ics',ics,'text/calendar;charset=utf-8');
  toast('Fichier calendrier téléchargé — ouvrez-le pour l’ajouter à Outlook.');
}

RENDER.stats=function(){
  const db=getDB();

  const base=scopeOrgs(db.orgs);
  const cnt=f=>{const m={};base.forEach(o=>{const k=f(o)||'—';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const parSol=cnt(o=>o.solution),parEd=cnt(o=>editeurDe(o.solution)==='—'?'Sans éditeur (interne / tableur)':editeurDe(o.solution));
  const parStrate=STRATES.map(s=>[s,base.filter(o=>strate(o.population)===s).length]);
  const parDept=cnt(o=>'Dépt. '+o.dept+' — '+regionDe(o.dept)),parType=cnt(o=>o.type),parStat=STAT_COM.map(s=>[s,base.filter(o=>o.statutCommercial===s).length]);
  const max=a=>Math.max(1,...a.map(x=>x[1]));
  const parFormule=PRICING.formules.map(f=>[f,db.contracts.filter(c=>c.formule===f).length]);
  const parCom=db.users.filter(u=>['Commercial','Administrateur'].includes(u.role)).map(u=>{
    const opps=db.opps.filter(o=>o.respId===u.id);
    const g=opps.filter(o=>o.stage==='Gagnée'),p=opps.filter(o=>o.stage==='Perdue');
    const ca=sum(db.quotes.filter(q=>q.respId===u.id&&q.statut==='Signé'),q=>q.ht);
    return {u,portefeuille:db.orgs.filter(o=>o.commercialId===u.id).length,opps:opps.length,g:g.length,p:p.length,ca,
      act:db.actions.filter(a=>a.userId===u.id&&a.statut==='Réalisée').length,
      taux:(g.length+p.length)?pct(g.length,g.length+p.length):null};
  });
  document.getElementById('page-stats').innerHTML=
  pageHead('Statistiques','Répartition de la base, performance commerciale et positionnement face aux éditeurs concurrents.')
  +`<div class="cols2">
    <div class="panel panel-pad"><h3>Solution en place chez l’organisme</h3>${bars(parSol,max(parSol))}
      <div class="section-title">Regroupé par éditeur</div>${bars(parEd,max(parEd))}</div>
    <div class="panel panel-pad"><h3>Répartition par strate tarifaire</h3>${bars(parStrate,max(parStrate))}
      <div class="section-title">Par type de structure</div>${bars(parType,max(parType))}</div>
  </div>
  <div class="cols2" style="margin-top:14px">
    <div class="panel panel-pad"><h3>Par département</h3>${bars(parDept,max(parDept))}</div>
    <div class="panel panel-pad"><h3>Par statut commercial</h3>${bars(parStat,max(parStat))}
      <div class="section-title">Contrats par formule</div>${bars(parFormule,max(parFormule))}</div>
  </div>
  ${canS('voirMontantsAutres')?`<div class="section-title">Performance par commercial</div>`:''}
  ${!canS('voirMontantsAutres')?`<div class="notice" style="margin-top:14px">Le détail par collaborateur est réservé à la direction commerciale.</div>`:''}
  ${canS('voirMontantsAutres')?`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr>
    <th>Collaborateur</th><th class="num">Portefeuille</th><th class="num">Actions réalisées</th><th class="num">Opportunités</th><th class="num">Gagnées</th><th class="num">Perdues</th><th class="num">Taux</th><th class="num">CA signé 1re année</th>
  </tr></thead><tbody>${parCom.map(r=>`<tr>
    <td><span class="row-title">${esc(r.u.nom)}</span><span class="subtle">${esc(r.u.role)}</span></td>
    <td class="num">${r.portefeuille}</td><td class="num">${r.act}</td><td class="num">${r.opps}</td>
    <td class="num">${r.g}</td><td class="num">${r.p}</td>
    <td class="num">${r.taux===null?'—':r.taux+'%'}</td><td class="num"><b>${money(r.ca)}</b></td></tr>`).join('')}
  </tbody></table></div></div>`:''}`;
};

let F={search:'',type:'',dept:'',statCom:'',statClient:'',prio:'',strate:'',sol:'',etiq:'',com:''};
let SORT={key:'nom',dir:1};
let PAGE={n:1,size:25};
let SEL=new Set();

function matchOrg(o,f){
  const q=(f.search||'').toLowerCase();
  const cs=contactsOf(o.id).map(c=>c.prenom+' '+c.nom+' '+c.email).join(' ');
  return (!q||(o.nom+' '+o.ville+' '+o.cp+' '+(o.siret||'')+' '+(o.epci||'')+' '+cs).toLowerCase().includes(q))
    &&(!f.type||o.type===f.type)&&(!f.dept||o.dept===f.dept)
    &&(!f.statCom||o.statutCommercial===f.statCom)&&(!f.statClient||o.statutClient===f.statClient)
    &&(!f.prio||o.priorite===f.prio)&&(!f.strate||strate(o.population)===f.strate)
    &&(!f.sol||o.solution===f.sol)&&(!f.etiq||(o.etiquettes||[]).includes(f.etiq))
    &&(!f.com||String(o.commercialId||'')===String(f.com));
}
function filtered(f){
  const list=getDB().orgs.filter(o=>visible(o)&&matchOrg(o,f||F));
  const k=SORT.key;
  return list.sort((a,b)=>{
    let x,y;
    if(k==='population'){x=a.population||0;y=b.population||0}
    else if(k==='next'){x=(nextActionOf(a.id)||{}).date||'9999';y=(nextActionOf(b.id)||{}).date||'9999'}
    else{x=String(a[k]??'').toLowerCase();y=String(b[k]??'').toLowerCase()}
    return (x>y?1:x<y?-1:0)*SORT.dir;
  });
}
function filterBar(){
  const db=getDB();
  return `<div class="filters">

    <select class="control" id="fType">${opts(TYPES,'Tous les types',F.type)}</select>

function bindFilters(){
  const map={fSearch:'search',fType:'type',fDept:'dept',fStrate:'strate',fStatCom:'statCom',fStatClient:'statClient',fPrio:'prio',fSol:'sol',fEtiq:'etiq',fCom:'com'};

  const rows=filtered(),total=rows.length;
  const pages=Math.max(1,Math.ceil(total/PAGE.size));

  const slice=rows.slice((PAGE.n-1)*PAGE.size,PAGE.n*PAGE.size);

async function lookupEntreprise(){
  const q=val('siretQ'),box=document.getElementById('siretRes');
  if(!q){box.innerHTML='<div class="notice warn">Saisissez un nom ou un numéro SIRET.</div>';return}
  box.innerHTML='<div class="notice">Recherche en cours…</div>';
  try{
    const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch('https://recherche-entreprises.api.gouv.fr/search?q='+encodeURIComponent(q)+'&per_page=6',{signal:ctrl.signal});
    clearTimeout(to);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.results||!j.results.length){box.innerHTML='<div class="notice warn">Aucun établissement trouvé. Basculez sur la saisie manuelle.</div>';return}
    box.innerHTML=j.results.map((e,i)=>{

        <button class="btn small primary" onclick="pickEntreprise(${i})">Utiliser</button></div>`}).join('');
  }catch(err){
    box.innerHTML=`<div class="notice warn">La recherche officielle n’a pas répondu (connexion indisponible ou service momentanément inaccessible). Passez par la saisie manuelle : tous les champs restent modifiables.</div>`;

    adresse:(s.numero_voie?s.numero_voie+' ':'')+(s.libelle_voie||s.adresse||''),cp:s.code_postal||'',
    ville:s.libelle_commune||'',dept:s.departement||(s.code_postal||'').slice(0,2),type:'Commune'};
  if(/SIVOS/i.test(p.nom))p.type='SIVOS';else if(/SIVU/i.test(p.nom))p.type='SIVU';
  else if(/SIVOM/i.test(p.nom))p.type='SIVOM';else if(/COMMUNAUTE|COMMUNAUTÉ/i.test(p.nom))p.type='EPCI / Communauté de communes';
  else if(/CCAS/i.test(p.nom))p.type='CCAS';

function openImport(){
  openModal('Importer des organismes','Chargez un fichier CSV. Les colonnes sont reconnues automatiquement.',
  `<div class="steps"><span class="step active">1 · Fichier</span><span class="step">2 · Contrôle</span><span class="step">3 · Doublons</span><span class="step">4 · Import</span></div>
   <div class="field"><label>Fichier CSV (séparateur « ; » ou « , »)</label><input type="file" id="impFile" accept=".csv,text/csv" onchange="parseImport(this)"></div>
   <div class="notice" style="margin-top:12px">Colonnes reconnues : <b>nom</b>, type, adresse, cp, ville, departement, population, siret, insee, epci, telephone, email, solution, priorite.
   Seul <b>nom</b> est obligatoire. La strate est recalculée, les doublons SIRET / INSEE sont écartés.</div>
   <div id="impPreview" style="margin-top:14px"></div>`,
  `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" id="impBtn" disabled onclick="runImport()">Importer</button>`,true);
}
let IMPORT=[];
function parseImport(input){
  const f=input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const txt=String(rd.result).replace(/^\ufeff/,'');
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length)return;
    const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
    const split=l=>{const out=[];let cur='',q=false;
      for(let i=0;i<l.length;i++){const c=l[i];
        if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}
        else if(c===sep&&!q){out.push(cur);cur=''}else cur+=c}
      out.push(cur);return out.map(s=>s.trim())};
    const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
    const head=split(lines[0]).map(norm);
    const idx=n=>head.findIndex(h=>h===n||h.startsWith(n));
    const col={nom:idx('nom'),type:idx('type'),adresse:idx('adresse'),cp:idx('cp')>=0?idx('cp'):idx('codepostal'),
      ville:idx('ville')>=0?idx('ville'):idx('commune'),dept:idx('departement')>=0?idx('departement'):idx('dept'),
      population:idx('population'),siret:idx('siret'),insee:idx('insee'),epci:idx('epci'),
      tel:idx('telephone')>=0?idx('telephone'):idx('tel'),email:idx('email'),solution:idx('solution'),priorite:idx('priorite')};
    if(col.nom<0){document.getElementById('impPreview').innerHTML='<div class="notice warn">Colonne « nom » introuvable dans l’en-tête du fichier.</div>';return}
    const get=(r,k)=>col[k]>=0?(r[col[k]]||''):'';
    IMPORT=lines.slice(1).map(l=>{const r=split(l);
      const o={nom:get(r,'nom'),type:get(r,'type')||'Commune',adresse:get(r,'adresse'),cp:get(r,'cp'),
        ville:get(r,'ville'),dept:get(r,'dept')||get(r,'cp').slice(0,2),population:Number(String(get(r,'population')).replace(/\s/g,''))||0,
        siret:get(r,'siret').replace(/\s/g,''),insee:get(r,'insee'),epci:get(r,'epci')||'—',
        tel:get(r,'tel'),email:get(r,'email'),solution:SOLUTIONS.includes(get(r,'solution'))?get(r,'solution'):'Aucun logiciel identifié',
        priorite:PRIORITES.includes(get(r,'priorite'))?get(r,'priorite'):'Normale'};
      o._dup=!!findDuplicate(o);o._ok=!!o.nom;return o}).filter(o=>o.nom);
    const dups=IMPORT.filter(o=>o._dup).length;
    document.getElementById('impPreview').innerHTML=
     `<div class="steps"><span class="step done">1 · Fichier</span><span class="step done">2 · Contrôle</span><span class="step active">3 · Doublons</span><span class="step">4 · Import</span></div>
      <div class="notice ${dups?'warn':'ok'}">${IMPORT.length} ligne(s) lue(s) · ${dups} doublon(s) détecté(s) et ${dups?'écarté(s)':'aucun à écarter'} · ${IMPORT.length-dups} fiche(s) seront créées.</div>
      <div class="table-wrap" style="margin-top:12px;max-height:260px"><table class="table" style="min-width:640px"><thead><tr><th>Nom</th><th>Type</th><th>Ville</th><th>Dépt.</th><th class="num">Population</th><th>Strate</th><th>État</th></tr></thead><tbody>
      ${IMPORT.slice(0,60).map(o=>`<tr><td>${esc(o.nom)}</td><td>${esc(o.type)}</td><td>${esc(o.ville)}</td><td>${esc(o.dept)}</td><td class="num">${o.population?fmt(o.population):'—'}</td><td>${esc(strate(o.population))}</td><td>${o._dup?badge('Doublon','red'):badge('À créer','green')}</td></tr>`).join('')}
      </tbody></table></div>${IMPORT.length>60?'<p class="subtle">Aperçu limité aux 60 premières lignes.</p>':''}`;
    document.getElementById('impBtn').disabled=false;
  };
  rd.readAsText(f,'UTF-8');
}
function runImport(){
  const db=getDB();let n=0;
  IMPORT.filter(o=>!o._dup).forEach(o=>{
    const id=nextId('org');
    db.orgs.push({id,nom:o.nom,type:TYPES.includes(o.type)?o.type:'Commune',ville:o.ville,cp:o.cp,dept:o.dept,
      population:o.population,siret:o.siret,insee:o.insee,epci:o.epci,adresse:o.adresse,tel:o.tel,email:o.email,site:'',
      statutCommercial:'Non contacté',statutClient:'Non client',priorite:o.priorite,etiquettes:[],
      commercialId:null,csId:null,formateurId:null,solution:o.solution,formuleCible:'CONFORT',prefixe:'',nbEcoles:0,nbEnfants:0,services:[],notes:'',
      deployStage:null,createdAt:todayISO(),updatedAt:todayISO()});n++});
  log('Import','Organismes',n+' fiches');commit();closeModal();toast(n+' organisme(s) importé(s).');rerender();
}

<script>
/* ===================== Fiche organisme ===================== */
let DRAWER=null;
function closeDrawer(){document.getElementById('drawerMask').classList.remove('active');DRAWER=null}

function completeness(o){
  const req=[['SIRET',o.siret],['Adresse',o.adresse],['Code postal',o.cp],['Population',o.population],
    ['Représentant légal',contactsOf(o.id).some(c=>c.principal)],['Email',o.email]];
  return {manquants:req.filter(r=>!r[1]).map(r=>r[0]),score:pct(req.filter(r=>r[1]).length,req.length)};
}
function openDrawer(id,tab){
  const o=org(id);if(!o)return;
  const a=acces(o);
  if(a==='aucun'){toast('Cette fiche est hors de votre périmètre.','err');return}
  if(a==='restreint'){openDrawerRestreint(o);return}
  DRAWER=id;
  const c=completeness(o),ctr=contractOf(id);
  document.getElementById('drawerHead').innerHTML=`
    <div class="row">
      <div><h2>${esc(o.nom)}</h2>
        <p class="subtle" style="margin-top:4px">${esc(o.type)} · ${esc(o.ville)} ${esc(o.cp||'')} · Dépt. ${esc(o.dept)} · ${esc(strate(o.population))}</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">${badge(o.statutCommercial)}${badge(o.statutClient)}${badge(o.priorite)}${(o.etiquettes||[]).map(e=>badge(e,'purple')).join('')}</div></div>
      <button class="x" onclick="closeDrawer()">×</button>
    </div>
    <div class="tabs">
      ${[['synthese','Synthèse'],['contacts','Contacts'],['actions','Actions'],['commercial','Commercial'],['client','Client'],['support','Support']]
        .filter(([k])=>({contacts:'contacts',actions:'actions',commercial:'devis',client:'deploiements',support:'support'}[k]?can({contacts:'contacts',actions:'actions',commercial:'devis',client:'deploiements',support:'support'}[k],'voir'):true))
        .map(([k,l],i)=>`<button class="tab ${(tab?tab===k:i===0)?'active':''}" onclick="switchTab(this,'${k}')">${l}${k==='contacts'?' ('+contactsOf(id).length+')':''}${k==='actions'?' ('+actionsOf(id).length+')':''}</button>`).join('')}
    </div>`;
  document.getElementById('drawerBody').innerHTML=
    ['synthese','contacts','actions','commercial','client','support'].map((k,i)=>
      `<div class="tabpane ${(tab?tab===k:i===0)?'active':''}" id="pane-${k}">${paneHTML(k,o)}</div>`).join('');
  document.getElementById('drawerMask').classList.add('active');
}
function switchTab(btn,k){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+k).classList.add('active');
}
function refreshDrawer(tab){if(DRAWER)openDrawer(DRAWER,tab)}
function openDrawerRestreint(o){
  DRAWER=null;
  document.getElementById('drawerHead').innerHTML=`
    <div class="row"><div><h2>${esc(o.nom)}</h2>
      <p class="subtle" style="margin-top:4px">${esc(o.type)} · ${esc(o.ville)} · Dépt. ${esc(o.dept)} — ${esc(regionDe(o.dept))}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">${badge(o.statutCommercial)}${badge(o.statutClient)}</div></div>
      <button class="x" onclick="closeDrawer()">×</button></div>`;
  document.getElementById('drawerBody').innerHTML=`
    <div class="notice warn" style="margin-top:18px"><b>Lecture restreinte</b> — cet organisme est hors de votre périmètre (${esc(perimetreDe().nom)}).
      Vous voyez qu’il est suivi, par qui et à quel stade, sans accéder aux contacts, aux montants ni aux comptes rendus.
      Cette visibilité évite que deux commerciaux appellent la même mairie à trois jours d’intervalle.</div>
    <div class="info-grid" style="margin-top:16px">
      <div class="info-box"><span>Suivi par</span><b>${esc(o.commercialId?userNom(o.commercialId):'Non affecté')}</b></div>
      <div class="info-box"><span>Statut commercial</span><b>${esc(o.statutCommercial)}</b></div>
      <div class="info-box"><span>Statut client</span><b>${esc(o.statutClient)}</b></div>
      <div class="info-box"><span>Département</span><b>${esc(o.dept)} — ${esc(regionDe(o.dept))}</b></div>
    </div>
    <p class="subtle" style="margin-top:16px">Pour intervenir sur cette fiche, demandez son transfert à ${esc(o.commercialId?userNom(o.commercialId):'la direction commerciale')} ou une extension de votre périmètre.</p>`;
  document.getElementById('drawerMask').classList.add('active');
}

function paneHTML(k,o){
  const db=getDB();
  if(k==='synthese'){
    const c=completeness(o);
    return `${c.manquants.length?`<div class="notice warn" style="margin-bottom:14px"><b>Fiche incomplète</b> — ${esc(c.manquants.join(', '))} manque${c.manquants.length>1?'nt':''}. Ces éléments sont exigés pour générer un contrat.</div>`:`<div class="notice ok" style="margin-bottom:14px">Fiche complète : contrat générable sans blocage.</div>`}
    <div class="section-title">Identité</div>
    <div class="grid">
      <div class="field"><label>Nom</label><input id="eNom" value="${esc(o.nom)}"></div>
      <div class="field"><label>Type de structure</label><select id="eType">${opts(TYPES,undefined,o.type)}</select></div>
      <div class="field"><label>SIRET</label><input id="eSiret" value="${esc(o.siret)}"></div>
      <div class="field"><label>Code INSEE</label><input id="eInsee" value="${esc(o.insee)}"></div>
      <div class="field"><label>Adresse</label><input id="eAdresse" value="${esc(o.adresse)}"></div>
      <div class="field"><label>Code postal</label><input id="eCp" value="${esc(o.cp)}"></div>
      <div class="field"><label>Ville</label><input id="eVille" value="${esc(o.ville)}"></div>
      <div class="field"><label>Département</label><input id="eDept" value="${esc(o.dept)}"></div>
      <div class="field"><label>Population</label><input id="ePop" type="number" value="${esc(o.population)}" oninput="document.getElementById('eStrate').value=strate(this.value)"></div>
      <div class="field"><label>Strate</label><input id="eStrate" value="${esc(strate(o.population))}" disabled></div>
      <div class="field"><label>EPCI</label><input id="eEpci" value="${esc(o.epci)}"></div>
      <div class="field"><label>Téléphone</label><input id="eTel" value="${esc(o.tel)}"></div>
      <div class="field"><label>Email</label><input id="eEmail" value="${esc(o.email)}"></div>
      <div class="field"><label>Site internet</label><input id="eSite" value="${esc(o.site||'')}"></div>
    </div>
    <div class="section-title">Environnement périscolaire</div>
    <div class="grid three">
      <div class="field"><label>Solution en place</label><select id="eSol">${opts(SOLUTIONS,undefined,o.solution)}</select><div class="hint">Éditeur : ${esc(editeurDe(o.solution))}</div></div>
      <div class="field"><label>Nombre d’écoles</label><input id="eEcoles" type="number" value="${esc(o.nbEcoles||0)}"></div>
      <div class="field"><label>Enfants concernés (estimation)</label><input id="eEnfants" type="number" value="${esc(o.nbEnfants||0)}"></div>
      <div class="field"><label>Formule envisagée</label><select id="eFormule">${opts(PRICING.formules,undefined,o.formuleCible||'CONFORT')}</select></div>
    </div>
    <div class="field" style="margin-top:12px"><label>Services gérés</label>
      <div class="grid three" style="margin-top:6px">${SERVICES.map((s,i)=>
        `<label class="check ${(o.services||[]).includes(s)?'on':''}"><input type="checkbox" class="svc" value="${esc(s)}" ${(o.services||[]).includes(s)?'checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(s)}</label>`).join('')}</div></div>
    <div class="section-title">Suivi</div>
    <div class="grid">
      <div class="field"><label>Statut commercial</label><select id="eStatCom">${opts(STAT_COM,undefined,o.statutCommercial)}</select>
        <div class="hint">${esc(STAT_COM_DEF[o.statutCommercial]||'')}</div></div>
      <div class="field"><label>Statut client</label><select id="eStatCli">${opts(STAT_CLIENT,undefined,o.statutClient)}</select></div>
      <div class="field"><label>Priorité</label><select id="ePrio">${opts(PRIORITES,undefined,o.priorite)}</select></div>
      <div class="field"><label>Commercial en charge</label><select id="eCom"><option value="">Non affecté</option>${db.users.map(u=>`<option value="${u.id}"${o.commercialId==u.id?' selected':''}>${esc(u.nom)}</option>`).join('')}</select></div>
    </div>
    <div class="field" style="margin-top:12px"><label>Étiquettes</label>
      <div class="grid three" style="margin-top:6px">${ETIQUETTES.map(e=>
        `<label class="check ${(o.etiquettes||[]).includes(e)?'on':''}"><input type="checkbox" class="etq" value="${esc(e)}" ${(o.etiquettes||[]).includes(e)?'checked':''} onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(e)}</label>`).join('')}</div></div>
    <div class="field" style="margin-top:12px"><label>Notes internes</label><textarea id="eNotes">${esc(o.notes||'')}</textarea></div>
    <div class="sticky-save">
      <span class="subtle" style="margin:auto 0 auto 0">Créée le ${frDate(o.createdAt)} · modifiée le ${frDate(o.updatedAt)}</span>
      <button class="btn" onclick="refreshDrawer('synthese')">Annuler</button>
      <button class="btn primary" ${can('organismes','modifier')?'':'disabled'} onclick="saveOrg()">Enregistrer les modifications</button></div>`;
  }
  if(k==='contacts'){
    const cs=contactsOf(o.id);
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <p class="subtle" style="margin:0">Élus, direction générale et référents opérationnels. Le contact principal est le signataire du contrat.</p>
      ${can('contacts','creer')?`<button class="btn primary" onclick="openContactModal(${o.id})">+ Ajouter un contact</button>`:''}</div>
    ${cs.length?cs.map(c=>`<div class="list-row">
      <span class="avatar">${esc((c.prenom[0]||'')+(c.nom[0]||''))}</span>
      <div class="grow"><b>${esc([c.civilite,c.prenom,c.nom].filter(Boolean).join(' '))} ${c.principal?badge('Contact principal','purple'):''}${c.optout?badge('Ne pas démarcher','red'):''}</b>
        <span class="subtle">${esc(c.fonction||'Fonction non renseignée')} · ${esc(c.email||'email inconnu')} · ${esc(c.mobile||c.tel||'téléphone inconnu')}</span>
        ${c.notes?`<span class="subtle">${esc(c.notes)}</span>`:''}</div>
      <button class="btn small" onclick="openContactModal(${o.id},${c.id})">Modifier</button>
      ${canS('supprimerDefinitif')?`<button class="btn small danger" onclick="deleteContact(${c.id})">Supprimer</button>`:''}</div>`).join('')
      :`<div class="empty"><b>Aucun contact</b>Ajoutez au moins le représentant légal : il est requis pour générer un contrat.</div>`}`;
  }
  if(k==='actions'){
    const as=actionsOf(o.id),na=nextActionOf(o.id);
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <p class="subtle" style="margin:0">Historique complet des échanges. Chaque action planifiée alimente l’agenda et le tableau de bord.</p>
      ${can('actions','creer')?`<button class="btn primary" onclick="openActionModal(${o.id})">+ Enregistrer une action</button>`:''}</div>
    ${na?`<div class="notice ${isLate(na.date)?'warn':''}" style="margin:14px 0">Prochaine action : <b>${esc(na.type)}</b> le ${frDate(na.date)} — ${esc(userNom(na.userId))}${isLate(na.date)?' · en retard de '+Math.abs(dayDiff(na.date))+' jour(s)':''}</div>`:''}
    ${as.length?`<div class="timeline" style="margin-top:14px">${as.map(a=>`
      <div class="tl-item ${a.statut==='Réalisée'?'done':(isLate(a.date)?'late':'')}">
        <div class="tl-head"><b>${esc(a.type)}</b>${badge(a.statut)}${a.resultat?badge(a.resultat):''}</div>
        <div class="tl-body">${esc(a.compteRendu||'Aucun compte rendu saisi.')}</div>
        <div class="tl-date">${frDate(a.date)} · ${esc(userNom(a.userId))}${a.contactId?' · '+esc(contactLabel(a.contactId)):''}</div>
        <div style="margin-top:6px;display:flex;gap:6px">
          ${a.statut==='Planifiée'?`<button class="btn small primary" onclick="completeAction(${a.id})">Marquer réalisée</button>`:''}
          <button class="btn small" onclick="openActionModal(${o.id},null,${a.id})">Modifier</button>
          ${canS('supprimerDefinitif')?`<button class="btn small danger" onclick="deleteAction(${a.id})">Supprimer</button>`:''}</div>
      </div>`).join('')}</div>`
     :`<div class="empty"><b>Aucune action</b>Enregistrez un appel, un email ou un rendez-vous pour démarrer le suivi.</div>`}`;
  }
  if(k==='commercial'){
    const os=oppsOf(o.id),qs=quotesOf(o.id);
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      ${can('opportunites','creer')?`<button class="btn primary" onclick="openOppModal(${o.id})">+ Nouvelle opportunité</button>`:''}
      ${can('devis','creer')?`<button class="btn" onclick="openQuoteModal(null,${o.id})">+ Nouveau devis</button>`:''}</div>
    <div class="section-title">Opportunités</div>
    ${os.length?os.map(op=>`<div class="list-row"><div class="grow"><b>${esc(op.libelle)}</b>
      <span class="subtle">Clôture prévue ${frDate(op.dateCloture)} · ${esc(userNom(op.respId))} · probabilité ${stageP(op.stage)}%</span></div>
      ${badge(op.stage)}<b>${money(valeurOpp(op))}</b>
      <button class="btn small" onclick="openOppModal(${o.id},${op.id})">Modifier</button></div>`).join('')
      :`<div class="empty"><b>Aucune opportunité</b>Créez-en une dès qu’un besoin est qualifié.</div>`}
    <div class="section-title">Devis</div>
    ${qs.length?qs.map(q=>`<div class="list-row"><div class="grow"><b>${esc(q.numero)} — ${esc(q.type)}</b>
      <span class="subtle">${frDate(q.date)} · ${esc(userNom(q.respId))} · ${esc(q.config.formule)} · ${money2(q.mrrNet)} /mois + ${money(q.one)} de frais</span></div>
      ${badge(q.statut)}<b>${money(q.ht)} HT</b>
      <button class="btn small" onclick="openQuoteModal(${q.id})">Ouvrir</button></div>`).join('')
      :`<div class="empty"><b>Aucun devis</b>Le devis applique automatiquement la grille tarifaire de la strate.</div>`}`;
  }
  if(k==='client'){
    if(o.statutClient==='Non client')return `<div class="empty"><b>Pas encore cliente</b>Cet onglet s’active à la signature du premier contrat.</div>`;
    const db2=getDB(),ctr=contractOf(o.id);
    const fs=db2.invoices.filter(f=>f.orgId===o.id),forms=db2.formations.filter(f=>f.orgId===o.id);
    const tk=db2.tickets.filter(t=>t.orgId===o.id&&t.statut!=='Résolu');
    const idx=DEPLOY_STAGES.indexOf(o.deployStage||DEPLOY_STAGES[0]);
    const jours=ctr?Math.abs(dayDiff(ctr.dateSignature)):0;
    const sante=(()=>{
      let s=0;
      if(tk.some(t=>t.categorie==='Anomalie bloquante'))s+=2;
      if(fs.some(f=>f.statut==='En retard'))s+=2;
      const la=lastActionOf(o.id);if(!la||dayDiff(la.date)<-60)s+=1;
      if(o.statutClient==='Client en déploiement'&&jours>90&&idx<5)s+=2;
      if(o.statutClient==='Client actif'&&!forms.some(f=>f.statut==='Réalisée'))s+=1;
      return s>=4?['À risque','red']:s>=2?['À surveiller','amber']:['Sereine','green'];
    })();
    return `<div class="cards" style="margin-bottom:4px">
      <div class="card kpi accent"><span>Étape</span><b style="font-size:16px">${esc(o.deployStage||'—')}</b><small>${idx+1} sur ${DEPLOY_STAGES.length}</small></div>
      <div class="card kpi"><span>Depuis la signature</span><b>${jours} j</b><small>${ctr?frDate(ctr.dateSignature):'—'}</small></div>
      <div class="card kpi"><span>MRR</span><b>${money2(ctr?ctr.mrr:0)}</b><small>${money(ctr?ctr.arr:0)} d’ARR</small></div>
      <div class="card kpi ${sante[1]==='red'?'warn':(sante[1]==='green'?'ok':'')}"><span>Santé de la relation</span><b style="font-size:16px">${sante[0]}</b><small>calculée sur tickets, échéances et activité</small></div>
    </div>
    <div class="progress" style="height:8px">${''}<div class="bar" style="width:${pct(idx+1,DEPLOY_STAGES.length)}%"></div></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0">${DEPLOY_STAGES.map((st,i)=>
      `<button class="btn small ${i===idx?'primary':''}" onclick="setDeployStage(${o.id},'${st}')">${i+1}. ${esc(st)}</button>`).join('')}</div>
    <div class="section-title">Pilotage</div>
    <div class="grid">
      <div class="field"><label>Statut client</label><select id="clStat">${opts(STAT_CLIENT,undefined,o.statutClient)}</select></div>
      <div class="field"><label>Étape de déploiement</label><select id="clStage">${opts(DEPLOY_STAGES,undefined,o.deployStage||DEPLOY_STAGES[0])}</select></div>
      <div class="field"><label>Consultant déploiement</label><select id="clCs"><option value="">À affecter</option>${db2.users.map(u=>`<option value="${u.id}"${o.csId==u.id?' selected':''}>${esc(u.nom)} — ${esc(u.role)}</option>`).join('')}</select></div>
      <div class="field"><label>Formateur</label><select id="clForm"><option value="">À affecter</option>${db2.users.map(u=>`<option value="${u.id}"${o.formateurId==u.id?' selected':''}>${esc(u.nom)} — ${esc(u.role)}</option>`).join('')}</select></div>
      <div class="field"><label>Mise en production — cible</label><input id="clCible" type="date" value="${esc(o.dateMepCible||'')}"></div>
      <div class="field"><label>Mise en production — réalisée</label><input id="clReel" type="date" value="${esc(o.dateMepReelle||'')}"></div>
      <div class="field"><label>Statut du contrat</label><select id="clCtr" ${ctr?'':'disabled'}>${opts(CTR_STAT,undefined,ctr?ctr.statut:'En cours')}</select></div>
      <div class="field"><label>Point de blocage en attente du client</label><input id="clBloc" value="${esc(o.blocage||'')}" placeholder="Ex : fichier familles non transmis"></div>
    </div>
    ${o.dateMepCible&&o.dateMepReelle?`<div class="notice ${o.dateMepReelle>o.dateMepCible?'warn':'ok'}" style="margin-top:12px">Mise en production ${o.dateMepReelle>o.dateMepCible?'en retard de '+dayDiff(o.dateMepReelle,o.dateMepCible)+' jour(s)':'tenue dans les délais'} par rapport à la cible.</div>`:''}
    ${o.blocage?`<div class="notice warn" style="margin-top:12px"><b>En attente du client</b> — ${esc(o.blocage)}</div>`:''}
    <div class="sticky-save"><button class="btn" onclick="refreshDrawer('client')">Annuler</button><button class="btn primary" onclick="saveClient()">Enregistrer</button></div>
    <div class="section-title">Formations</div>
    <div style="margin-bottom:10px"><button class="btn small primary" onclick="openFormationModal(null,${o.id})">+ Planifier une formation</button></div>
    ${forms.length?forms.map(f=>`<div class="list-row"><div class="grow"><b>${esc(f.type)}</b><span class="subtle">${frDate(f.date)} · ${esc(userNom(f.formateurId))} · ${esc(f.lieu||'')}</span>${f.compteRendu?`<span class="subtle">${esc(f.compteRendu)}</span>`:''}</div>${badge(f.statut)}
      <button class="btn small" onclick="openFormationModal(${f.id})">Ouvrir</button></div>`).join('')
      :'<p class="subtle">Aucune formation planifiée.</p>'}
    <div class="section-title">Contrat et renouvellement</div>
    ${ctr?`<div class="info-grid">
      <div class="info-box"><span>Contrat</span><b>${esc(ctr.numero)}</b></div>
      <div class="info-box"><span>Formule</span><b>${esc(ctr.formule)}</b></div>
      <div class="info-box"><span>Facturation</span><b>${esc(ctr.facturation)}</b></div>
      <div class="info-box"><span>Début</span><b>${frDate(ctr.dateDebut)}</b></div>
      <div class="info-box"><span>Échéance</span><b>${ctr.dateFin?frDate(ctr.dateFin):'Sans terme'}</b></div>
      <div class="info-box"><span>Dénoncer avant le</span><b>${ctr.dateFin?frDate(shiftM(-ctr.preavisMois,ctr.dateFin)):'—'}</b></div>
     </div>
     <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
       <button class="btn small" onclick="genContratDocx(${ctr.quoteId})">Contrat Word</button>
       <button class="btn small" onclick="openQuoteModal(null,${o.id})">Devis de renouvellement</button></div>`:'<p class="subtle">Aucun contrat.</p>'}
    <div class="section-title">Facturation</div>
    ${fs.length?`<div class="info-grid" style="margin-bottom:10px">
      <div class="info-box"><span>Facturé TTC</span><b>${money(sum(fs,f=>f.ttc))}</b></div>
      <div class="info-box"><span>Encaissé</span><b>${money(sum(fs.filter(f=>f.statut==='Payée'),f=>f.ttc))}</b></div>
      <div class="info-box"><span>Reste à venir</span><b>${money(sum(fs.filter(f=>f.statut!=='Payée'),f=>f.ttc))}</b></div>
     </div>`+fs.slice(0,8).map(f=>`<div class="list-row"><div class="grow"><b>${esc(f.numero)}</b><span class="subtle">${esc(f.objet)} · échéance ${frDate(f.echeance)}</span></div>${badge(f.statut)}<b>${money2(f.ttc)}</b></div>`).join('')
      :'<p class="subtle">Aucune facture.</p>'}
    <div class="section-title">Support</div>
    ${tk.length?tk.map(t=>`<div class="list-row"><div class="grow"><b>${esc(t.sujet)}</b><span class="subtle">${esc(t.categorie)} · ouvert le ${frDate(t.date)}</span></div>${badge(t.statut)}</div>`).join('')
      :'<p class="subtle">Aucun ticket ouvert.</p>'}`;
  }
  if(k==='support'){
    const ts=getDB().tickets.filter(t=>t.orgId===o.id);
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <p class="subtle" style="margin:0">Anomalies, paramétrage et demandes d’évolution remontées par la organisme.</p>
      <button class="btn primary" onclick="openTicketModal(${o.id})">+ Nouveau ticket</button></div>
    ${ts.length?ts.map(t=>`<div class="list-row"><div class="grow"><b>${esc(t.sujet)}</b><span class="subtle">${esc(t.categorie)} · ouvert le ${frDate(t.date)} · ${esc(userNom(t.assigneId))}</span></div>${badge(t.statut)}
