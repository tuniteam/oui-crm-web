    <p class="subtle" style="margin-top:10px">Le registre des traitements, l’export des données d’une personne sur demande et les mentions d’information dans les emails de prospection relèvent de la version applicative.</p></div>`;
};
function saveConserv(){
  if(!guard('parametres','modifier'))return;
  getDB().settings.conservationMois=Number(val('dConserv'))||36;
  log('Modification','Paramètres','Conservation RGPD');commit();toast('Durée de conservation enregistrée.');
}
function purgeAnciens(){
  if(!guardS('supprimerDefinitif'))return;
  const db=getDB(),mois=db.settings.conservationMois||36;
  const cibles=db.orgs.filter(o=>{const la=lastActionOf(o.id);
    return o.statutClient==='Non client'&&la&&dayDiff(la.date)<-(mois*30)});
  if(!cibles.length){toast('Aucun prospect hors délai de conservation.');return}
  openModal('Purger '+cibles.length+' prospect(s)','Dernier contact au-delà de '+mois+' mois.',
   `<div class="notice warn">Les fiches et leurs contacts seront supprimés définitivement. L’opération est tracée dans le journal.</div>
    <div style="margin-top:12px">${cibles.slice(0,20).map(o=>`<div class="list-row"><div class="grow"><b>${esc(o.nom)}</b><span class="subtle">dernier contact ${frDate((lastActionOf(o.id)||{}).date)}</span></div></div>`).join('')}</div>`,
   `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn danger" onclick="doPurge()">Purger définitivement</button>`);
  window._purge=cibles.map(o=>o.id);
}
function doPurge(){
  const db=getDB(),ids=window._purge||[];
  db.orgs=db.orgs.filter(o=>!ids.includes(o.id));
  db.contacts=db.contacts.filter(c=>!ids.includes(c.orgId));
  db.actions=db.actions.filter(a=>!ids.includes(a.orgId));
  log('Suppression','Purge RGPD',ids.length+' prospects');
  commit();closeModal();toast(ids.length+' fiche(s) purgée(s).');RENDER.settings();
}
function exportJSON(){
  if(!guardS('exporterBase'))return;
  download('sauvegarde_ouicrm_'+todayISO()+'.json',JSON.stringify(getDB(),null,1),'application/json');
  log('Export','Sauvegarde complète',fmt(getDB().orgs.length)+' organismes');commit();toast('Sauvegarde exportée.');
}
function importJSON(input){
  if(!guardS('restaurerSauvegarde'))return;
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.orgs||!d._v)throw new Error('format');
      DB=ensureAcces(d);persist();SESSION=1;applyMenuRights();renderSessionPicker();
      toast('Sauvegarde restaurée.');navigate('dashboard');
    }catch(e){toast('Fichier illisible : ce n’est pas une sauvegarde OUI CRM.','err')}
  };
  r.readAsText(f);
}
function resetDB(){
  if(!guardS('restaurerSauvegarde'))return;
  openModal('Réinitialiser la démonstration','Toutes les données saisies dans ce navigateur seront effacées.',
  `<div class="notice warn">Exportez d’abord une sauvegarde si vous souhaitez conserver votre travail.</div>`,
  `<button class="btn" onclick="closeModal()">Annuler</button><button class="btn danger" onclick="doReset()">Réinitialiser</button>`);
}
function doReset(){localStorage.removeItem(KEY);DB=null;ensureAcces(getDB());SESSION=1;closeModal();
  applyMenuRights();renderSessionPicker();toast('Données réinitialisées.');navigate('dashboard')}
</script>
<script>
/* =====================================================================
   Tableau de bord analytique et agenda calendaire
   ===================================================================== */

const MOTIFS_PERTE=['Prix trop élevé','Concurrent retenu','Budget non voté','Projet reporté','Pas de besoin','Sans réponse','Marché public perdu','Autre'];

/* ---------- Primitives graphiques (SVG) ---------- */
function svgBars(items,o){
  o=o||{};
  const w=720,h=o.height||190,padL=42,padB=30,padT=14;
  const max=Math.max(1,...items.map(i=>i.v),...(o.v2?items.map(i=>i.v2):[0]));
  const bw=(w-padL-10)/items.length;
  const y=v=>padT+(h-padT-padB)*(1-v/max);
  const fmtv=o.money?money:fmt;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img">
    ${[0,.5,1].map(f=>`<line x1="${padL}" x2="${w-4}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#eef0f7"/>
      <text x="${padL-6}" y="${y(max*f)+4}" text-anchor="end" font-size="9.5" fill="#79809a">${fmtv(max*f)}</text>`).join('')}
    ${items.map((i,k)=>{
      const x=padL+k*bw,bh=Math.max(0,(h-padT-padB)-(y(i.v)-padT));
      return `<g><rect x="${x+bw*0.18}" y="${y(i.v)}" width="${bw*0.64}" height="${bh}" rx="3" fill="${i.hl?'var(--brand)':'#b9aef5'}"></rect>
        ${i.v?`<text x="${x+bw/2}" y="${y(i.v)-4}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3d4356">${fmtv(i.v)}</text>`:''}
        <text x="${x+bw/2}" y="${h-10}" text-anchor="middle" font-size="9.5" fill="#79809a">${esc(i.l)}</text></g>`}).join('')}
  </svg>`;
}
function svgLine(series,labels,o){
  o=o||{};
  const w=720,h=o.height||200,padL=54,padB=28,padT=14;
  const all=series.flatMap(s=>s.pts);
  const max=Math.max(1,...all);
  const x=k=>padL+(w-padL-10)*(labels.length>1?k/(labels.length-1):0);
  const y=v=>padT+(h-padT-padB)*(1-v/max);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img">
    ${[0,.5,1].map(f=>`<line x1="${padL}" x2="${w-4}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#eef0f7"/>
      <text x="${padL-6}" y="${y(max*f)+4}" text-anchor="end" font-size="9.5" fill="#79809a">${money(max*f)}</text>`).join('')}
    ${series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2.2" stroke-dasharray="${s.dash||''}"
      points="${s.pts.map((v,k)=>x(k)+','+y(v)).join(' ')}"/>
      ${s.dash?'':s.pts.map((v,k)=>`<circle cx="${x(k)}" cy="${y(v)}" r="3" fill="${s.color}"/>`).join('')}`).join('')}
    ${labels.map((l,k)=>`<text x="${x(k)}" y="${h-9}" text-anchor="middle" font-size="9.5" fill="#79809a">${esc(l)}</text>`).join('')}
  </svg>
  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px">
    ${series.map(s=>`<span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:3px;background:${s.color};display:inline-block;border-radius:2px;${s.dash?'opacity:.55':''}"></span>${esc(s.nom)}</span>`).join('')}
  </div>`;
}
function svgFunnel(steps){
  const w=720,h=40*steps.length+16,max=Math.max(1,steps[0].v);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" role="img">
    ${steps.map((s,i)=>{
      const bw=(w-190)*Math.max(s.v/max,0.02),y=i*40+8;
      const prev=i?steps[i-1].v:null;
      const taux=prev!==null?(prev>0?Math.round(s.v/prev*100):0):null;
      return `<g>
        <text x="0" y="${y+20}" font-size="11.5" font-weight="650" fill="#3d4356">${esc(s.l)}</text>
        <rect x="150" y="${y+4}" width="${bw}" height="24" rx="5" fill="${['#5a45d6','#6f5cdd','#8574e4','#9b8ceb','#b1a4f2'][i]||'#c7bdf8'}"/>
        <text x="${150+bw+8}" y="${y+21}" font-size="11.5" font-weight="700" fill="#12141d">${fmt(s.v)}</text>
        ${taux!==null?`<text x="${w-4}" y="${y+21}" text-anchor="end" font-size="11" fill="${taux<20?'#c0392f':'#79809a'}">${taux} % depuis l’étape précédente</text>`:''}
      </g>`}).join('')}
  </svg>`;
}
function ratio(lbl,val,sub,alerte){
  return `<div class="info-box"><span>${esc(lbl)}</span><b class="${alerte?'miss':''}">${esc(val)}</b>${sub?`<span class="subtle" style="margin-top:3px">${esc(sub)}</span>`:''}</div>`;
}

/* ---------- Séries temporelles ---------- */
function moisSerie(n){
  const out=[],d=today();d.setDate(1);
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);
    out.push({k:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),
      l:x.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''),annee:x.getFullYear(),mois:x.getMonth()})}
  return out;
}
const moisDe=d=>String(d||'').slice(0,7);
function bornesPeriode(p){
  const t=today();
  if(p==='mois')return [iso(new Date(t.getFullYear(),t.getMonth(),1)),todayISO()];
  if(p==='trim'){const q=Math.floor(t.getMonth()/3)*3;return [iso(new Date(t.getFullYear(),q,1)),todayISO()]}
  if(p==='annee')return [t.getFullYear()+'-01-01',todayISO()];
  return [shiftM(-12),todayISO()];
}
const entre=(d,a,b)=>d&&d>=a&&d<=b;

/* ---------- Données du tableau de bord, filtrées par portée ---------- */
let DASH={scope:'moi',periode:'mois'};
function dashData(){
  const db=getDB(),tout=canS('voirMontantsAutres');
  const sc=tout?DASH.scope:'moi';
  const uid=sc==='moi'?SESSION:(sc==='equipe'?null:Number(sc));
  const parUser=u=>uid===null||u===uid;
  const orgOk=o=>o&&complet(o);
  const actions=db.actions.filter(a=>parUser(a.userId)&&orgOk(org(a.orgId)));
  const opps=db.opps.filter(o=>parUser(o.respId)&&orgOk(org(o.orgId)));
  const quotes=db.quotes.filter(q=>parUser(q.respId)&&orgOk(org(q.orgId)));
  const orgs=db.orgs.filter(o=>complet(o)&&(uid===null||o.commercialId===uid));
  return {uid,sc,tout,actions,opps,quotes,orgs,
    contrats:db.contracts.filter(c=>{const q=db.quotes.find(x=>x.id===c.quoteId);return q&&parUser(q.respId)&&orgOk(org(c.orgId))})};
}
/* Une démonstration est comptée au franchissement de l'étape par l'opportunité. */
function demosParMois(opps){
  const m={};
  opps.forEach(o=>(o.historique||[]).forEach(h=>{
    if(['Démonstration','Devis envoyé','Négociation','Accord oral','Gagnée'].includes(h.stage)){
      const dejaComptee=(o.historique||[]).some(x=>x.stage==='Démonstration');
      if(h.stage==='Démonstration'||(!dejaComptee&&h.stage==='Devis envoyé'))
        m[moisDe(h.date)]=(m[moisDe(h.date)]||0)+1;
    }}));
  return m;
}
function premiereActionParOrg(actions){
  const m={};
  actions.filter(a=>a.statut==='Réalisée').forEach(a=>{
    if(!m[a.orgId]||a.date<m[a.orgId])m[a.orgId]=a.date});
  return m;
}

RENDER.dashboard=function(){
  const db=getDB(),s=db.settings,D=dashData();
  const [a0,a1]=bornesPeriode(DASH.periode);
  const M=moisSerie(12),moisCourant=moisDe(todayISO()),moisPrec=M[M.length-2].k;
  const cptMois=(arr,f)=>{const m={};arr.forEach(x=>{const d=f(x);if(d)m[moisDe(d)]=(m[moisDe(d)]||0)+1});return m};
  const somMois=(arr,f,v)=>{const m={};arr.forEach(x=>{const d=f(x);if(d)m[moisDe(d)]=(m[moisDe(d)]||0)+v(x)});return m};

  const faites=D.actions.filter(a=>a.statut==='Réalisée');
  const appels=cptMois(faites.filter(a=>a.type==='Appel'),a=>a.date);
  const mails=cptMois(faites.filter(a=>['Email','Relance','Courrier'].includes(a.type)),a=>a.date);
  const demos=demosParMois(D.opps);
  const devisCrees=cptMois(D.quotes,q=>q.date);
  const devisMontant=somMois(D.quotes,q=>q.date,q=>q.ht);
  const signes=cptMois(D.quotes.filter(q=>q.statut==='Signé'),q=>q.dateSignature||q.date);
  const caMois=somMois(D.quotes.filter(q=>q.statut==='Signé'),q=>q.dateSignature||q.date,q=>q.ht);
  const prem=premiereActionParOrg(D.actions);
  const nouveaux={};Object.values(prem).forEach(d=>nouveaux[moisDe(d)]=(nouveaux[moisDe(d)]||0)+1);
  const oppsCreees=cptMois(D.opps,o=>o.createdAt);
  const serie=m=>M.map(x=>({l:x.l,v:m[x.k]||0,hl:x.k===moisCourant}));

  /* KPI de la période */
  const P={
    appels:faites.filter(a=>a.type==='Appel'&&entre(a.date,a0,a1)).length,
    mails:faites.filter(a=>['Email','Relance','Courrier'].includes(a.type)&&entre(a.date,a0,a1)).length,
    demos:D.opps.reduce((n,o)=>n+((o.historique||[]).some(h=>h.stage==='Démonstration'&&entre(h.date,a0,a1))?1:0),0),
    rdv:D.actions.filter(a=>a.statut==='Planifiée'&&['RDV physique','Démonstration','Visioconférence'].includes(a.type)).length,
    devis:D.quotes.filter(q=>entre(q.date,a0,a1)),
    signes:D.quotes.filter(q=>q.statut==='Signé'&&entre(q.dateSignature||q.date,a0,a1))
  };
  const demosMoisCourant=demos[moisCourant]||0,demosMoisPrec=demos[moisPrec]||0;
  const evol=demosMoisPrec?Math.round((demosMoisCourant-demosMoisPrec)/demosMoisPrec*100):null;

  /* Tunnel */
  const aboutis=faites.filter(a=>a.resultat&&!['Sans réponse','Mauvais interlocuteur'].includes(a.resultat)).length;
  const totDemos=Object.values(demos).reduce((a,b)=>a+b,0);
  const envoyes=D.quotes.filter(q=>['Envoyé','Relancé','En négociation','Signé','Refusé','Expiré'].includes(q.statut)).length;
  const totSignes=D.quotes.filter(q=>q.statut==='Signé').length;
  const tunnel=[{l:'Appels passés',v:faites.filter(a=>a.type==='Appel').length},{l:'Contacts aboutis',v:aboutis},
    {l:'Démonstrations',v:totDemos},{l:'Devis envoyés',v:envoyes},{l:'Devis signés',v:totSignes}];

  /* Ratios */
  const nbAppels=tunnel[0].v;
  const perdus=D.opps.filter(o=>o.stage==='Perdue'),gagnes=D.opps.filter(o=>o.stage==='Gagnée');
  const closes=perdus.length+gagnes.length;
  const delais=D.quotes.filter(q=>q.statut==='Signé').map(q=>{
    const p=Object.entries(prem).find(([k])=>Number(k)===q.orgId);
    return p?dayDiff(q.dateSignature||q.date,p[1]):null}).filter(x=>x!==null&&x>=0);
  const delaiSign=delais.length?Math.round(delais.reduce((a,b)=>a+b,0)/delais.length):null;
  const reponses=D.quotes.filter(q=>q.statut==='Signé'&&q.dateSignature).map(q=>dayDiff(q.dateSignature,q.date)).filter(x=>x>=0);
  const delaiRep=reponses.length?Math.round(reponses.reduce((a,b)=>a+b,0)/reponses.length):null;
  const couverts=D.orgs.filter(o=>{const la=lastActionOf(o.id);return la&&dayDiff(la.date)>=-90}).length;
  const caTotalSigne=sum(D.quotes.filter(q=>q.statut==='Signé'),q=>q.ht);
  const caEnvoye=sum(D.quotes.filter(q=>['Envoyé','Relancé','En négociation','Signé','Refusé','Expiré'].includes(q.statut)),q=>q.ht);

  /* Objectif : cumul vs trajectoire */
  const an=new Date().getFullYear(),moisAn=M.filter(x=>x.annee===an);
  let cum=0;const cumule=moisAn.map(x=>{cum+=caMois[x.k]||0;return cum});
  const cible=moisAn.map((x,i)=>Math.round(s.objectifCA*(i+1)/12));
  const caAnnee=cum,reste=Math.max(0,s.objectifCA-caAnnee);
  const enCours=D.opps.filter(o=>!['Gagnée','Perdue'].includes(o.stage));
  const pondere=sum(enCours,o=>valeurOpp(o)*stageP(o.stage)/100);

  /* Répartitions */
  const parFormule=PRICING.formules.map(f=>[f,sum(D.quotes.filter(q=>q.statut==='Signé'&&q.config.formule===f),q=>q.ht)]);
  const parConcurrent={};D.quotes.filter(q=>q.statut==='Signé').forEach(q=>{
    const o=org(q.orgId);if(!o)return;const e=editeurDe(o.solution);
    const k=e==='—'?'Sans logiciel / tableur':e;parConcurrent[k]=(parConcurrent[k]||0)+1});
  const parStrateCA=STRATES.map(st=>[st,sum(D.quotes.filter(q=>{const o=org(q.orgId);return q.statut==='Signé'&&o&&strate(o.population)===st}),q=>q.ht)]);
  const motifs={};perdus.forEach(o=>{const m=o.motifPerte||'Non renseigné';motifs[m]=(motifs[m]||0)+1});
  const bars=(rows,fm)=>{const mx=Math.max(1,...rows.map(r=>r[1]));
    return rows.filter(r=>r[1]).map(([l,v])=>`<div class="bar-row"><div class="lbl" title="${esc(l)}">${esc(l)}</div><div class="track"><div class="fill" style="width:${Math.max(v/mx*100,2)}%"></div></div><div class="val">${fm?fm(v):v}</div></div>`).join('')||'<p class="subtle">Aucune donnée sur la période.</p>'};

  /* Listes à traiter */
  const topOpps=enCours.filter(o=>o.dateCloture&&dayDiff(o.dateCloture)<=45).sort((a,b)=>valeurOpp(b)-valeurOpp(a)).slice(0,5);
  const sommeil=enCours.filter(o=>{const la=lastActionOf(o.orgId);return !la||dayDiff(la.date)<-45}).slice(0,6);
  const sansReponse=D.quotes.filter(q=>['Envoyé','Relancé'].includes(q.statut)&&dayDiff(q.date)<-15)
    .sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  const late=D.actions.filter(a=>a.statut==='Planifiée'&&dayDiff(a.date)<0);
  const aValider=canS('validerDevis')?db.quotes.filter(q=>q.statut==='À valider'):[];
  const perLbl={mois:'ce mois-ci',trim:'ce trimestre',annee:'cette année',['12m']:'sur 12 mois'}[DASH.periode];

  document.getElementById('page-dashboard').innerHTML=
  pageHead('Tableau de bord','Récapitulatif de l’activité commerciale : volumes, conversion, ratios et objectif.',
   `<button class="btn" onclick="navigate('agenda')">Agenda</button><button class="btn primary" onclick="openActionModal()">+ Action</button>`)
  +`<div class="filters">
     ${D.tout?`<select class="control" onchange="DASH.scope=this.value;RENDER.dashboard()">
       <option value="moi"${DASH.scope==='moi'?' selected':''}>Mon activité</option>
       <option value="equipe"${DASH.scope==='equipe'?' selected':''}>Toute l’équipe</option>
       ${db.users.filter(u=>u.actif&&u.id!==SESSION).map(u=>`<option value="${u.id}"${DASH.scope==String(u.id)?' selected':''}>${esc(u.nom)}</option>`).join('')}
     </select>`:`<span class="tag purple">Votre activité personnelle</span>`}
     <div class="seg">${[['mois','Mois en cours'],['trim','Trimestre'],['annee','Année'],['12m','12 mois glissants']].map(([k,l])=>
       `<button class="${DASH.periode===k?'active':''}" onclick="DASH.periode='${k}';RENDER.dashboard()">${l}</button>`).join('')}</div>
   </div>`
  +(aValider.length?`<div class="notice warn" style="margin-bottom:14px"><b>${aValider.length} devis en attente de validation</b> — remise au-delà de ${s.remiseMax} %. <button class="btn small" onclick="navigate('devis')">Les ouvrir</button></div>`:'')
  +`<div class="cards">
    <div class="card kpi accent"><span>Appels ${esc(perLbl)}</span><b>${P.appels}</b><small>${P.mails} emails et relances</small></div>
    <div class="card kpi"><span>Démonstrations</span><b>${demosMoisCourant}</b><small>${demosMoisPrec} le mois précédent${evol===null?'':' · '+(evol>=0?'+':'')+evol+' %'}</small></div>
    <div class="card kpi"><span>Devis réalisés</span><b>${P.devis.length}</b><small>${money(sum(P.devis,q=>q.ht))} chiffrés</small></div>
    <div class="card kpi"><span>RDV et démos planifiés</span><b>${P.rdv}</b><small>à venir dans l’agenda</small></div>
    <div class="card kpi ok"><span>Devis signés</span><b>${P.signes.length}</b><small>${money(sum(P.signes,q=>q.ht))} de CA</small></div>
    <div class="card kpi ${late.length?'warn':''}"><span>Actions en retard</span><b>${late.length}</b><small>${late.length?'à traiter en priorité':'rien en retard'}</small></div>
  </div>

  <div class="section-title">Volumes d’activité — 12 derniers mois</div>
  <div class="cols2">
    <div class="panel panel-pad"><h3>Appels passés</h3>${svgBars(serie(appels))}</div>
    <div class="panel panel-pad"><h3>Emails et relances</h3>${svgBars(serie(mails))}</div>
  </div>
  <div class="cols2" style="margin-top:14px">
    <div class="panel panel-pad"><h3>Démonstrations réalisées</h3>${svgBars(serie(demos))}</div>
    <div class="panel panel-pad"><h3>Organismes nouvellement travaillés</h3>
      <p class="subtle" style="margin:-6px 0 10px">Premier contact abouti dans le mois — la mesure de l’alimentation du haut du tunnel.</p>
      ${svgBars(serie(nouveaux))}</div>
  </div>
  <div class="cols2" style="margin-top:14px">
    <div class="panel panel-pad"><h3>Devis réalisés</h3>${svgBars(serie(devisCrees))}
      <div class="section-title">Montant chiffré</div>${svgBars(serie(devisMontant),{money:true,height:150})}</div>
    <div class="panel panel-pad"><h3>Devis signés</h3>${svgBars(serie(signes))}
      <div class="section-title">CA signé</div>${svgBars(serie(caMois),{money:true,height:150})}</div>
  </div>
  <div class="cols2" style="margin-top:14px">
    <div class="panel panel-pad"><h3>Nouvelles opportunités créées</h3>${svgBars(serie(oppsCreees))}</div>
    <div class="panel panel-pad"><h3>Objectif annuel ${an}</h3>
      ${svgLine([{nom:'CA signé cumulé',pts:cumule,color:'var(--brand)'},{nom:'Trajectoire théorique',pts:cible,color:'#9aa1b8',dash:'5 4'}],moisAn.map(x=>x.l))}
      <div class="info-grid" style="margin-top:12px">
        ${ratio('CA signé',money(caAnnee),pct(caAnnee,s.objectifCA)+' % de l’objectif')}
        ${ratio('Reste à faire',money(reste),reste?'d’ici la fin de l’année':'objectif atteint',reste>0)}
        ${ratio('Pipeline pondéré',money(pondere),reste&&pondere<reste?'insuffisant pour couvrir le reste':'suffisant pour couvrir le reste',reste>0&&pondere<reste)}
      </div></div>
  </div>

  <div class="section-title">Tunnel de conversion</div>
  <div class="panel panel-pad">
    <p class="subtle" style="margin:0 0 12px">Où ça bloque : un taux faible entre deux étages désigne précisément l’endroit à travailler.</p>
    ${svgFunnel(tunnel)}
  </div>

  <div class="section-title">Ratios de pilotage</div>
  <div class="panel panel-pad"><div class="info-grid">
    ${ratio('Appels par démo obtenue',totDemos?(nbAppels/totDemos).toFixed(1):'—','effort de prospection')}
    ${ratio('Démos par devis envoyé',envoyes?(totDemos/envoyes).toFixed(1):'—','qualité de la qualification')}
    ${ratio('Transformation devis → signé',envoyes?pct(totSignes,envoyes)+' %':'—','en nombre')}
    ${ratio('Transformation en montant',caEnvoye?pct(caTotalSigne,caEnvoye)+' %':'—','CA signé sur CA proposé')}
    ${ratio('Panier moyen signé',totSignes?money(caTotalSigne/totSignes):'—','1re année HT')}
    ${ratio('Délai premier contact → signature',delaiSign===null?'—':delaiSign+' j','moyenne sur les affaires gagnées')}
    ${ratio('Délai devis → réponse',delaiRep===null?'—':delaiRep+' j','moyenne sur les devis signés')}
    ${ratio('Couverture du portefeuille',D.orgs.length?pct(couverts,D.orgs.length)+' %':'—',couverts+' fiches sur '+D.orgs.length+' travaillées à 90 jours',D.orgs.length&&pct(couverts,D.orgs.length)<60)}
    ${ratio('Taux de perte',closes?pct(perdus.length,closes)+' %':'—',perdus.length+' perdues sur '+closes+' closes')}
  </div></div>

  <div class="section-title">Répartitions</div>
  <div class="cols3">
    <div class="panel panel-pad"><h3>CA signé par formule</h3>${bars(parFormule,money)}</div>
    <div class="panel panel-pad"><h3>Solutions délogées</h3>
      <p class="subtle" style="margin:-6px 0 10px">Quel éditeur vous battez le plus souvent.</p>
      ${bars(Object.entries(parConcurrent).sort((a,b)=>b[1]-a[1]))}</div>
    <div class="panel panel-pad"><h3>Motifs de perte</h3>${bars(Object.entries(motifs).sort((a,b)=>b[1]-a[1]))}</div>
  </div>
  <div class="panel panel-pad" style="margin-top:14px"><h3>CA signé par strate de population</h3>${bars(parStrateCA,money)}</div>

  <div class="section-title">À traiter</div>
  <div class="cols3">
    <div class="panel panel-pad"><h3>Opportunités à fort enjeu</h3>
      <p class="subtle" style="margin:-6px 0 10px">Clôture prévue sous 45 jours.</p>
      ${topOpps.length?topOpps.map(o=>`<div class="list-row" style="cursor:pointer" onclick="openDrawer(${o.orgId},'commercial')">
        <div class="grow"><b>${esc(orgNom(o.orgId))}</b><span class="subtle">${esc(o.stage)} · clôture ${frDate(o.dateCloture)}</span></div>
        <b>${money(valeurOpp(o))}</b></div>`).join(''):'<p class="subtle">Aucune échéance proche.</p>'}</div>
    <div class="panel panel-pad"><h3>Prospects en sommeil</h3>
      <p class="subtle" style="margin:-6px 0 10px">Opportunité ouverte, aucune action depuis 45 jours.</p>
      ${sommeil.length?sommeil.map(o=>{const la=lastActionOf(o.orgId);
        return `<div class="list-row" style="cursor:pointer" onclick="openDrawer(${o.orgId},'actions')">
        <div class="grow"><b>${esc(orgNom(o.orgId))}</b><span class="subtle">${la?'dernière action '+frDate(la.date):'jamais travaillée'}</span></div>
        ${badge(o.stage)}</div>`}).join(''):'<p class="subtle">Aucun prospect abandonné.</p>'}</div>
    <div class="panel panel-pad"><h3>Devis sans réponse</h3>
      <p class="subtle" style="margin:-6px 0 10px">Envoyés depuis plus de 15 jours.</p>
      ${sansReponse.length?sansReponse.map(q=>`<div class="list-row" style="cursor:pointer" onclick="openQuoteModal(${q.id})">
        <div class="grow"><b>${esc(orgNom(q.orgId))}</b><span class="subtle">${esc(q.numero)} · ${Math.abs(dayDiff(q.date))} jours</span></div>
        <b>${money(q.ht)}</b></div>`).join(''):'<p class="subtle">Aucun devis en attente.</p>'}</div>
  </div>`;
};

/* =====================================================================
   Agenda — vue liste et vue calendrier
   ===================================================================== */
let AG={vue:'liste',scope:'ouvertes',user:'',type:'',curseur:todayISO(),
  filtres:{actions:true,formations:true,renouvellements:true,validites:true}};
const EXPORTABLE=['RDV physique','Démonstration'];

/* Tous les évènements du calendrier, toutes natures confondues. */
function evenements(){
  const db=getDB(),ev=[];
  if(AG.filtres.actions)db.actions.filter(a=>{const o=org(a.orgId);return o&&complet(o)&&(!AG.user||a.userId==AG.user)&&(!AG.type||a.type===AG.type)})
    .forEach(a=>ev.push({nature:'action',id:a.id,date:a.date,heure:a.heure||'',duree:a.duree||30,
      titre:a.type+' — '+orgNom(a.orgId),orgId:a.orgId,statut:a.statut,type:a.type,
      couleur:a.statut==='Réalisée'?'#0f7040':(isLate(a.date)?'#c0392f':'#5a45d6'),
      exportable:EXPORTABLE.includes(a.type)&&a.statut==='Planifiée'}));
  if(AG.filtres.formations)db.formations.filter(f=>{const o=org(f.orgId);return o&&complet(o)&&(!AG.user||f.formateurId==AG.user)})
    .forEach(f=>ev.push({nature:'formation',id:f.id,date:f.date,heure:f.heure||'',duree:f.duree||210,
      titre:f.type+' — '+orgNom(f.orgId),orgId:f.orgId,statut:f.statut,couleur:'#0f6699'}));
  if(AG.filtres.renouvellements)scopeContrats(db.contracts).filter(c=>c.dateFin&&c.statut==='En cours')
    .forEach(c=>ev.push({nature:'renouvellement',id:c.id,date:c.dateFin,heure:'',duree:0,
      titre:'Échéance contrat — '+orgNom(c.orgId),orgId:c.orgId,couleur:'#96590a'}));
  if(AG.filtres.validites)scopeQuotes(db.quotes).filter(q=>['Envoyé','Relancé','En négociation'].includes(q.statut))
    .forEach(q=>ev.push({nature:'validite',id:q.id,date:q.validite,heure:'',duree:0,
      titre:'Fin de validité — '+q.numero+' · '+orgNom(q.orgId),orgId:q.orgId,couleur:'#8a63d2'}));
  return ev.sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure));
}
const NATURES=[['actions','Actions commerciales','#5a45d6'],['formations','Formations','#0f6699'],
  ['renouvellements','Échéances de contrat','#96590a'],['validites','Validité des devis','#8a63d2']];

RENDER.agenda=function(){
  const db=getDB();
  document.getElementById('page-agenda').innerHTML=
  pageHead('Agenda','Actions, formations, échéances de contrat et fins de validité des devis dans une seule vue.',
   `${can('actions','creer')?'<button class="btn primary" onclick="openActionModal()">+ Enregistrer une action</button>':''}`)
  +`<div class="filters">
     <div class="seg">${[['liste','Liste'],['mois','Mois'],['semaine','Semaine'],['jour','Jour']].map(([k,l])=>
       `<button class="${AG.vue===k?'active':''}" onclick="AG.vue='${k}';RENDER.agenda()">${l}</button>`).join('')}</div>
     <select class="control" onchange="AG.user=this.value;RENDER.agenda()">
       <option value="">Tous les collaborateurs</option>${db.users.map(u=>`<option value="${u.id}"${AG.user==u.id?' selected':''}>${esc(u.nom)}</option>`).join('')}</select>
     <select class="control" onchange="AG.type=this.value;RENDER.agenda()">${opts(ACTION_TYPES,'Tous les types',AG.type)}</select>
     ${AG.vue==='liste'?`<div class="seg">${[['ouvertes','À faire'],['retard','En retard'],['faites','Historique'],['toutes','Tout']].map(([k,l])=>
       `<button class="${AG.scope===k?'active':''}" onclick="AG.scope='${k}';RENDER.agenda()">${l}</button>`).join('')}</div>`:''}
   </div>
   ${AG.vue!=='liste'?`<div class="filters" style="margin-top:-6px">
     ${NATURES.map(([k,l,c])=>`<label class="check ${AG.filtres[k]?'on':''}" style="padding:6px 10px">
       <input type="checkbox" ${AG.filtres[k]?'checked':''} onchange="AG.filtres['${k}']=this.checked;RENDER.agenda()">
       <span class="dotm" style="color:${c}"></span>${esc(l)}</label>`).join('')}
   </div>`:''}
   <div id="agBody"></div>`;
  document.getElementById('agBody').innerHTML=AG.vue==='liste'?agendaListe():agendaCalendrier();
};
function agendaNav(titre,pas){
  return `<div class="panel-pad" style="display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);flex-wrap:wrap">
    <div style="display:flex;gap:7px;align-items:center">
      <button class="btn small" onclick="agShift(-${pas})">‹</button>
      <button class="btn small" onclick="AG.curseur=todayISO();RENDER.agenda()">Aujourd’hui</button>
      <button class="btn small" onclick="agShift(${pas})">›</button>
    </div>
    <h3 style="text-transform:capitalize">${esc(titre)}</h3>
    <span class="subtle" style="margin:0">Cliquez sur un évènement pour ouvrir la fiche</span></div>`;
}
function agShift(n){AG.curseur=shift(n,AG.curseur);RENDER.agenda()}
function agShiftM(n){AG.curseur=shiftM(n,AG.curseur);RENDER.agenda()}

function agendaCalendrier(){
  const ev=evenements(),cur=new Date(AG.curseur);
  const parJour={};ev.forEach(e=>(parJour[e.date]=parJour[e.date]||[]).push(e));
  const pastille=e=>`<div class="ag-ev" style="border-left-color:${e.couleur}" onclick="event.stopPropagation();openEvenement('${e.nature}',${e.id})">
    ${e.heure?`<b>${esc(e.heure)}</b> `:''}${esc(e.titre)}</div>`;

  if(AG.vue==='mois'){
    const y=cur.getFullYear(),m=cur.getMonth();
    const premier=new Date(y,m,1),decal=(premier.getDay()+6)%7;
    const nb=new Date(y,m+1,0).getDate();
    const cells=[];
    for(let i=0;i<decal;i++)cells.push(null);
    for(let d=1;d<=nb;d++)cells.push(iso(new Date(y,m,d)));
    while(cells.length%7)cells.push(null);
    return `<div class="panel">${agendaNav(cur.toLocaleDateString('fr-FR',{month:'long',year:'numeric'}),0).replace('agShift(-0)','agShiftM(-1)').replace('agShift(0)','agShiftM(1)')}
      <div class="cal-grid head">${['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'].map(j=>`<div class="cal-h">${j}</div>`).join('')}</div>
      <div class="cal-grid">${cells.map(d=>{
        if(!d)return '<div class="cal-c vide"></div>';
        const l=(parJour[d]||[]);
        return `<div class="cal-c ${d===todayISO()?'today':''}" onclick="AG.vue='jour';AG.curseur='${d}';RENDER.agenda()">
          <div class="cal-n">${Number(d.slice(8))}</div>
          ${l.slice(0,4).map(pastille).join('')}
          ${l.length>4?`<div class="subtle" style="margin:2px 0 0 2px">+${l.length-4} autre(s)</div>`:''}</div>`}).join('')}</div></div>`;
  }
  if(AG.vue==='semaine'){
    const lundi=new Date(cur);lundi.setDate(cur.getDate()-((cur.getDay()+6)%7));
    const jours=[...Array(7)].map((_,i)=>iso(new Date(lundi.getFullYear(),lundi.getMonth(),lundi.getDate()+i)));
    return `<div class="panel">${agendaNav('semaine du '+frDate(jours[0])+' au '+frDate(jours[6]),7)}
      <div class="cal-grid head">${jours.map(d=>`<div class="cal-h">${new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}</div>`).join('')}</div>
      <div class="cal-grid">${jours.map(d=>{
        const l=parJour[d]||[];
        return `<div class="cal-c semaine ${d===todayISO()?'today':''}">
          ${l.length?l.map(pastille).join(''):'<span class="subtle" style="margin:0">—</span>'}</div>`}).join('')}</div></div>`;
  }
  const l=(parJour[AG.curseur]||[]);
  return `<div class="panel">${agendaNav(new Date(AG.curseur).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),1)}
    <div class="panel-pad">${l.length?l.map(e=>`<div class="list-row">
      <span class="dotm" style="color:${e.couleur};width:9px;height:9px"></span>
      <div class="grow"><b>${esc(e.titre)}</b>
        <span class="subtle">${e.heure?e.heure+(e.duree?' · '+e.duree+' min':''):'Sans horaire'} · ${esc({action:'Action commerciale',formation:'Formation',renouvellement:'Échéance de contrat',validite:'Validité de devis'}[e.nature])}${e.statut?' · '+esc(e.statut):''}</span></div>
      ${e.exportable?`<button class="btn small" onclick="exportICS(${e.id})">Outlook</button>`:''}
      <button class="btn small" onclick="openEvenement('${e.nature}',${e.id})">Ouvrir</button></div>`).join('')
      :'<div class="empty"><b>Journée libre</b>Aucun évènement à cette date.</div>'}</div></div>`;
}
function openEvenement(nature,id){
  if(nature==='action'){const a=getDB().actions.find(x=>x.id===id);if(a)openDrawer(a.orgId,'actions')}
  else if(nature==='formation')openFormationModal(id);
  else if(nature==='renouvellement'){const c=getDB().contracts.find(x=>x.id===id);if(c)openDrawer(c.orgId,'client')}
  else if(nature==='validite')openQuoteModal(id);
}
function agendaListe(){
  const db=getDB();
  let list=db.actions.filter(a=>{const o=org(a.orgId);return o&&complet(o)});
  if(AG.scope==='ouvertes')list=list.filter(a=>a.statut==='Planifiée');
  if(AG.scope==='retard')list=list.filter(a=>a.statut==='Planifiée'&&dayDiff(a.date)<0);
  if(AG.scope==='faites')list=list.filter(a=>a.statut==='Réalisée');
  if(AG.user)list=list.filter(a=>a.userId==AG.user);
  if(AG.type)list=list.filter(a=>a.type===AG.type);
  list.sort((a,b)=>AG.scope==='faites'?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
  const groups={};
  list.forEach(a=>{
    const d=dayDiff(a.date);
    const k=a.statut==='Réalisée'?'Historique':d<0?'En retard':d===0?'Aujourd’hui':d<=7?'Cette semaine':d<=30?'Ce mois-ci':'Plus tard';
    (groups[k]=groups[k]||[]).push(a)});
  const order=['En retard','Aujourd’hui','Cette semaine','Ce mois-ci','Plus tard','Historique'];
  if(!list.length)return `<div class="panel"><div class="empty"><b>Rien à afficher</b>Aucune action ne correspond à ce filtre.</div></div>`;
  return order.filter(k=>groups[k]).map(k=>`
    <div class="section-title">${k} <span class="tag ${k==='En retard'?'red':''}">${groups[k].length}</span></div>
    <div class="panel"><div class="table-wrap"><table class="table"><tbody>
    ${groups[k].map(a=>{const o=org(a.orgId),c=db.contacts.find(x=>x.id===a.contactId);
      return `<tr class="clickable" onclick="openDrawer(${a.orgId},'actions')">
        <td style="width:110px">${badge(frShort(a.date)+(a.heure?' '+a.heure:''),k==='En retard'?'red':'')}</td>
        <td style="width:130px">${badge(a.type)}</td>
        <td><span class="row-title">${esc(o?o.nom:'—')}</span><span class="subtle">${esc(a.compteRendu||'—')}</span></td>
        <td style="width:150px">${esc(c?c.prenom+' '+c.nom:'—')}<span class="subtle">${esc(userNom(a.userId))}</span></td>
        <td style="width:120px">${a.resultat?badge(a.resultat):''}</td>
        <td style="width:215px;text-align:right" onclick="event.stopPropagation()">
          ${EXPORTABLE.includes(a.type)&&a.statut==='Planifiée'?`<button class="btn small" onclick="exportICS(${a.id})">Outlook</button> `:''}
          ${a.statut==='Planifiée'?`<button class="btn small primary" onclick="completeAction(${a.id})">Réalisée</button>`:badge('Réalisée')}</td>
      </tr>`}).join('')}
    </tbody></table></div></div>`).join('');
}
</script>
<script>
document.querySelectorAll('.nav[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
ensureAcces(getDB());
(function(){const p=getDB().settings.pricing;if(p){
  if(p.strates)PRICING.strates=p.strates.map(s=>({label:s.label,min:s.min,max:(s.max===null||s.max===undefined)?Infinity:s.max}));
  if(p.formules)PRICING.formules=p.formules;
  if(p.abonnement)PRICING.abonnement=p.abonnement;
  if(p.options)PRICING.options=p.options.map((o,i)=>({id:o.id===undefined?i:o.id,nom:o.nom,pu:o.pu,inclus:o.inclus}));
  if(p.oneShot)PRICING.oneShot=p.oneShot;
  if(p.extras)PRICING.extras=p.extras.map((e,i)=>({id:e.id===undefined?i:e.id,nom:e.nom,pu:e.pu}));
  syncGrille();
}})();
persist();
applyMenuRights();
renderSessionPicker();
refreshCounts();
RENDER.dashboard();
</script>
