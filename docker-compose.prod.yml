# =============================================================================
# Docker Compose - Production Environment
# Usage: docker-compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_BASE_URL=${VITE_BASE_URL}
    container_name: soft-m-web-prod
    ports:
      - '80:80'
    environment:
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
